<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>消防設備士 演習 ／ 甲4・乙6・甲1</title>
<style>
:root{
  --paper:#EFF1EE; --card:#FFFFFF; --ink:#19212A; --muted:#66727E;
  --rule:#D5DAD4; --rule-dark:#9AA5A0;
  --shu:#B7272D; --shu-soft:#FBEDED;
  --ok:#17654A; --ok-soft:#E9F3EE;
  --flag:#9A6B12; --flag-soft:#FAF2E0;
  --band:#20303F;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--paper); color:var(--ink);
  font-family:"Hiragino Kaku Gothic ProN","Yu Gothic Medium","Yu Gothic",Meiryo,system-ui,sans-serif;
  font-size:16px; line-height:1.75; font-variant-numeric:tabular-nums;
  -webkit-text-size-adjust:100%;
}
.wrap{max-width:820px;margin:0 auto;padding:0 18px 72px}
button{font-family:inherit;font-size:inherit;cursor:pointer}
button:focus-visible,select:focus-visible{outline:2px solid var(--band);outline-offset:2px}

/* ---- header ---- */
header{background:var(--band);color:#F0F3F1;padding:20px 0 0;margin-bottom:22px}
.hd{max-width:820px;margin:0 auto;padding:0 18px}
.hd h1{margin:0;font-size:19px;font-weight:700;letter-spacing:.06em}
.hd p{margin:4px 0 16px;font-size:13px;color:#9DB0BC}
.tabs{display:flex;gap:2px}
.tab{
  flex:1;background:#2B3E4F;color:#B9C7D1;border:0;border-radius:6px 6px 0 0;
  padding:10px 6px 11px;text-align:center;line-height:1.35;transition:background .12s;
}
.tab b{display:block;font-size:14px;font-weight:700}
.tab span{display:block;font-size:11px;opacity:.8}
.tab:hover{background:#354A5D}
.tab[aria-selected="true"]{background:var(--paper);color:var(--ink)}
.tab[aria-selected="true"] span{color:var(--muted);opacity:1}

/* ---- gauge (hero) ---- */
.gauge{background:var(--card);border:1px solid var(--rule);border-radius:10px;padding:18px 20px 14px;margin-bottom:18px}
.gauge h2{margin:0 0 2px;font-size:15px;font-weight:700}
.gauge .sub{margin:0 0 16px;font-size:12.5px;color:var(--muted)}
.grow{display:grid;grid-template-columns:112px 1fr 46px;gap:10px;align-items:center;margin-bottom:9px}
.glab{font-size:12.5px;line-height:1.4}
.gtrack{position:relative;height:19px;background:#EDEFEC;border-radius:3px;overflow:hidden}
.gfill{position:absolute;left:0;top:0;bottom:0;background:var(--rule-dark);transition:width .45s ease}
.gfill.low{background:var(--shu)} .gfill.mid{background:var(--flag)} .gfill.hi{background:var(--ok)}
.gtrack i{position:absolute;top:0;bottom:0;width:1px;background:var(--band);opacity:.45}
.gtrack i.l40{left:40%} .gtrack i.l60{left:60%;opacity:.85;width:2px}
.gnum{font-size:12.5px;text-align:right;color:var(--muted)}
.legend{margin-top:12px;padding-top:11px;border-top:1px solid var(--rule);font-size:11.5px;color:var(--muted)}

/* ---- panels ---- */
.panel{background:var(--card);border:1px solid var(--rule);border-radius:10px;padding:18px 20px;margin-bottom:18px}
.panel h2{margin:0 0 12px;font-size:15px;font-weight:700}
.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(168px,1fr));gap:9px}
.mode{background:#FBFCFB;border:1px solid var(--rule);border-radius:8px;padding:12px 13px;text-align:left;transition:border-color .12s,background .12s}
.mode:hover{border-color:var(--rule-dark);background:#fff}
.mode b{display:block;font-size:14px;font-weight:700;margin-bottom:2px}
.mode span{display:block;font-size:12px;color:var(--muted);line-height:1.5}
.mode:disabled{opacity:.42;cursor:default}
.catlist{border-top:1px solid var(--rule);margin-top:14px;padding-top:12px}
.catrow{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid #EDEFEC}
.catrow:last-child{border-bottom:0}
.catrow b{flex:1;font-size:13.5px;font-weight:500}
.catrow em{font-style:normal;font-size:12px;color:var(--muted);min-width:76px;text-align:right}
.mini{background:transparent;border:1px solid var(--rule-dark);border-radius:5px;padding:4px 12px;font-size:12.5px;color:var(--ink)}
.mini:hover{background:var(--band);border-color:var(--band);color:#fff}

/* ---- lessons ---- */
.lead{margin:-6px 0 14px;font-size:12.5px;color:var(--muted)}
.lsrow{display:flex;align-items:center;gap:11px;width:100%;background:#FBFCFB;border:1px solid var(--rule);border-radius:8px;padding:11px 13px;margin-bottom:7px;text-align:left;transition:border-color .12s,background .12s}
.lsrow:hover{border-color:var(--rule-dark);background:#fff}
.lsrow i{flex:none;width:24px;height:24px;border-radius:50%;border:1px solid var(--rule-dark);display:grid;place-items:center;font-size:11.5px;font-style:normal;color:var(--muted)}
.lsrow.done i{background:var(--ok);border-color:var(--ok);color:#fff}
.lsrow b{flex:1;font-size:14px;font-weight:500}
.lsrow em{font-style:normal;font-size:11.5px;color:var(--muted)}
.lsTitle{margin:0 0 18px;font-size:21px;font-weight:700;line-height:1.5}
#lsBody h3{margin:24px 0 8px;font-size:14.5px;font-weight:700;padding-left:11px;border-left:3px solid var(--band)}
#lsBody p{margin:0 0 12px;font-size:15px;line-height:1.95}
#lsBody table{width:100%;border-collapse:collapse;margin:6px 0 16px;font-size:13.5px}
#lsBody th{background:#EDEFEC;text-align:left;font-weight:700;padding:8px 10px;border:1px solid var(--rule);line-height:1.6}
#lsBody td{padding:8px 10px;border:1px solid var(--rule);line-height:1.7;vertical-align:top}
#lsBody tr:nth-child(even) td{background:#FAFBFA}
@media(max-width:560px){#lsBody table{font-size:12.5px} #lsBody th,#lsBody td{padding:6px 7px} .lsTitle{font-size:18px}}


/* ---- 断面図 ---- */
.fig{margin:14px 0 18px;padding:12px 10px 6px;background:#FBFCFB;border:1px solid var(--rule);border-radius:8px}
.fig svg{display:block;width:100%;height:auto}
.fig figcaption{margin:4px 0 2px;font-size:12px;color:var(--muted);text-align:center}
.fg-body{fill:#fff;stroke:none}
.fg-line{fill:none;stroke:var(--ink);stroke-width:1.6;stroke-linejoin:round;stroke-linecap:round}
.fg-line .tube{stroke:#DCE2DC}
.fg-line .dot{fill:var(--ink);stroke:none}
.fg-fill-gas{fill:#EAF0F4;stroke:none}
.fg-fill-agent{fill:#DEE4E0;stroke:none}
.fg-fill-bombe{fill:#C6D0CA;stroke:none}
.fg-fill-a{fill:#E3EAE5;stroke:none}
.fg-fill-b{fill:#F4E6E6;stroke:none}
.fg-green{fill:#CBE0D3;stroke:none}
.fg-accent{fill:var(--shu);stroke:var(--shu);stroke-width:1.6;stroke-linecap:round}
.fg-mark{fill:none;stroke:var(--rule-dark);stroke-width:1.2}
.fg-lead{fill:none;stroke:var(--rule-dark);stroke-width:1}
.fg-label text{font-size:13px;fill:var(--ink)}
.fg-label text.sm{font-size:11px;fill:var(--muted)}
.fg-label text.ctr{text-anchor:middle}
.fg-label text.shu{fill:var(--shu);font-weight:700}
.fg-label text.ok{fill:var(--ok);font-weight:700}
.fg-co2-green{fill:#CBE0D3;stroke:none}
.fg-co2-red{fill:#F3DADB;stroke:none}
.fg-fill-plan{fill:#FAFBFA;stroke:none}
.fg-person{fill:none;stroke:var(--ink);stroke-width:1.8;stroke-linecap:round}
.fg-ext{fill:#F0D2D4;stroke:var(--ink);stroke-width:1.6}
.fg-dashed{fill:none;stroke:var(--shu);stroke-width:1.8;stroke-dasharray:6 5}
.fg-route{fill:none;stroke:var(--ok);stroke-width:2.6;stroke-linejoin:round;stroke-linecap:round}
.fg-tri{fill:#FBEDED;stroke:none}
.fg-cut{fill:none;stroke:var(--shu);stroke-width:2.2;stroke-linecap:round}
.fg-label text.big{font-size:30px;font-weight:700;fill:var(--ink)}
.fg-stream{fill:none;stroke:#8FB8D8;stroke-width:9;stroke-linecap:round}
.fg-drop{fill:#8FB8D8;stroke:none}
.fg-ext2{fill:#EDEFEC;stroke:var(--ink);stroke-width:1.6}
.fg-bolt{fill:none;stroke:var(--shu);stroke-width:2.4;stroke-linejoin:round}
.fg-cone{fill:#EDF1F4;stroke:none}
.fg-ring{fill:none;stroke:#C9A227;stroke-width:3;stroke-linecap:round}
.fg-pw1{fill:#F7D2DA;stroke:none}
.fg-pw2{fill:#FFFFFF;stroke:none}
.fg-pw3{fill:#CDBCE4;stroke:none}
.fg-pw4{fill:#BFC4C2;stroke:none}
.fg-bar-all{fill:#C3CEC7;stroke:none}
.fg-bar-smp{fill:#E6EBE7;stroke:none}
.fg-guide{fill:none;stroke:#D5DBD6;stroke-width:1;stroke-dasharray:4 4}
.fg-badge{fill:var(--band);stroke:none}
.fg-label text.wh{fill:#fff;text-anchor:middle;font-size:10.5px;font-weight:700}
.fg-plate{stroke:var(--ink);stroke-width:1.6}

/* ---- quiz ---- */
.qmeta{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:12px;font-size:12px;color:var(--muted)}
.qmeta .cat{background:var(--band);color:#fff;border-radius:4px;padding:2px 9px;font-size:11.5px}
.qmeta .cnt{margin-left:auto}
.qtext{font-size:17px;line-height:1.85;margin:0 0 16px;font-weight:500}
.qtext .note{display:block;font-size:14px;font-weight:400;color:var(--muted);margin-top:6px}
.choices{display:flex;flex-direction:column;gap:8px}
.ch{display:flex;gap:11px;align-items:flex-start;text-align:left;background:#FBFCFB;border:1px solid var(--rule);border-radius:8px;padding:12px 14px;line-height:1.7;transition:border-color .12s,background .12s}
.ch:hover:not(:disabled){border-color:var(--rule-dark);background:#fff}
.ch u{flex:none;text-decoration:none;width:23px;height:23px;border:1px solid var(--rule-dark);border-radius:50%;display:grid;place-items:center;font-size:12.5px;margin-top:1px}
.ch.pick-ok{border-color:var(--ok);background:var(--ok-soft)}
.ch.pick-ok u{background:var(--ok);border-color:var(--ok);color:#fff}
.ch.pick-ng{border-color:var(--shu);background:var(--shu-soft)}
.ch.pick-ng u{background:var(--shu);border-color:var(--shu);color:#fff}
.ch.reveal{border-color:var(--ok)}
.ch:disabled{cursor:default;opacity:1}
.ch.dim{opacity:.5}

.exp{margin-top:16px;border-top:2px solid var(--rule);padding-top:14px}
.verdict{font-size:14px;font-weight:700;margin:0 0 7px}
.verdict.ok{color:var(--ok)} .verdict.ng{color:var(--shu)}
.exp p{margin:0;font-size:14.5px;line-height:1.85}
.exp .ref{margin-top:9px;font-size:12.5px;color:var(--muted)}
.actions{display:flex;gap:9px;margin-top:18px;flex-wrap:wrap}
.primary{background:var(--band);color:#fff;border:1px solid var(--band);border-radius:7px;padding:10px 22px;font-size:14.5px;font-weight:700}
.primary:hover{background:#2C4155}
.ghost{background:transparent;border:1px solid var(--rule-dark);border-radius:7px;padding:10px 16px;font-size:13.5px;color:var(--ink)}
.ghost:hover{background:#EDEFEC}
.ghost.on{background:var(--flag-soft);border-color:var(--flag);color:var(--flag)}

/* ---- result ---- */
.score{text-align:center;padding:6px 0 18px}
.score b{display:block;font-size:52px;font-weight:700;line-height:1.1;letter-spacing:-.02em}
.score b small{font-size:22px;font-weight:500;color:var(--muted)}
.score p{margin:6px 0 0;font-size:14px;color:var(--muted)}
.judge{display:inline-block;margin-top:12px;border-radius:5px;padding:5px 16px;font-size:13.5px;font-weight:700}
.judge.pass{background:var(--ok-soft);color:var(--ok)}
.judge.fail{background:var(--shu-soft);color:var(--shu)}
.rlist{border-top:1px solid var(--rule);margin-top:6px}
.rrow{display:flex;gap:11px;padding:11px 0;border-bottom:1px solid #EDEFEC;font-size:13.5px;line-height:1.7}
.rrow span{flex:none;width:22px;font-weight:700}
.rrow span.o{color:var(--ok)} .rrow span.x{color:var(--shu)}
.foot{margin-top:26px;font-size:11.5px;color:var(--muted);line-height:1.8}
.foot button{background:none;border:0;color:var(--shu);text-decoration:underline;padding:0;font-size:11.5px}
.hide{display:none !important}
@media(max-width:560px){
  .wrap{padding:0 13px 60px} .hd{padding:0 13px}
  .grow{grid-template-columns:92px 1fr 42px}
  .qtext{font-size:16px} .score b{font-size:44px}
}
@media(prefers-reduced-motion:reduce){*{transition:none !important}}

.lab-home{display:flex;width:max-content;max-width:100%;align-items:center;gap:.45em;margin:0 0 14px;font-size:12.5px;line-height:1.6;letter-spacing:.02em;color:#9DB0BC;text-decoration:none;transition:color .12s}
.lab-home:hover{color:#FFFFFF;text-decoration:underline;text-underline-offset:3px}
.lab-home:focus-visible{outline:2px solid currentColor;outline-offset:3px;border-radius:2px}
</style>
</head>
<body>
<header>
  <div class="hd">
    <a class="lab-home" href="https://altxxxtla-lab.github.io/">← 学習アプリ一覧</a>
    <h1>消防設備士　演習</h1>
    <p>試験範囲に沿った書き下ろし問題集　／　解答は都度自分でテキスト照合を</p>
    <div class="tabs" role="tablist" id="tabs"></div>
  </div>
</header>

<div class="wrap">
  <!-- HOME -->
  <div id="home">
    <div class="panel" id="learnPanel">
      <h2>学ぶ</h2>
      <p class="lead">先に読んでから、その単元の問題を解きます。上から順に進めてください。</p>
      <div id="lessons"></div>
    </div>
    <div class="gauge">
      <h2 id="gTitle">科目別 到達度</h2>
      <p class="sub" id="gSub"></p>
      <div id="gRows"></div>
      <p class="legend">縦線は左が科目別足切り40％、右が合格ライン60％。全科目が40％を超え、かつ全体で60％以上が必要です。</p>
    </div>

    <div class="panel">
      <h2>演習を始める</h2>
      <div class="modes">
        <button class="mode" data-mode="random"><b>ランダム20問</b><span>全科目から出題</span></button>
        <button class="mode" data-mode="mock"><b>模擬試験</b><span id="mockDesc">本番と同じ科目配分</span></button>
        <button class="mode" data-mode="wrong" id="mWrong"><b>間違い直し</b><span id="wrongDesc">誤答した問題だけ</span></button>
        <button class="mode" data-mode="flag" id="mFlag"><b>チェック済み</b><span id="flagDesc">見直し印をつけた問題</span></button>
      </div>
      <div class="catlist" id="cats"></div>
    </div>
  </div>

  <!-- LESSON -->
  <div id="lesson" class="panel hide">
    <div class="qmeta"><span class="cat" id="lsNo"></span><span class="cnt" id="lsOf"></span></div>
    <h2 class="lsTitle" id="lsTitle"></h2>
    <div id="lsBody"></div>
    <div class="actions">
      <button class="primary" id="btnLsQuiz"></button>
      <button class="ghost" id="btnLsNext">次の単元</button>
      <button class="ghost" id="btnLsBack">一覧にもどる</button>
    </div>
  </div>

  <!-- QUIZ -->
  <div id="quiz" class="panel hide">
    <div class="qmeta">
      <span class="cat" id="qCat"></span>
      <span id="qId"></span>
      <span class="cnt" id="qCnt"></span>
    </div>
    <p class="qtext" id="qText"></p>
    <div class="choices" id="qChoices"></div>
    <div class="exp hide" id="qExp">
      <p class="verdict" id="qVerdict"></p>
      <p id="qExpText"></p>
      <p class="ref hide" id="qRef"></p>
    </div>
    <div class="actions">
      <button class="primary hide" id="btnNext">次の問題</button>
      <button class="ghost" id="btnFlag">見直し印</button>
      <button class="ghost" id="btnQuit">中断してもどる</button>
    </div>
  </div>

  <!-- RESULT -->
  <div id="result" class="panel hide">
    <div class="score">
      <b id="rScore"></b>
      <p id="rSub"></p>
      <div id="rJudge"></div>
    </div>
    <div class="rlist" id="rList"></div>
    <div class="actions">
      <button class="primary" id="btnHome">ホームにもどる</button>
      <button class="ghost hide" id="btnRetryWrong">誤答だけもう一度</button>
      <button class="ghost hide" id="btnLsCont">次の単元へ進む</button>
    </div>
  </div>

  <p class="foot" id="foot"></p>
</div>

<script>
const BANK = {
common: [
{i:'CM01',c:'kyo',q:'消防設備士免状の書換えを申請しなければならないのは、次のうちどれか。',o:['本籍地の都道府県が変わったとき','勤務先の会社が変わったとき','引っ越して住所が変わったとき','免状を亡失したとき'],a:0,e:'書換えが必要なのは、免状の記載事項（氏名・本籍地の都道府県・生年月日など）に変更が生じたときと、免状に貼ってある写真が撮影から10年を経過したときです。住所や勤務先は免状の記載事項ではないため、変わっても書換えは不要。亡失した場合は「書換え」ではなく「再交付」の手続きになります。'},
{i:'CM02',c:'kyo',q:'免状を亡失して再交付を受けた後、亡失した免状を発見した場合の措置として正しいものはどれか。',o:['発見した日から10日以内に、再交付を受けた都道府県知事に提出する','発見した日から14日以内に、居住地の消防長に提出する','発見した免状を破棄すればよく、届出は不要である','発見した日から30日以内に、総務大臣に返納する'],a:0,e:'亡失した免状を発見したときは、発見した日から10日以内に、再交付を受けた都道府県知事へ提出しなければなりません。「10日以内」「再交付を受けた知事」の2点がよく狙われます。'},
{i:'CM03',c:'kyo',q:'消防設備士が受けなければならない講習について、正しいものはどれか。',o:['免状の交付を受けた日から2年以内、その後は5年以内ごとに受講する','免状の交付を受けた日以後における最初の4月1日から2年以内、その後は講習を受けた日以後における最初の4月1日から5年以内ごとに受講する','3年以内ごとに繰り返し受講する','業務に従事していない期間は受講義務がない'],a:1,e:'起算日が「交付日」ではなく「交付日以後における最初の4月1日」である点が引っかけです。初回は2年以内、2回目以降は直前の講習日以後最初の4月1日から5年以内ごと。業務に従事していなくても、免状を持っている限り受講義務があります。'},
{i:'CM04',c:'kyo',q:'甲種消防設備士が工事に着手しようとする場合、着工届はいつ、誰に提出するか。',o:['着手しようとする日の7日前までに、都道府県知事','着手しようとする日の10日前までに、消防長または消防署長','工事完了後4日以内に、消防長または消防署長','着手した日から10日以内に、都道府県知事'],a:1,e:'着工届は「工事に着手しようとする日の10日前までに」「消防長または消防署長へ」、甲種消防設備士本人が届け出ます。工事完了後4日以内に届け出るのは、関係者が行う設置届（検査申請）で、こちらと混同させる問題が頻出です。'},
{i:'CM05',c:'kyo',q:'消防用設備等を設置したときの届出および検査について、正しいものはどれか。',o:['工事をした消防設備士が、完了後10日以内に届け出る','関係者が、工事完了後4日以内に消防長または消防署長に届け出て検査を受ける','関係者が、工事完了後14日以内に都道府県知事に届け出る','届出は必要だが、検査は任意である'],a:1,e:'設置届は「関係者（所有者・管理者・占有者）」が「工事が完了した日から4日以内」に消防長または消防署長へ届け出て、検査を受けます。届出義務者が消防設備士ではない点に注意。'},
{i:'CM06',c:'kyo',q:'消防用設備等の点検結果の報告期間について、正しい組合せはどれか。',o:['特定防火対象物は1年に1回、非特定防火対象物は3年に1回','特定防火対象物は6か月に1回、非特定防火対象物は1年に1回','用途にかかわらず1年に1回','特定防火対象物は1年に1回、非特定防火対象物は2年に1回'],a:0,e:'報告は特定防火対象物が1年に1回、非特定防火対象物が3年に1回です。これとは別に、点検そのものは機器点検が6か月ごと、総合点検が1年ごとに行います。「点検の周期」と「報告の周期」を混ぜた選択肢に注意してください。'},
{i:'CM07',c:'kyo',q:'次のうち、特定防火対象物に該当しないものはどれか。',o:['映画館','旅館','小学校','地下街'],a:2,e:'特定防火対象物は不特定多数が出入りする、または避難が困難な人が利用する用途で、劇場・映画館、キャバレー、飲食店、百貨店、旅館・ホテル、病院・福祉施設、地下街などが該当します。小学校（(7)項 学校）は在館者が特定されているため非特定防火対象物です。共同住宅((5)項ロ)や事務所((15)項)も非特定です。'},
{i:'CM08',c:'kyo',q:'消防用設備等の技術上の基準が改正された場合、既存の防火対象物には原則として改正前の基準が適用される（既存不遡及）が、次のうち常に改正後の基準に適合させなければならない設備はどれか。',o:['屋内消火栓設備','消火器','連結送水管','スプリンクラー設備'],a:1,e:'既存不遡及の例外として、消火器、避難器具、簡易消火用具、自動火災報知設備（特定防火対象物などに設けるもの）、ガス漏れ火災警報設備、漏電火災警報器、非常警報器具・設備、誘導灯・誘導標識は、常に改正後の基準に適合させる必要があります。また、防火対象物が特定防火対象物である場合は、設備の種類を問わず遡及適用されます。'},
{i:'CM09',c:'kyo',q:'消防用機械器具等の検定制度について、正しいものはどれか。',o:['型式承認は日本消防検定協会が行い、型式適合検定は総務大臣が行う','型式承認は総務大臣が行い、型式適合検定は日本消防検定協会等が行う','型式承認・型式適合検定とも都道府県知事が行う','型式適合検定に合格すれば、型式承認は不要である'],a:1,e:'型式承認は総務大臣が行う「形状等が技術上の規格に適合している」という承認、型式適合検定は日本消防検定協会または登録検定機関が行う「個々の製品が承認を受けた型式に適合するか」の検定です。両方に合格し、検定合格表示が付されていないものは販売・販売目的の陳列・工事への使用ができません。'},
{i:'CM10',c:'kyo',q:'次のうち、検定の対象となる消防用機械器具等に含まれないものはどれか。',o:['閉鎖型スプリンクラーヘッド','消火器用消火薬剤','漏電火災警報器','緩降機'],a:2,e:'検定対象品目は、消火器、消火器用消火薬剤、泡消火薬剤、感知器・発信機、中継器、受信機、住宅用防災警報器、閉鎖型スプリンクラーヘッド、流水検知装置、一斉開放弁、金属製避難はしご、緩降機の12品目です。漏電火災警報器は、かつての検定対象から自主表示対象機械器具等へ移されており、検定対象には含まれません。'},
{i:'CM11',c:'kyo',q:'消防用設備等の分類において、「消火活動上必要な施設」に該当しないものはどれか。',o:['連結送水管','非常コンセント設備','排煙設備','誘導灯'],a:3,e:'消防用設備等は「消防の用に供する設備（消火設備・警報設備・避難設備）」「消防用水」「消火活動上必要な施設」に分かれます。消火活動上必要な施設は、排煙設備、連結散水設備、連結送水管、非常コンセント設備、無線通信補助設備の5つ。誘導灯は避難設備です。'},
{i:'CM12',c:'kyo',q:'防火管理者の選任を要する防火対象物として、正しいものはどれか。',o:['特定防火対象物で収容人員30人以上、非特定防火対象物で収容人員50人以上','用途にかかわらず収容人員50人以上','特定防火対象物で収容人員50人以上、非特定防火対象物で収容人員30人以上','延べ面積300㎡以上のすべての防火対象物'],a:0,e:'防火管理者が必要なのは、特定防火対象物で収容人員30人以上、非特定防火対象物で収容人員50人以上（自力避難困難者入所施設は10人以上）です。なお甲種・乙種の区分は延べ面積で決まり、特定は300㎡以上、非特定は500㎡以上が甲種となります。'},
{i:'CM13',c:'kyo',q:'消防同意について、正しいものはどれか。',o:['建築主が消防長または消防署長に直接申請する','建築主事等が、建築確認をする前に消防長または消防署長の同意を得る','工事完了後に消防長の同意を得る','都道府県知事の同意を得る'],a:1,e:'消防同意は、建築主事や指定確認検査機関が建築確認をしようとするときに、その建築物の所在地を管轄する消防長または消防署長の同意を得る制度です。同意を求めるのは建築主ではなく建築主事等である点が問われます。'},
{i:'CM14',c:'kyo',q:'無窓階の定義として、正しいものはどれか。',o:['窓が全くない階','避難上または消火活動上有効な開口部を有しない階','地階のうち窓がない階','窓の面積が床面積の10分の1未満の階'],a:1,e:'無窓階とは、建築物の地上階のうち、避難上または消火活動上有効な開口部を有しない階をいいます。窓がゼロという意味ではなく、開口部の大きさ・位置・格子の有無などの要件を満たさない場合に無窓階となります。無窓階は設置基準が厳しくなるため、判定は重要です。'},
{i:'CM15',c:'kyo',q:'消防設備士でなければ行ってはならない工事または整備に該当するものはどれか。',o:['屋内消火栓設備の表示灯の交換','消火栓箱の補修','自動火災報知設備の感知器の交換','電源部分の工事'],a:2,e:'表示灯の交換、消火栓箱やホース・ノズルの補修など軽微な整備、および電源・水源・配管の部分の工事は、消防設備士でなくても行えます。感知器や受信機の交換など設備本体に関わる整備・工事は消防設備士の独占業務です。'},
{i:'CM16',c:'kyo',q:'消防設備士免状について、正しいものはどれか。',o:['交付を受けた都道府県内でのみ有効である','全国どこでも有効である','5年ごとに更新しなければ失効する','消防設備士でなくなったときは返納しなければならない'],a:1,e:'免状は交付した都道府県知事にかかわらず全国で有効です。有効期限による失効はなく、講習を受けなければならない義務はありますが、受講しなくても直ちに失効するのではなく、免状の返納命令の対象になり得るという扱いです。'},
{i:'CM17',c:'kyo',q:'消防長または消防署長が行う立入検査について、正しいものはどれか。',o:['個人の住居には、関係者の承諾があるか火災発生のおそれが著しく大であり特に緊急の必要がある場合でなければ立ち入れない','いかなる場合も個人の住居には立ち入れない','事前に必ず日時を通告しなければならない','立入検査は日出から日没までに限られる'],a:0,e:'立入検査は原則として時間の制限なく行えますが、個人の住居については関係者の承諾を得た場合か、火災発生のおそれが著しく大であって特に緊急の必要がある場合に限られます。事前通告の義務や日出から日没までという制限は、現行法では設けられていません。'},
{i:'CM18',c:'kyo',q:'防火対象物の関係者に対して、消防用設備等が技術上の基準に従って設置されていない場合に、その設置を命ずることができる者はどれか。',o:['都道府県知事','総務大臣','消防長または消防署長','建築主事'],a:2,e:'設置命令・維持命令は消防長または消防署長が、防火対象物の関係者で権原を有する者に対して行います。命令に違反した場合は罰則の対象となり、法人にも両罰規定が適用されます。'}
],
ko4: {

cats:{kyo:'消防関係法令（共通）',rui:'消防関係法令（4類）',kiso:'電気に関する基礎的知識',kozo:'構造・機能・工事・整備',kan:'実技（鑑別）'},
mock:{kyo:8,rui:7,kiso:10,kozo:20,kan:5},
pass:'筆記は各科目40％以上かつ全体60％以上、実技60％以上',
q:[
{i:'K401',c:'rui',q:'自動火災報知設備の警戒区域について、原則として正しいものはどれか。',o:['面積600㎡以下、一辺の長さ50m以下','面積500㎡以下、一辺の長さ50m以下','面積600㎡以下、一辺の長さ100m以下','面積1000㎡以下、一辺の長さ50m以下'],a:0,e:'警戒区域は原則、面積600㎡以下・一辺の長さ50m以下。ただし主要な出入口からその内部を見通すことができる場合は1000㎡以下とでき、光電式分離型感知器を設置する場合は一辺を100m以下とできます。'},
{i:'K402',c:'rui',q:'警戒区域が2以上の階にわたることが認められる場合として、正しいものはどれか。',o:['2の階にわたる部分の床面積の合計が500㎡以下のとき','2の階にわたる部分の床面積の合計が600㎡以下のとき','いかなる場合も認められない','階数が3以下のとき'],a:0,e:'警戒区域は原則として2以上の階にわたってはなりませんが、2の階にわたる部分の床面積の合計が500㎡以下の場合は認められます。また、階段・傾斜路・エレベーター昇降路などのたて穴区画は別に警戒区域を設定します。600㎡は1警戒区域の面積の上限であり、混同しやすい数値です。'},
{i:'K403',c:'rui',q:'次のうち、延べ面積にかかわらず自動火災報知設備を設置しなければならない防火対象物はどれか。',o:['飲食店','事務所','旅館・ホテル','小学校'],a:2,e:'(5)項イの旅館・ホテル・宿泊所は、延べ面積に関係なく全部に設置が必要です。ほかに(6)項イ(1)〜(3)の病院・診療所、(6)項ロの自力避難困難者入所施設、(2)項ニ（カラオケボックス等）、(13)項ロ（飛行機格納庫）、(17)項（重要文化財）などが面積無関係で必要となります。'},
{i:'K404',c:'rui',q:'地階・無窓階・3階以上の階で、床面積が何㎡以上のときに自動火災報知設備の設置が必要となるか（一般の場合）。',o:['100㎡以上','200㎡以上','300㎡以上','500㎡以上'],a:2,e:'地階、無窓階、3階以上の階は、床面積300㎡以上で設置が必要です。また11階以上の階はすべての階に必要で、駐車の用に供する部分で地階または2階以上にあり床面積200㎡以上の場合、通信機器室で床面積500㎡以上の場合も設置対象です。'},
{i:'K405',c:'rui',q:'地区音響装置の設置について、正しいものはどれか。',o:['各階の各部分から一の地区音響装置までの水平距離が25m以下','各階の各部分から一の地区音響装置までの歩行距離が25m以下','各階の各部分から一の地区音響装置までの水平距離が50m以下','各階の各部分から一の地区音響装置までの歩行距離が50m以下'],a:0,e:'地区音響装置は水平距離25m以下です。音圧は取付位置の中心から1m離れた位置で90dB以上（音声によるものは92dB以上）。一方、発信機は各階の各部分から一の発信機までの歩行距離50m以下で、「水平距離／歩行距離」「25m／50m」の組合せが頻出の引っかけです。'},
{i:'K406',c:'rui',q:'P型2級受信機（1回線用を除く）を設置できる防火対象物の延べ面積の上限はどれか。',o:['150㎡以下','350㎡以下','500㎡以下','制限はない'],a:2,e:'P型2級受信機は延べ面積500㎡以下、P型2級1回線用は350㎡以下、P型3級は150㎡以下の防火対象物に設置できます。P型1級には面積制限がありません。数値の並び（150／350／500）をセットで覚えるのが有効です。'},
{i:'K407',c:'rui',q:'自動火災報知設備の予備電源が満たすべき性能として、正しいものはどれか。',o:['監視状態を60分間継続した後、2回線を10分間作動させられること','監視状態を30分間継続した後、2回線を10分間作動させられること','監視状態を60分間継続した後、1回線を10分間作動させられること','監視状態を10分間継続した後、2回線を60分間作動させられること'],a:0,e:'予備電源は密閉型蓄電池とし、監視状態を60分間継続した後、2回線を10分間有効に作動させられる容量が必要です。また、常用電源が停電したときは自動的に予備電源に切り替わり、復旧時は自動的に常用電源に復帰する必要があります。'},
{i:'K408',c:'rui',q:'自動火災報知設備の非常電源として蓄電池設備によらなければならないのは、どのような防火対象物か。',o:['延べ面積1000㎡以上の特定防火対象物','延べ面積500㎡以上のすべての防火対象物','地階を有するすべての防火対象物','11階以上の階を有する防火対象物'],a:0,e:'延べ面積1000㎡以上の特定防火対象物では、非常電源は蓄電池設備によらなければなりません。それ以外は非常電源専用受電設備でも認められます。'},
{i:'K409',c:'kozo',q:'差動式スポット型感知器2種を、主要構造部を耐火構造とした取付面の高さ4m未満の場所に設ける場合、1個あたりの感知面積はいくらか。',o:['90㎡','70㎡','45㎡','35㎡'],a:1,e:'差動式スポット型は耐火構造・4m未満で1種が90㎡、2種が70㎡。4m以上8m未満になるとそれぞれ半分の45㎡、35㎡になります。耐火構造でない場合は1種50㎡・2種40㎡（4m未満）とさらに小さくなります。'},
{i:'K410',c:'kozo',q:'定温式スポット型感知器の公称作動温度について、正しいものはどれか。',o:['取付場所の最高周囲温度より20℃以上高いものを選ぶ','取付場所の最高周囲温度より10℃以上高いものを選ぶ','取付場所の平均温度と同じものを選ぶ','取付場所の最低周囲温度より20℃以上高いものを選ぶ'],a:0,e:'定温式スポット型は、正常時の熱で誤作動しないよう、取付場所の最高周囲温度より20℃以上高い公称作動温度のものを選定します。公称作動温度の範囲は60℃以上150℃以下で、60〜80℃までは5℃刻み、80℃を超えるものは10℃刻みです。'},
{i:'K411',c:'kozo',q:'煙感知器（1種・2種）を廊下および通路に設ける場合の設置間隔として、正しいものはどれか。',o:['歩行距離30mにつき1個以上','水平距離30mにつき1個以上','歩行距離20mにつき1個以上','水平距離15mにつき1個以上'],a:0,e:'廊下・通路には歩行距離30m（3種は20m）につき1個以上設けます。階段・傾斜路では垂直距離15m（3種は10m）につき1個以上。「廊下は歩行距離30m、階段は垂直距離15m」とセットで覚えると混乱しません。'},
{i:'K412',c:'kozo',q:'煙感知器を設置する際、換気口等の空気吹出し口から離すべき距離として正しいものはどれか。',o:['0.6m以上','1.0m以上','1.5m以上','3.0m以上'],a:2,e:'煙感知器は空気吹出し口から1.5m以上離して設けます。また感知器の下端は取付面の下方0.6m以内（熱感知器は0.3m以内）とし、吸気口がある場合はその付近に設けます。'},
{i:'K413',c:'kozo',q:'差動式スポット型感知器の取付けについて、正しいものはどれか。',o:['取付面に対して45度以上傾斜させて設ける','取付面に対して45度以上傾斜させないこと','傾斜角度に制限はない','垂直な壁面にのみ設ける'],a:1,e:'差動式スポット型・補償式スポット型・定温式スポット型は、45度以上傾斜させて設けてはなりません。傾斜させると空気室内の熱の伝わり方が変わり、性能が確保できないためです。'},
{i:'K414',c:'kozo',q:'感知器回路の共通線1本が受け持つことができる警戒区域の数の上限はどれか。',o:['5警戒区域','7警戒区域','10警戒区域','15警戒区域'],a:1,e:'共通線1本につき7警戒区域以下です。8警戒区域あれば共通線は2本必要になります。合わせて、P型1級受信機の感知器回路の電路の抵抗は50Ω以下という数値も頻出です。'},
{i:'K415',c:'kozo',q:'P型1級受信機の感知器回路を送り配線とし、末端に発信機や回路試験器等を設ける理由はどれか。',o:['断線の有無を確認する導通試験を行うため','絶縁抵抗を測定するため','受信機の予備電源を試験するため','地区音響装置の音圧を測定するため'],a:0,e:'感知器回路は送り配線とし、末端に発信機・押しボタン・回路試験器のいずれかを設けます。これにより受信機側から回路の導通試験ができ、断線を検出できます。分岐配線にすると断線箇所を検出できなくなるため認められません。'},
{i:'K416',c:'kozo',q:'自動火災報知設備の配線について、正しいものはどれか。',o:['60V以下の弱電流回線と同一の管に収めてよい','電源回路と同一の管に収めてよい','他の回線と同一の管に収めてはならないが、60V以下の弱電流回路は例外として同一の管に収めることができる','すべての回線を同一の管に収めなければならない'],a:2,e:'自動火災報知設備の配線は他の電線と同一の管・ダクト等に収めてはならないのが原則ですが、60V以下の弱電流回路に用いる電線は例外として同一の管に収めることができます。誘導障害を避けるための規定です。'},
{i:'K417',c:'kozo',q:'受信機の主音響装置の音圧として、正しいものはどれか（P型3級・GP型3級を除く）。',o:['取付面から1m離れた位置で70dB以上','取付面から1m離れた位置で85dB以上','取付面から1m離れた位置で90dB以上','取付面から3m離れた位置で85dB以上'],a:1,e:'受信機の主音響装置は1m離れた位置で85dB以上（P型3級・GP型3級の受信機は70dB以上）。地区音響装置の90dB以上と混同しやすいので、「主音響85／地区音響90／3級70」と整理しておきましょう。'},
{i:'K418',c:'kozo',q:'光電式分離型感知器の公称監視距離の範囲として、正しいものはどれか。',o:['5m以上100m以下（5m刻み）','1m以上50m以下','10m以上100m以下（10m刻み）','5m以上50m以下'],a:0,e:'光電式分離型感知器の公称監視距離は5m以上100m以下で、5m刻みです。設置時は送光部と受光部を背部の壁から1m以内、光軸は壁から0.6m以上離し、天井高の80％以上の高さに設けます。'},
{i:'K419',c:'kozo',q:'煙感知器を設置してはならない場所として、適当なものはどれか。',o:['ホテルの客室','事務所の廊下','厨房など煙が多量に滞留する場所','エレベーターの昇降路'],a:2,e:'厨房・浴室など水蒸気や煙が多量に滞留する場所、著しく高温となる場所、排気ガスが多量に滞留する場所などには煙感知器を設けません。厨房には定温式スポット型（防水型）が一般的です。エレベーター昇降路は逆に煙感知器を設ける代表的な場所です。'},
{i:'K420',c:'kozo',q:'差動式分布型感知器（空気管式）の空気管の露出部分の長さについて、正しいものはどれか。',o:['1感知区域ごとに20m以上','1感知区域ごとに10m以上','1感知区域ごとに5m以上','制限はない'],a:0,e:'空気管は1感知区域ごとに露出部分が20m以上必要で、1つの検出部に接続する空気管の長さは100m以下です。取付けは壁面から1.5m以内、相互間隔は6m以下（耐火構造は9m以下）とします。'},
{i:'K421',c:'kozo',q:'自動火災報知設備の絶縁抵抗試験において、対地電圧150V以下の電路で必要な絶縁抵抗値はどれか。',o:['0.1MΩ以上','0.2MΩ以上','0.4MΩ以上','1.0MΩ以上'],a:0,e:'電路と大地間および配線相互間の絶縁抵抗は、対地電圧150V以下で0.1MΩ以上、150Vを超え300V以下で0.2MΩ以上、300Vを超えるもので0.4MΩ以上です。測定には直流500Vの絶縁抵抗計を用います。'},
{i:'K422',c:'kozo',q:'受信機の火災表示試験で確認する内容として、適当でないものはどれか。',o:['地区表示装置が正しい警戒区域を表示すること','主音響装置および地区音響装置が鳴動すること','火災灯が点灯すること','感知器回路の断線の有無'],a:3,e:'火災表示試験は、火災表示試験スイッチと回線選択スイッチを操作し、火災灯・地区表示・音響装置の作動と自己保持機能を確認するものです。感知器回路の断線を調べるのは回路導通試験で、目的が異なります。'},
{i:'K423',c:'kozo',q:'発信機（P型1級）の設置高さとして、正しいものはどれか。',o:['床面から0.8m以上1.5m以下','床面から1.0m以上1.8m以下','床面から0.5m以上1.0m以下','床面から1.5m以上2.0m以下'],a:0,e:'発信機は床面から0.8m以上1.5m以下の高さに設けます。設置間隔は各階の各部分から一の発信機までの歩行距離50m以下。近くには赤色の表示灯を、取付面と15度以上の角度となる方向に沿って10m離れた位置から点灯が容易に識別できるように設けます。'},
{i:'K424',c:'kozo',q:'P型1級発信機とP型2級発信機の違いとして、正しいものはどれか。',o:['1級には電話ジャックと応答ランプがあるが、2級にはない','2級には電話ジャックがあるが、1級にはない','1級は押しボタン式、2級はレバー式である','1級は屋外用、2級は屋内用である'],a:0,e:'P型1級発信機には受信機との相互通話用の電話ジャックと、信号が受信機に伝わったことを知らせる応答ランプ（確認灯）があります。P型2級発信機にはこれらがありません。'},
{i:'K425',c:'kozo',q:'中継器の役割として、正しいものはどれか。',o:['感知器・発信機からの信号を受け、受信機や消火設備等へ発信するもの','火災を直接感知するもの','火災を音響により報知するもの','電源を供給するためだけのもの'],a:0,e:'中継器は、感知器または発信機から発せられた信号を受信し、これを受信機や消火設備等に発信するものです。電源を必要とするものと必要としないものがあり、電源を必要とするものは予備電源が必要（受信機から電源を供給されるものを除く）です。'},
{i:'K426',c:'kiso',q:'抵抗3Ω、4Ω、6Ωを並列に接続したときの合成抵抗はいくらか。',o:['1.33Ω','2.0Ω','4.33Ω','13Ω'],a:0,e:'並列合成抵抗は 1/R = 1/3 + 1/4 + 1/6 = 4/12 + 3/12 + 2/12 = 9/12。よって R = 12/9 ≒ 1.33Ω です。並列接続の合成抵抗は必ず最小の抵抗（この場合3Ω）より小さくなるので、それだけで選択肢を1つに絞れます。'},
{i:'K427',c:'kiso',q:'100Vの電源に、抵抗20Ωの負荷を接続したときの消費電力はいくらか。',o:['200W','500W','2000W','5000W'],a:1,e:'P = V²/R = 100² ÷ 20 = 10000 ÷ 20 = 500W。電流から求めるなら I = 100/20 = 5A、P = VI = 100×5 = 500W。どちらの式でも同じ結果になります。'},
{i:'K428',c:'kiso',q:'交流回路において、抵抗8Ω、誘導リアクタンス6Ωを直列接続したときのインピーダンスはいくらか。',o:['10Ω','14Ω','2Ω','48Ω'],a:0,e:'Z = √(R² + X²) = √(8² + 6²) = √(64+36) = √100 = 10Ω。3:4:5の直角三角形の比になっており、この組合せは出題頻度が高いので覚えておくと計算が速くなります。力率は cosθ = R/Z = 8/10 = 0.8 です。'},
{i:'K429',c:'kiso',q:'コンデンサ3μFと6μFを直列に接続したときの合成静電容量はいくらか。',o:['2μF','4.5μF','9μF','18μF'],a:0,e:'コンデンサの直列合成は抵抗の並列と同じ計算で、1/C = 1/3 + 1/6 = 3/6 なので C = 2μF。並列接続なら単純な和で9μFになります。抵抗と逆になる点が引っかけどころです。'},
{i:'K430',c:'kiso',q:'指示電気計器のうち、直流専用で交流の測定に使用できないものはどれか。',o:['可動コイル形','可動鉄片形','電流力計形','熱電形'],a:0,e:'可動コイル形は永久磁石を用いるため直流専用です。可動鉄片形は交流用（主に商用周波数）、電流力計形と熱電形は交直両用。可動コイル形は感度が高く目盛が均等という特徴があります。'},
{i:'K431',c:'kiso',q:'変圧器の一次側巻数1000回、二次側巻数100回、一次側電圧200Vのとき、二次側電圧はいくらか。',o:['10V','20V','2000V','2V'],a:1,e:'変圧比は巻数比に等しいので、V₂ = V₁ × (N₂/N₁) = 200 × (100/1000) = 20V。電流は逆比になり、二次側電流は一次側の10倍になります。'},
{i:'K432',c:'kiso',q:'導体の電気抵抗について、正しいものはどれか。',o:['断面積に比例し、長さに反比例する','長さに比例し、断面積に反比例する','長さにも断面積にも比例する','長さにも断面積にも反比例する'],a:1,e:'R = ρL/A で、長さLに比例し断面積Aに反比例します。ρは抵抗率で材料によって決まり、温度が上がると金属導体の抵抗は増加します。'},
{i:'K433',c:'kiso',q:'ホイートストンブリッジ回路が平衡している条件として、正しいものはどれか。',o:['対辺の抵抗の積が等しい','隣り合う抵抗の積が等しい','すべての抵抗が等しい','抵抗の和が等しい'],a:0,e:'向かい合う（対辺の）抵抗の積が等しいとき、検流計に電流が流れず平衡します。P·R = Q·X の関係から未知抵抗を精密に測定できます。'},
{i:'K434',c:'kiso',q:'三相誘導電動機の回転方向を逆にする方法として、正しいものはどれか。',o:['電源電圧を下げる','三相のうち任意の2線を入れ替える','周波数を変える','三相すべての線を入れ替える'],a:1,e:'三相のうち任意の2線を入れ替えると回転磁界の向きが反転し、逆回転します。3線すべてを入れ替えても相順は変わらないため回転方向は変わりません。'},
{i:'K435',c:'kan',q:'差動式スポット型感知器の作動原理として、正しいものはどれか。',o:['周囲の温度が一定の温度以上になったときに作動する','周囲の温度の上昇率が一定の率以上になったときに作動する','煙が一定の濃度以上になったときに作動する','炎から放射される紫外線を検知して作動する'],a:1,e:'差動式は「温度上昇率」に反応します。空気室の空気が膨張してダイヤフラムを押し上げ接点が閉じる仕組みで、リーク孔が緩やかな温度変化を逃がすことで誤作動を防いでいます。一定温度で作動するのが定温式、両方の性能を持つのが補償式です。'},
{i:'K436',c:'kan',q:'差動式スポット型感知器のリーク孔が詰まった場合に生じる現象はどれか。',o:['作動しにくくなる','非火災報（誤作動）が起きやすくなる','変化はない','断線警報が出る'],a:1,e:'リーク孔は暖房などによる緩やかな温度上昇時に空気を逃がす役割を持ちます。詰まると空気が逃げられず、火災でない温度変化でもダイヤフラムが押し上げられて誤作動（非火災報）を起こします。逆にリーク孔が大きすぎると、火災時でも空気が逃げてしまい作動が遅れます。'},
{i:'K437',c:'kan',q:'差動式分布型感知器（空気管式）の機能試験で、空気管の漏れやつまりを調べる試験はどれか。',o:['火災作動試験','作動継続試験','流通試験','接点水高試験'],a:2,e:'流通試験はテストポンプで空気を送り、マノメーターの水位の下がり方（流通時間）から空気管の漏れ・つまり・つぶれを判定します。接点水高試験は接点間隔の適否、火災作動試験は作動時間、作動継続試験は作動継続時間を確認する試験です。'},
{i:'K438',c:'kan',q:'加熱試験器（火災試験器）を用いて機能を確認する感知器はどれか。',o:['光電式スポット型感知器','定温式スポット型感知器','炎感知器','ガス漏れ検知器'],a:1,e:'定温式・差動式などの熱感知器には加熱試験器を使用します。煙感知器には加煙試験器、炎感知器には専用の作動試験器を用います。試験器の対応関係は鑑別でよく問われます。'},
{i:'K439',c:'kan',q:'受信機の回路導通試験で、断線が確認された場合に考えられる原因として適当でないものはどれか.',o:['感知器回路の配線が切断されている','終端抵抗が外れている','感知器の接触不良','地区音響装置のスピーカーが故障している'],a:3,e:'回路導通試験は感知器回路の電気的な導通を見るものなので、配線の断線・終端抵抗の脱落・端子の接触不良などが原因になります。地区音響装置の故障は導通試験の結果には現れません。'},
{i:'K440',c:'kan',q:'メガー（絶縁抵抗計）を用いて自動火災報知設備の絶縁抵抗を測定する際、使用する電圧はどれか。',o:['直流100V','直流250V','直流500V','交流100V'],a:2,e:'自動火災報知設備の絶縁抵抗測定には直流500Vの絶縁抵抗計を用います。測定前には必ず電源を切り、コンデンサが入っている回路では放電させてから測定します。'}
]},
otsu6: {
name:'乙種6類', sub:'消火器',
cats:{kyo:'消防関係法令（共通）',rui:'消防関係法令（6類）',kiso:'機械に関する基礎的知識',kozo:'構造・機能・整備',kan:'実技（鑑別）'},
mock:{kyo:6,rui:4,kiso:5,kozo:15,kan:5},

q:[
{i:'O601',c:'rui',q:'消火器を設置する場合、防火対象物の各部分から一の消火器までの歩行距離の上限はどれか。',o:['大型消火器は20m以下、その他は30m以下','大型消火器は30m以下、その他は20m以下','用途にかかわらず20m以下','用途にかかわらず30m以下'],a:1,e:'大型消火器は歩行距離30m以下、それ以外の消火器は20m以下です。「大型のほうが数が少なくてよい＝距離が長い」と理解すると取り違えません。なお水平距離ではなく歩行距離である点にも注意。'},
{i:'O602',c:'rui',q:'消火器の設置高さと標識について、正しいものはどれか。',o:['床面から1.5m以下の高さに設け、「消火器」と表示した標識を設ける','床面から1.0m以下の高さに設け、標識は不要である','床面から1.5m以上の高さに設ける','高さの制限はないが標識は必要である'],a:0,e:'消火器は床面からの高さ1.5m以下の位置に設け、見やすい箇所に「消火器」と表示した標識を設けます。標識は長辺24cm以上、短辺8cm以上で、地色は赤、文字は白です。'},
{i:'O603',c:'rui',q:'電気設備がある場所に消火器具を設ける場合の基準として、正しいものはどれか。',o:['床面積100㎡以下ごとに1個','床面積50㎡以下ごとに1個','床面積200㎡以下ごとに1個','床面積300㎡以下ごとに1個'],a:0,e:'変圧器や配電盤などの電気設備がある場所には、床面積100㎡以下ごとに1個、電気火災に適応する消火器を設けます。ボイラー室など多量の火気を使用する場所は床面積を25㎡で除した数以上の能力単位が必要です。'},
{i:'O604',c:'rui',q:'消火器具の能力単位の算定において、主要構造部が耐火構造であり、かつ内装が難燃材料で仕上げられている場合の扱いとして正しいものはどれか。',o:['算定基準面積を2倍にできる','算定基準面積を半分にする','能力単位を2倍にする','変わらない'],a:0,e:'主要構造部が耐火構造で、壁および天井の室内に面する部分の仕上げが難燃材料の場合、算定基準面積を2倍にできます。たとえば基準面積100㎡の用途なら200㎡で1単位となり、必要な能力単位が半分で済みます。'},
{i:'O605',c:'rui',q:'大型消火器の能力単位として、正しいものはどれか。',o:['A火災10単位以上またはB火災20単位以上','A火災20単位以上またはB火災10単位以上','A火災5単位以上またはB火災10単位以上','A火災10単位以上かつB火災20単位以上'],a:0,e:'大型消火器はA火災10単位以上またはB火災20単位以上のもので、「または」である点がポイント。薬剤量も規定があり、水80L以上、強化液60L以上、機械泡20L以上、化学泡80L以上、二酸化炭素50kg以上、粉末20kg以上です。'},
{i:'O606',c:'kozo',q:'蓄圧式消火器（二酸化炭素消火器等を除く）の指示圧力計の使用圧力範囲として、正しいものはどれか。',o:['0.5MPa以上0.8MPa以下','0.7MPa以上0.98MPa以下','0.9MPa以上1.2MPa以下','1.0MPa以上1.5MPa以下'],a:1,e:'蓄圧式消火器の使用圧力範囲は0.7〜0.98MPaで、指示圧力計の緑色の範囲がこれにあたります。二酸化炭素消火器およびハロン1301消火器は高圧ガス保安法の適用を受け、指示圧力計は設けません。'},
{i:'O607',c:'kozo',q:'化学泡消火器の外筒に入れる薬剤（A剤）と内筒に入れる薬剤（B剤）の組合せとして、正しいものはどれか。',o:['A剤＝硫酸アルミニウム、B剤＝炭酸水素ナトリウム','A剤＝炭酸水素ナトリウム、B剤＝硫酸アルミニウム','A剤＝りん酸アンモニウム、B剤＝炭酸水素ナトリウム','A剤＝炭酸水素ナトリウム、B剤＝りん酸アンモニウム'],a:1,e:'外筒のA剤が炭酸水素ナトリウム（重曹）、内筒のB剤が硫酸アルミニウムです。転倒させて両者を混合すると化学反応で二酸化炭素が発生し、その圧力で泡を放射します。反応式のイメージで「外＝アルカリ、内＝酸」と覚えると確実です。'},
{i:'O608',c:'kozo',q:'ABC粉末消火器の消火薬剤の主成分として、正しいものはどれか。',o:['炭酸水素ナトリウム','炭酸水素カリウム','りん酸アンモニウム','塩化ナトリウム'],a:2,e:'ABC粉末（りん酸塩類）はりん酸二水素アンモニウムが主成分で、色は淡紅色。BC粉末は炭酸水素ナトリウム（白色）または炭酸水素カリウム（紫色）で、普通火災には適応しません。'},
{i:'O609',c:'kozo',q:'二酸化炭素消火器が適応しない火災はどれか。',o:['普通火災（A火災）','油火災（B火災）','電気火災（C火災）','油火災と電気火災の両方'],a:0,e:'二酸化炭素消火器は窒息効果で消火するため、B火災（油）とC火災（電気）に適応しますが、A火災（普通火災）には適応しません。深部まで浸透しないためです。地下街や換気の悪い場所には設置できない点も重要です。'},
{i:'O610',c:'kozo',q:'手さげ式消火器の安全栓について、規格省令上、正しいものはどれか。',o:['内径2cm以上のリング部、軸部および軸受部で構成され、リング部の塗色は黄色とする','内径2mm以上のリング部を有し、リング部の塗色は赤色とする','内径2cm以上のリング部を有し、横方向に引き抜くよう装着する','リング部の内径と塗色に定めはない'],a:0,e:'内径は2cm以上です。ミリではなくセンチで、実際に指が入る大きさだと考えれば取り違えません。リング部の塗色は黄色、材質はステンレス鋼（SUS304）またはこれと同等以上の耐食性・耐候性を有するもの。装着は上方向で、消火器を水平面上に置いたとき垂直軸から30度以内の範囲に引き抜く向きとします。1動作で容易に引き抜け、引き抜きに支障のない封が施されていることも要件です。'},
{i:'O611',c:'kozo',q:'消火器にホースを設けなくてよいものとして、正しいものはどれか。',o:['薬剤量が1kg以下の粉末消火器','薬剤量が3kg以下の粉末消火器','薬剤量が4kg以下の二酸化炭素消火器','すべての消火器にホースが必要である'],a:0,e:'ホースを設けなくてよいのは、消火薬剤量1kg以下の粉末消火器と、薬剤量4kg未満のハロゲン化物消火器です。二酸化炭素消火器はすべてホースが必要です。数値と対象を取り違えさせる選択肢が定番です。'},
{i:'O612',c:'kozo',q:'消火器の質量と運搬方式の組合せとして、正しいものはどれか。',o:['28kg以下は手さげ式・据置式・背負式、28kg超35kg以下は据置式・背負式・車載式、35kg超は車載式','28kg以下は手さげ式・据置式、28kgを超えるものはすべて車載式','35kg以下は手さげ式、35kgを超えるものは車載式','質量による区分はなく、消火器の種類で決まる'],a:0,e:'28kgを境に手さげ式が使えなくなり、35kgを境に車載式だけになる、という2段階の区切りです。28kg超35kg以下の帯には据置式・背負式が残る点が抜けやすく、「28kgを超えたらすべて車載式」とする選択肢が定番の誤りになります。なお保持装置は別の規定で、手さげ式消火器（自動車用を除く）に原則として設けますが、鉛直に置けるものは不要とされています。'},
{i:'O613',c:'kozo',q:'消火器の外面を赤色に塗装しなければならない面積の割合として、正しいものはどれか。',o:['表面積の25％以上','表面積の50％以上','表面積の75％以上','全面'],a:0,e:'消火器の外面は、その表面積の25％以上を赤色仕上げとします。ただし二酸化炭素消火器の容器は高圧ガス保安法により表面積の2分の1以上を緑色に、ハロン1301はねずみ色に塗装する必要があり、残りの部分で赤色25％以上を確保します。'},
{i:'O614',c:'kozo',q:'加圧式（ガス加圧式）粉末消火器の内部および機能の点検を開始する時期として、正しいものはどれか。',o:['製造年から1年を経過したもの','製造年から3年を経過したもの','製造年から5年を経過したもの','設置後1年を経過したもの'],a:1,e:'内部及び機能の点検は、加圧式（化学泡を除く）が製造年から3年経過後、蓄圧式が5年経過後から実施します。化学泡消火器は設置後1年経過ごとに全数実施します。「加圧3年／蓄圧5年／化学泡1年」と3点セットで覚えてください。'},
{i:'O615',c:'kozo',q:'蓄圧式消火器の内部及び機能の点検を抜取り方式で行う場合、確認ロットの全数を確認し終えるまでの年数として正しいものはどれか。',o:['3年','5年','10年','15年'],a:2,e:'抜取り方式では、加圧式は5年で、蓄圧式は10年で確認ロットの全数の確認が終わるように試料を抽出します。点検開始時期（加圧3年・蓄圧5年）とセットで問われます。'},
{i:'O616',c:'kozo',q:'消火器の耐圧性能に関する点検（水圧検査）の実施時期として、正しいものはどれか。',o:['製造年から10年を経過したもの、およびその後3年ごと','製造年から5年を経過したもの、およびその後3年ごと','製造年から10年を経過したもの、およびその後5年ごと','製造年から3年を経過したもの、およびその後3年ごと'],a:0,e:'耐圧性能点検は、製造年から10年を経過した消火器について実施し、以後は3年ごとに行います。所定の水圧を5分間かけて、漏れや変形がないかを確認します。'},
{i:'O617',c:'kozo',q:'使用済み表示装置を設けなくてよい消火器として、適当なものはどれか。',o:['ガス加圧式粉末消火器','蓄圧式強化液消火器','化学泡消火器','蓄圧式機械泡消火器'],a:2,e:'使用済み表示装置は、指示圧力計のある蓄圧式消火器、バルブを有しない消火器、および手動ポンプ式水消火器・化学泡消火器には設けなくてよいとされています。化学泡は転倒させれば使用したことが明らかなためです。'},
{i:'O618',c:'kozo',q:'粉末消火器の消火作用として、主たるものはどれか。',o:['冷却作用','窒息作用と抑制（負触媒）作用','希釈作用','乳化作用'],a:1,e:'粉末消火器は窒息作用と抑制（負触媒）作用が主体です。水・強化液は冷却作用、泡は窒息作用、二酸化炭素は窒息作用が主。強化液は霧状にすると抑制作用も加わり、電気火災にも適応します。'},
{i:'O619',c:'kozo',q:'強化液消火器の消火薬剤について、正しいものはどれか。',o:['炭酸カリウムの濃厚な水溶液で、アルカリ性を示す','硫酸アルミニウムの水溶液で、酸性を示す','りん酸アンモニウムの水溶液で、弱酸性を示す','中性の界面活性剤水溶液である'],a:0,e:'強化液は炭酸カリウムの濃厚水溶液で、pH約12のアルカリ性、凝固点が約−20℃と低いため寒冷地でも使えます。棒状放射では電気火災に適応しませんが、霧状放射なら適応します。'},
{i:'O620',c:'kozo',q:'消火器の分解時に、最初に行うべき作業として最も適当なものはどれか。',o:['キャップを緩める','指示圧力計を取り外す','排圧栓またはノズル等により内圧を完全に排出する','ホースを外す'],a:2,e:'蓄圧式や加圧式で内圧が残ったままキャップを緩めると、キャップや部品が飛び出して重大事故につながります。排圧栓のあるものは排圧栓を開き、ないものは容器を逆さにしてレバーを握るなどして完全に排圧してから分解します。'},
{i:'O621',c:'kozo',q:'加圧用ガス容器について、正しいものはどれか。',o:['内容積100cm³以下のものは高圧ガス保安法の適用を受けない','すべて高圧ガス保安法の適用を受ける','内容積500cm³以下のものは検査が不要である','窒素ガスは使用できない'],a:0,e:'内容積100cm³以下の加圧用ガス容器は高圧ガス保安法の適用を受けず、容器弁を設けないものが一般的です。100cm³を超えるものは容器弁付きで、高圧ガス保安法の適用を受けます。充てんガスは二酸化炭素または窒素ガスです。'},
{i:'O622',c:'kiso',q:'力（荷重）のうち、材料を引き伸ばそうとする力を何というか。',o:['圧縮荷重','引張荷重','せん断荷重','曲げ荷重'],a:1,e:'引張荷重は材料を引き伸ばす方向に働く力です。圧縮荷重は押し縮める力、せん断荷重は断面に沿ってずらす力、ねじり荷重は軸を回そうとする力。消火器の容器は内圧により引張応力を受けます。'},
{i:'O623',c:'kiso',q:'応力の単位として、正しいものはどれか。',o:['N','N/mm²','N·m','N/s'],a:1,e:'応力は単位面積あたりの力なのでN/mm²（＝MPa）で表します。Nは力、N·mはモーメントやエネルギー、N/sは力の変化率の単位です。'},
{i:'O624',c:'kiso',q:'金属材料の性質のうち、薄く広げることができる性質を何というか。',o:['展性','延性','靭性','脆性'],a:0,e:'展性は薄板状に広げられる性質、延性は線状に引き延ばせる性質です。靭性は粘り強さ、脆性は脆さを表します。'},
{i:'O625',c:'kiso',q:'ボイルの法則について、正しいものはどれか。',o:['温度一定のとき、気体の体積は圧力に比例する','温度一定のとき、気体の体積は圧力に反比例する','圧力一定のとき、気体の体積は絶対温度に反比例する','体積一定のとき、圧力は絶対温度に反比例する'],a:1,e:'ボイルの法則は、温度一定で体積と圧力が反比例（PV＝一定）。シャルルの法則は圧力一定で体積が絶対温度に比例します。消火器の内圧が温度によって変動するのは、これらの法則によるものです。'},
{i:'O626',c:'kiso',q:'ねじについて、右ねじを締める方向として正しいものはどれか。',o:['時計回り','反時計回り','ねじの種類によらず反時計回り','どちらでもよい'],a:0,e:'一般的な右ねじは時計回りで締まります。ただし消火器の加圧用ガス容器の容器弁など、誤操作防止のために左ねじが使われている箇所があるため、整備時は必ず確認が必要です。'},
{i:'O627',c:'kan',q:'消火器の内部及び機能の点検において、放射能力を確認する試料の数として、正しいものはどれか。',o:['抜取り方式の場合は抜き取った消火器の50％以上、全数確認の場合は全数の10％以上','抜取り方式・全数確認とも10％以上','抜取り方式の場合は抜き取った消火器の10％以上、全数確認の場合は全数の50％以上','いずれの場合も全数について確認する'],a:0,e:'蓄圧式と加圧式粉末消火器は抜取り方式で、抜き取った数の50％以上について放射試験を行います。一方、加圧式の粉末消火器以外と化学泡消火器は全数が確認対象で、そのうち10％以上について放射試験を行います。50％と10％のどちらが抜取り方式かを入れ替えた選択肢が出ます。'},
{i:'O628',c:'kan',q:'二酸化炭素消火器のホーン（ホーン握り）が設けられている理由として、正しいものはどれか。',o:['放射音を小さくするため','放射時の低温による凍傷を防ぐため','薬剤の飛散を防ぐため','ホーンの破損を防ぐため'],a:1,e:'二酸化炭素は放射時に断熱膨張して急激に温度が下がり、ホーンが著しく低温になります。凍傷防止のためホーン握りを設け、必ずそこを持って操作します。'},
{i:'O629',c:'kan',q:'消火器の指示圧力計が緑色範囲より下を指している場合、考えられる原因として最も適当なものはどれか。',o:['充てん圧力が過大である','薬剤または加圧ガスの漏れが生じている','周囲温度が高い','指示圧力計の目盛が細かすぎる'],a:1,e:'緑色範囲を下回るのは、パッキンの劣化やバルブからのガス漏れ、あるいは消火器を使用した後などが原因です。逆に緑色範囲より上を指す場合は充てん量過多や高温環境が疑われます。いずれも再充てんや部品交換が必要です。'},
{i:'O630',c:'kan',q:'化学泡消火器の薬剤を詰め替える際の注意事項として、適当でないものはどれか。',o:['A剤とB剤はそれぞれ別の容器で水に溶かしてから注入する','外筒液面表示まで確実に薬剤水溶液を入れる','A剤とB剤をあらかじめ混合してから注入する','薬剤は1年ごとに詰め替える'],a:2,e:'A剤とB剤を先に混ぜると反応が始まってしまい、消火器として機能しません。必ず別々に溶解し、外筒・内筒それぞれの液面表示まで注入します。化学泡は1年ごとの詰替えが必要です。'},
{i:'O631',c:'kan',q:'消火器の適応火災を示す絵表示のうち、B火災（油火災）を示す標識の地色はどれか。',o:['白色','黄色','青色','赤色'],a:1,e:'絵表示の地色は、A火災（普通火災）が白色、B火災（油火災）が黄色、C火災（電気火災）が青色です。文字表示ではなく絵表示で示すことが定められています。'},
{i:'O632',c:'kan',q:'開がい転倒式の化学泡消火器の使用方法として、正しいものはどれか。',o:['レバーを握ってから本体を転倒させる','押し金具を押し下げてから本体を転倒させる','本体を転倒させるだけでよい','安全栓を抜きレバーを握る'],a:1,e:'開がい転倒式は、押し金具を押して内筒のふたを開いてから本体を転倒させます。転倒式は転倒させるだけ、破がい転倒式は押し金具で内筒の封板を破ってから転倒させます。3方式の区別が鑑別で問われます。'},
{i:'O633',c:'kan',q:'消火器の廃棄・処分に関して、加圧用ガス容器を取り外した際の措置として最も適当なものはどれか。',o:['そのまま一般ごみとして廃棄する','内部のガスを完全に放出してから処分する','水中に投棄する','焼却処分する'],a:1,e:'加圧用ガス容器は高圧のガスが残っていると破裂の危険があるため、専用の器具でガスを完全に放出してから処分します。消火器本体は指定引取場所やリサイクル窓口を通じた回収が原則です。'},
{i:'O634',c:'kan',q:'消火器の外形点検で「変形・損傷・著しい腐食」が認められた容器の措置として、正しいものはどれか。',o:['そのまま継続使用してよい','耐圧性能に関する点検を行い、判断する','塗装し直して使用する','薬剤を詰め替えれば使用できる'],a:1,e:'変形・損傷・著しい腐食が認められた場合は、廃棄するか、耐圧性能に関する点検（水圧検査）を行って安全性を確認します。外観の補修だけで判断してはなりません。'},
{i:'O635',c:'kozo',q:'指示圧力計に用いられているブルドン管の作動原理として、正しいものはどれか。',o:['断面が偏平な金属管をうず巻き状にしたもので、圧力に応じて曲率が変化し管先の自由端が変位する','2枚の金属板の熱膨張差により指針が動く','内部の液体が膨張して指針を押し上げる','磁石とコイルの作用で指針が振れる'],a:0,e:'ブルドン管式は、断面が偏平な金属管をうず巻き状にしたものです。開口固定端から圧力を導入すると、圧力に応じて管の曲率が変化し、管先の密閉自由端が変位します。管の弾性により変位量が圧力に比例するため、指針で圧力を読み取れます。ブルドンは考案したフランス人の名前です。'},
{i:'O636',c:'kozo',q:'強化液消火器の指示圧力計において、圧力検出部（ブルドン管）に使用できる材質はどれか。',o:['SUS（ステンレス鋼）のみ','Bs（黄銅）のみ','BeCu（ベリリウム銅）のみ','PB（りん青銅）のみ'],a:0,e:'水（浸潤剤入り）消火器・強化液消火器・機械泡消火器は、薬剤が水系でステンレス鋼以外の銅合金では腐食するおそれがあるため、ブルドン管にSUS（ステンレス鋼）を使用します。粉末消火器はこの制約がなく、Bs・BeCu・PB・SUSのいずれも使用できます。'},
{i:'O637',c:'kozo',q:'粉末消火器の指示圧力計において、圧力検出部（ブルドン管）に使用できる材質の組合せとして正しいものはどれか。',o:['SUSのみ','SUSとBsのみ','Bs、BeCu、PB、SUS','Bs、BeCuのみ'],a:2,e:'粉末消火器は薬剤による腐食のおそれが小さいため、Bs（黄銅）、BeCu（ベリリウム銅）、PB（りん青銅）、SUS（ステンレス鋼）のいずれも使用できます。水系（水・強化液・機械泡）がSUSに限られるのと対照的で、この違いがそのまま出題されます。'},
{i:'O638',c:'kozo',q:'ブルドン管の材質記号とその材質の組合せとして、誤っているものはどれか。',o:['SUS …… ステンレス鋼','Bs …… 黄銅（真ちゅう）','BeCu …… ベリリウム銅','PB …… 鉛'],a:3,e:'PBはPhosphor Bronze、すなわちりん青銅（青銅にりんをわずかに含有させたもの）です。鉛ではありません。SUSはSteel Special Use Stainless、BsはBrass、BeCuはベリリウムと銅の元素記号に由来します。'},
{i:'O639',c:'kozo',q:'消火器用の指示圧力計に表示することが規格で定められている事項として、正しいものはどれか。',o:['圧力検出部（ブルドン管）の材質','製造者の住所','消火薬剤の質量','使用期限'],a:0,e:'消火器用の指示圧力計は、規格によりブルドン管の材質を表示することとされています。文字盤にはこのほか、使用圧力範囲を示す緑色の範囲、「消」の記号、単位（×10⁻¹MPa）などが記されています。'},
{i:'O640',c:'kozo',q:'加圧用ガス容器のうち、高圧ガス保安法の適用を受けるものはどれか。',o:['内容積が100cm³以下のもの','内容積が100cm³を超えるもの','内容積が200cm³以下のもの','容量にかかわらずすべて'],a:1,e:'高圧ガス保安法の適用を受けるのは内容積100cm³を超えるものです。100cm³以下のものは適用除外で、外面には一般に亜鉛メッキが施されています。「200cm³以下は適用除外」といった数値を入れ替えた選択肢が頻出します。'},
{i:'O641',c:'kozo',q:'加圧用ガス容器に充てんされているガスとして、規定されていないものはどれか。',o:['液化炭酸ガス（二酸化炭素）','窒素ガス','液化炭酸ガスと窒素ガスの混合ガス','酸素ガス'],a:3,e:'充てんガスは液化炭酸ガス、窒素ガス、両者の混合ガスの3種類です。いずれも不燃性であることが条件で、酸素は助燃性なので使われません。一般に小容量のものは液化炭酸ガス、大容量のものは窒素ガスが使われる傾向にありますが、メーカーによって異なることも多くあります。'},
{i:'O642',c:'kozo',q:'加圧用ガス容器に刻印された容器記号「C60」の意味として、正しいものはどれか。',o:['ねじの種類が「C」で、充てんガス質量が60gである','内容積が60cm³である','最高充てん圧力が60MPaである','製造番号がC60である'],a:0,e:'容器記号はねじの種類を表す記号と、充てんガス質量（g）の組合せです。C60ならねじが「C」、ガス質量60g。容器記号ごとに形状・ねじ・ガス質量が異なるため、交換時は容器本体の刻印または消火器銘板の表示と同じ容器記号であることを必ず確認します。'},
{i:'O643',c:'kozo',q:'加圧用ガス容器の充てん量を確認する方法として、正しい組合せはどれか。',o:['容器弁のないもの…総質量を測定／容器弁付きのもの…内圧を測定','容器弁のないもの…内圧を測定／容器弁付きのもの…総質量を測定','いずれも総質量を測定','いずれも内圧を測定'],a:0,e:'容器弁のないもの（内容積100cm³以下）は総質量を測定します。容器弁付きのもの（100cm³超）は内圧を測定します（窒素ガスのみ）。液化炭酸ガスは液体で貯蔵されているため圧力では量が分からず、質量で確認するという理屈です。'},
{i:'O644',c:'kozo',q:'作動封板を有する加圧用ガス容器と、容器弁付きの加圧用ガス容器の違いとして、正しいものはどれか。',o:['作動封板式はカッターで封板を破って使用し、使用後は同じ容器記号のものと取り替える','作動封板式は使用後もガスを再充てんして繰り返し使える','容器弁付きは使い捨てで、再使用できない','容器弁付きは自分でガスを充てんしてよい'],a:0,e:'作動封板を有するものはカッターが封板を破って作動するため再使用できず、消火器銘板などに表示された同じ容器記号のものと取り替えます。容器弁付きのものは使用後も容器を再使用できますが、高圧ガス保安法の適用を受けるため、専門業者にガスの再充てんを依頼し、自ら充てんしてはなりません。'},
{i:'O645',c:'kozo',q:'作動封板を有する加圧用ガス容器について、高圧ガス保安法の適用を受けるものはどれか。',o:['容量にかかわらずすべて適用を受ける','内容積が100cm³を超えるものに限られる','容量にかかわらず適用を受けない','内容積が100cm³以下のものに限られる'],a:1,e:'作動封板を有するかどうかではなく、内容積が100cm³を超えるかどうかで決まります。作動封板付きでも100cm³を超えれば適用を受け、表面積の2分の1以上が緑色またはねずみ色に塗装されています。'},
{i:'O646',c:'kozo',q:'高圧ガス保安法における「高圧ガス」の定義について、圧縮ガスの場合の基準として正しいものはどれか。',o:['温度35℃において圧力1MPa以上のもの','温度20℃において圧力0.98MPa以上のもの','温度40℃において圧力0.7MPa以上のもの','温度0℃において圧力1.5MPa以上のもの'],a:0,e:'圧縮ガスは温度35℃において圧力1MPa以上のものが高圧ガスです。蓄圧式の水・強化液・機械泡消火器は使用温度範囲−20〜40℃で圧力0.7〜0.98MPaに設定されており、35℃では0.98MPaよりやや低くなるため、高圧ガス保安法は適用されません。0.98MPaという上限がこの1MPaをわずかに下回るよう決められている点が理解のポイントです。'},
{i:'O647',c:'kozo',q:'高圧ガス保安法の適用を受ける消火器として、正しい組合せはどれか。',o:['二酸化炭素消火器、ハロン1301消火器、ハロン1211消火器','二酸化炭素消火器、蓄圧式強化液消火器','蓄圧式粉末消火器、蓄圧式機械泡消火器','化学泡消火器、加圧式粉末消火器'],a:0,e:'高圧ガス保安法の適用を受ける消火器は、二酸化炭素消火器、ハロン1301消火器、ハロン1211消火器の3種類です。蓄圧式の水・強化液・機械泡・粉末は使用圧力が0.98MPa以下に抑えられているため適用されません。'},
{i:'O648',c:'kozo',q:'高圧ガス保安法の適用を受ける消火器および加圧用ガス容器の塗色について、正しい組合せはどれか。',o:['二酸化炭素…緑色／窒素ガス…ねずみ色','二酸化炭素…ねずみ色／窒素ガス…緑色','いずれも緑色','いずれもねずみ色'],a:0,e:'容器保安規則により、表面積の2分の1以上を高圧ガスごとの塗色に塗装します。二酸化炭素消火器と液化炭酸ガスの加圧用ガス容器は緑色、窒素ガス（二酸化炭素との混合ガスを含む）の加圧用ガス容器はねずみ色です。ハロン1301・1211消火器もねずみ色になります。'},
{i:'O649',c:'kozo',q:'高圧ガス保安法の適用を受ける容器に刻印されている記号のうち、容器の質量を表すものはどれか。',o:['W','V','TP','FP'],a:0,e:'WはWeight（附属品を含まない容器の質量、単位kg）、VはVolume（内容積、単位L）、TPはTest Pressure（耐圧試験圧力、単位MPa）、FPはFilling Pressure（最高充てん圧力、単位MPa）です。充てんガス量を表す記号はありません。'},
{i:'O650',c:'kozo',q:'容器の刻印「TP24.5M」が表す内容として、正しいものはどれか。',o:['耐圧試験圧力が24.5MPaであること','最高充てん圧力が24.5MPaであること','内容積が24.5Lであること','容器の質量が24.5kgであること'],a:0,e:'TPはTest Pressure（耐圧試験における圧力）で、末尾のMはメガ（MPa）を表します。最高充てん圧力はFP（例：FP11.5M）です。TPとFPの取り違えが定番の引っかけです。'},
{i:'O651',c:'kozo',q:'消火器に設ける容器弁について、正しいものはどれか。',o:['ハンドル車式と、ハンドル車式以外のものがある','ハンドル車式のみである','レバー式のみである','形状の区分はない'],a:0,e:'容器弁にはハンドル車式と、ハンドル車式以外のものがあります。ハンドル車式はハンドルを回すと弁が開き、車載式二酸化炭素消火器や車載式粉末消火器の加圧用ガス容器などに使われます。ハンドル車式以外はレバーを握ると弁が開く構造で、手さげ式の二酸化炭素消火器などに使われています。'},
{i:'O652',c:'kozo',q:'容器弁に設ける安全弁の種類として、規定されていないものはどれか。',o:['封板式（一定の圧力以上で作動）','溶栓式（一定の温度以上で作動）','封板溶栓式（一定の圧力及び温度以上で作動）','電磁式（電気信号で作動）'],a:3,e:'安全弁は封板式・溶栓式・封板溶栓式の3種類です。容器内の圧力が規定値以上になると自動的にバルブを開いて圧力を外部に排出します。高圧ガス保安法の適用を受ける蓄圧式消火器および加圧用ガス容器（作動封板を設けたものを除く）には、容器弁を設けなければならず、その容器弁には安全弁が必要です。'},
{i:'O653',c:'kozo',q:'蓄圧式の強化液消火器の使用温度範囲として、正しいものはどれか。',o:['−20℃〜+40℃','0℃〜+40℃','5℃〜+40℃','−30℃〜+40℃'],a:0,e:'強化液は炭酸カリウムの濃厚水溶液で凝固点が低く、−20℃でも凍結しないため寒冷地に適しています。化学泡が5〜40℃、二酸化炭素が−30〜40℃と、消火器ごとに違うので対比して覚えてください。'},
{i:'O654',c:'kozo',q:'強化液消火薬剤の性状として、正しいものはどれか。',o:['無色半透明または淡黄色の、高濃度の炭酸カリウム水溶液である','無色透明の炭酸ナトリウム水溶液である','白色不透明の硫酸アルミニウム水溶液である','淡紅色のりん酸アンモニウム水溶液である'],a:0,e:'強化液は無色半透明または淡黄色の、高濃度の炭酸カリウム水溶液で、強アルカリ性（pH約12）です。「炭酸ナトリウム」に置き換えた選択肢が定番の引っかけなので、カリウムとナトリウムを混同しないでください。'},
{i:'O655',c:'kozo',q:'消火器の本体容器の材質について、正しいものはどれか。',o:['規格省令により各種の鋼板を使用するよう定められており、鋳鉄が使われることはない','鋳鉄製が一般的である','アルミニウム製に限られる','材質の定めはない'],a:0,e:'本体容器は規格省令により各種の鋼板を使用するよう定められています。鋳鉄は鋼に比べて耐摩耗性に優れますが、一般に衝撃に弱いという性質があるため使われません。「本体容器は鋳鉄製である」は誤りの選択肢として頻出します。'},
{i:'O656',c:'kozo',q:'化学泡消火器の使用温度範囲として、正しいものはどれか。',o:['5℃〜40℃','0℃〜40℃','−20℃〜40℃','−10℃〜40℃'],a:0,e:'化学泡は化学反応で泡を発生させるため、低温になると反応が鈍化して発泡性能が低下します。このため使用温度範囲は5〜40℃とされ、寒冷地には適しません。「0℃〜40℃」に置き換えた選択肢がよく出ます。'},
{i:'O657',c:'kozo',q:'本体容器の内面に、充てんされた消火薬剤の液面を示す表示装置が設けられている消火器はどれか。',o:['化学泡消火器','蓄圧式強化液消火器','蓄圧式機械泡消火器','蓄圧式粉末消火器'],a:0,e:'液面表示があるのは化学泡消火器です。外筒と内筒それぞれに薬剤水溶液を規定量入れる必要があるため、液面表示が不可欠になります。蓄圧式のものにはありません。'},
{i:'O658',c:'kozo',q:'化学泡消火器の泡の膨張率について、正しいものはどれか（大型消火器以外、温度20℃の薬剤を標準発泡ノズルで放射した場合）。',o:['7倍以上','5倍以上','10倍以上','3倍以上'],a:0,e:'温度20℃の消火薬剤を標準発泡ノズルで放射した場合、大型消火器以外では泡の膨張率は7倍以上でなければなりません。化学泡消火器の性能に関する基本数値です。'},
{i:'O659',c:'kozo',q:'ノズルの開口部にろ過網を設けなければならない消火器として、現在製造されているものはどれか。',o:['化学泡消火器','蓄圧式強化液消火器','蓄圧式粉末消火器','二酸化炭素消火器'],a:0,e:'ろ過網が必要なのは、手動ポンプにより作動する水消火器、ガラスびんを使用する酸アルカリ消火器、ガラスびんを使用する強化液消火器、化学泡消火器の4種類で、このうち現在製造されているのは化学泡消火器のみです。薬剤のかたまりがノズルを詰まらせるのを防ぐためのものです。'},
{i:'O660',c:'kozo',q:'機械泡消火器のノズルの特徴として、正しいものはどれか。',o:['放射時に外部の空気を取り入れる空気吸入口が設けられている','霧状に放射するための微細な孔が設けられている','ホーンが取り付けられている','開閉式のレバーが付いている'],a:0,e:'機械泡はノズル部で空気を混入させて発泡させるため、専用の発泡ノズルに空気吸入口があります。化学泡が2種類の薬剤の化学反応で泡を作るのに対し、機械泡は物理的に空気を混ぜて泡立てる点が根本的な違いです。霧状ノズルは水（浸潤剤入り）消火器や強化液消火器に使われます。'},
{i:'O661',c:'kozo',q:'泡消火器（化学泡・機械泡）が電気火災（C火災）に適応しない理由として、正しいものはどれか。',o:['泡は電気を通し、感電の危険があるため','泡が電気設備を腐食させるため','泡の冷却作用が強すぎるため','泡が熱分解して有毒ガスを発生するため'],a:0,e:'泡は水分を含むため電気を通し、感電の危険があります。このため化学泡・機械泡とも電気火災には適応せず、普通火災（A）と油火災（B）に適応します。消火作用は泡が燃焼面に付着することによる窒息作用および冷却作用です。'},
{i:'O662',c:'kozo',q:'水成膜泡消火薬剤の特徴として、正しいものはどれか。',o:['ふっ素系界面活性剤を主成分とし、水溶液の表面張力が極めて小さく、油面に水成膜のフィルムを形成する','たん白質を加水分解したもので、泡の安定性が高い','炭酸水素ナトリウムと硫酸アルミニウムの反応で発泡する','合成洗剤に類似した界面活性剤で、化学泡より安定性が低い'],a:0,e:'水成膜泡はふっ素系界面活性剤が主成分で、水溶液の表面張力が極めて小さいため、油面に水成膜のフィルムを形成して消火します。なお過去の製品にはPFOSと呼ばれる化学物質が含まれるものがあり、取扱いに注意が必要です。'},
{i:'O663',c:'kozo',q:'蓄圧式機械泡消火器の使用温度範囲について、規格上定められている範囲はどれか。',o:['0℃以上40℃以下（低温用として下限を−10℃または−20℃まで拡大したものがある）','−20℃以上40℃以下','5℃以上40℃以下','−30℃以上40℃以下'],a:0,e:'「消火器の技術上の規格」では0℃以上40℃以下と定められており、低温用として下限温度を−10℃または−20℃まで拡大したものがあります。化学泡が5〜40℃と下限が高いのに対し、機械泡は低温でも使える点が比較で問われます。'},
{i:'O664',c:'kozo',q:'二酸化炭素消火器に充てんされている消火剤の量を確認する方法として、正しいものはどれか。',o:['はかりを用いて総質量を測定し、薬剤の質量を算出する','指示圧力計の指示値を読む','圧力計を取り付けて内圧を測定する','容器を振って音で判断する'],a:0,e:'二酸化炭素は液体の状態で充てんされているため、圧力では充てん質量を測定できません。はかりを用いて消火器本体の総質量を計測し、そこから薬剤の質量を算出します。「圧力計を用いる」は典型的な誤答選択肢です。'},
{i:'O665',c:'kozo',q:'二酸化炭素消火器の本体容器の塗色について、正しいものはどれか。',o:['表面積の1/4以上を赤色に、1/2以上を緑色に塗る','表面積の1/2以上を赤色に、1/4以上を緑色に塗る','表面積の1/4以上を赤色に、1/3以上を緑色に塗る','全面を緑色に塗る'],a:0,e:'消防法により表面積の1/4（25％）以上を赤色、高圧ガス保安法（容器保安規則）により1/2以上を緑色に塗装します。両方の法令がかかっているため、2つの条件を同時に満たす必要があります。数値を入れ替えた選択肢に注意してください。'},
{i:'O666',c:'kozo',q:'二酸化炭素消火器の使用温度範囲として、一般に設定されているものはどれか。',o:['−30℃〜40℃','−20℃〜40℃','0℃〜40℃','5℃〜40℃'],a:0,e:'二酸化炭素消火器の使用温度範囲は一般に−30℃〜40℃です。温度が低下すると内部圧力も比例して低下するため、放射時の勢いが弱くなります。−40℃の冷凍倉庫は使用温度範囲外となり使用できません。'},
{i:'O667',c:'kozo',q:'二酸化炭素消火器の使用上の注意事項として、誤っているものはどれか。',o:['火炎に接すると消火薬剤が熱分解し、有毒な一酸化炭素が発生する','地下街、準地下街や密閉した狭い地階、無窓階等では使用してはならない','消火した後は、速やかに換気をはかる','放射時にホーンが著しく低温になるのでホーン握りを持つ'],a:0,e:'二酸化炭素CO₂は安定した分子で、熱分解することはありません。危険なのは熱分解ではなく、酸素濃度の低下による窒息です。このため密閉空間での使用が禁じられ、消火後は速やかに換気をはかります。'},
{i:'O668',c:'kozo',q:'二酸化炭素消火器の構造について、正しいものはどれか。',o:['蓄圧式に分類され、指示圧力計は取り付けられておらず、安全弁が設けられている','加圧式に分類され、指示圧力計が取り付けられている','反応式に分類され、安全弁はない','蓄圧式に分類され、指示圧力計が取り付けられている'],a:0,e:'二酸化炭素消火器は蓄圧式ですが、充てん圧力が指示圧力計の許容最大値より高いため指示圧力計は取り付けません。代わりに容器弁に安全弁が設けられており、異常昇圧時に自動的に圧力を逃がします。'},
{i:'O669',c:'kozo',q:'蓄圧式粉末消火器の使用圧力範囲として、正しいものはどれか。',o:['0.7MPa〜0.98MPa','0.5MPa〜1.0MPa','0.6MPa〜0.85MPa','0.24MPa〜0.70MPa'],a:0,e:'蓄圧式粉末消火器の使用圧力範囲は0.7〜0.98MPaで、付属の指示圧力計もこの範囲に収まるよう緑色で表示されています。蓄圧式の水・強化液・機械泡も同じ範囲です。'},
{i:'O670',c:'kozo',q:'蓄圧式粉末消火器の放射圧力源として、一般に用いられるガスはどれか。',o:['窒素ガス','二酸化炭素','酸素','アルゴン'],a:0,e:'蓄圧式粉末消火器の放射圧力源には一般に窒素が用いられます。窒素と二酸化炭素はともに不燃性ですが、二酸化炭素は人体に有害であるため、常時充てんしておく蓄圧式には窒素が選ばれています。'},
{i:'O671',c:'kozo',q:'粉上り防止用封板について、正しいものはどれか。',o:['加圧式の粉末消火器のサイホン管の先端に取り付けられている','蓄圧式の粉末消火器のサイホン管の先端に取り付けられている','すべての粉末消火器に取り付けられている','二酸化炭素消火器に取り付けられている'],a:0,e:'粉上り防止用封板は加圧式の粉末消火器のみに取り付けられています。蓄圧式は開閉バルブで外気と遮断されているためサイホン管内で粉末が詰まることがなく、サイホン管の先端には何も取り付けられていません。この加圧式と蓄圧式の違いは繰り返し出題されます。'},
{i:'O672',c:'kozo',q:'粉末消火薬剤の記号と主成分の組合せとして、誤っているものはどれか。',o:['粉末（ABC）…… りん酸二水素アンモニウム','粉末（Na）…… 炭酸水素ナトリウム','粉末（K）…… 炭酸水素カリウム','粉末（KU）…… 水酸化カリウムと尿素の反応物'],a:3,e:'粉末（KU）は炭酸水素カリウムと尿素（CO(NH₂)₂）の反応物です。「水酸化カリウム」ではありません。4種類の記号と成分はそのまま組合せ問題として出るので、セットで覚えてください。'},
{i:'O673',c:'kozo',q:'炭酸水素カリウムを主成分とする粉末（K）消火薬剤の適応火災として、正しいものはどれか。',o:['B火災（油火災）及びC火災（電気火災）','A火災及びB火災','A火災、B火災及びC火災','A火災のみ'],a:0,e:'炭酸水素塩類（炭酸水素ナトリウム・炭酸水素カリウム）およびこれに炭酸水素カリウムと尿素の反応生成物を加えたものを使用した消火薬剤は、いずれもB火災（油火災）およびC火災（電気火災）に適応します。A火災にも適応するのは、りん酸塩類を主成分とする粉末（ABC）だけです。'},
{i:'O674',c:'kozo',q:'加圧式粉末消火器でレバーを握ったときの動作の順序として、正しいものはどれか。',o:['カッターが作動封板を破る → ガスが導入管を通って本体容器内へ → 粉末が撹拌・加圧される → 粉上り防止用封板を破る → ノズルから放射','ガスが自然に噴出する → 粉末が押し出される → ノズルから放射','本体を転倒させる → 薬剤が混合する → ノズルから放射','バルブが開く → 蓄圧ガスが粉末を押し出す → ノズルから放射'],a:0,e:'レバーを握るとカッターが加圧用ガス容器の作動封板を破り、ガスが導入管を通って本体容器内に導入されます。粉末消火剤はガスによって撹拌・加圧され、サイホン管の先にある粉上り防止用封板を破って、サイホン管およびホースを通りノズルから放射されます。選択肢4は蓄圧式の動作です。'},
{i:'O675',c:'kozo',q:'大型粉末消火器（ガス加圧式）で、二酸化炭素加圧のものを使用する際の操作として、正しいものはどれか。',o:['押し金具を押してガスの封板を破り、ガスを本体容器内に導入する','ガス容器のハンドルを回してバルブを開く','本体を転倒させる','安全栓を抜いてレバーを握るだけでよい'],a:0,e:'大型粉末消火器では、二酸化炭素加圧のものは押し金具を押して封板を破り、窒素ガス加圧のものはガス容器のハンドルを回してバルブを開きます。なお加圧用ガスは、小容量のものには二酸化炭素が、大容量のものには窒素ガスが用いられます。この大小とガス種の対応を入れ替えた選択肢が頻出です。'},
{i:'O676',c:'kozo',q:'加圧式粉末消火器の加圧用ガス容器の取付け位置について、正しいものはどれか。',o:['通常は本体容器の内部に取り付けられているが、大型消火器で容量の大きいものは外部に取り付けられている','常に本体容器の外部に取り付けられている','常に本体容器の内部に取り付けられている','ホースの途中に取り付けられている'],a:0,e:'加圧用ガス容器は通常は本体容器の内部にありますが、大型消火器で容量の大きいものは本体容器の外部に取り付けられています。外部に付く大型のものは内容積が100cm³を超えるため、高圧ガス保安法の適用を受ける容器を使用しなければなりません。'},
{i:'O677',c:'kan',q:'蓄圧式消火器のレバーを握ったところ、少量の消火剤しか出なかった。考えられる原因として最も適当なものはどれか。',o:['蓄圧ガスが漏れていた','カッターが作動しなかった','消火器を転倒させなかった','内筒に亀裂が入っていた'],a:0,e:'蓄圧式は容器内の蓄圧ガスの圧力で薬剤を押し出すため、ガスが漏れてわずかしか残っていないと、レバーを握っても少量しか出ません。カッターの不良は加圧式、転倒させないことによる不発と内筒の亀裂は化学泡で考えられる原因です。'},
{i:'O678',c:'kan',q:'設置されている泡消火器のノズルから泡が漏れていた。考えられる原因として最も適当なものはどれか。',o:['内筒に亀裂が入り、A剤とB剤が徐々に反応した','蓄圧ガスが漏れていた','加圧用ガス容器が腐食していた','指示圧力計が故障していた'],a:0,e:'化学泡消火器で内筒に亀裂が入ると、外筒のA剤と内筒のB剤がわずかに反応し、発生したガスでノズルから泡が漏れ出します。化学泡は2剤を分離して保管する構造なので、その隔壁が破れると起きる現象です。'},
{i:'O679',c:'kan',q:'加圧式の消火器でバルブを開いたとき消火剤が出なかった。原因として適当でないものはどれか。',o:['消火器を転倒させなかったため','バルブが詰まっていたため','カッターの作動不良のため','加圧用ガス容器（作動封板など）の不具合のため'],a:0,e:'加圧式はレバー操作でカッターが封板を破る構造なので、転倒させる必要はありません。「転倒させなかったことにより消火剤が出ない」のは化学泡消火器で考えられる原因です。加圧式の不発は、バルブの詰まり、カッターの作動不良、加圧用ガス容器の不具合が主な原因になります。'},
{i:'O680',c:'kan',q:'二酸化炭素消火器を使用したところ、二酸化炭素がまったく放射されなかった。考えられる原因として最も適当なものはどれか。',o:['二酸化炭素が自然噴出していた','粉上り防止用封板が詰まっていた','A剤とB剤が混合していなかった','指示圧力計が緑色を指していなかった'],a:0,e:'二酸化炭素が安全弁などから自然噴出して容器内が空になっていると、使用してもまったく放射されません。総質量の測定で発見できるため、外形点検での質量確認が重要になります。二酸化炭素消火器には指示圧力計がないので、選択肢4は原因になりません。'},
{i:'O681',c:'kan',q:'指示圧力計の文字盤に「SUS」と表示されている場合、この指示圧力計を使用できない消火器はどれか。',o:['使用できない消火器はない（すべてに使用できる）','強化液消火器','機械泡消火器','水（浸潤剤入り）消火器'],a:0,e:'SUS（ステンレス鋼）は耐食性が高く、水系（水・強化液・機械泡）にも粉末にも使用できます。制約があるのは逆方向で、Bs・BeCu・PBは水系の薬剤で腐食するおそれがあるため、粉末消火器にしか使えません。'},
{i:'O682',c:'kan',q:'消火器の容器が緑色に塗装されている部分が表面積の2分の1以上を占めていた。この消火器として考えられるものはどれか。',o:['二酸化炭素消火器','ハロン1301消火器','蓄圧式粉末消火器','化学泡消火器'],a:0,e:'高圧ガス保安法により、二酸化炭素消火器と液化炭酸ガスの加圧用ガス容器は表面積の2分の1以上を緑色に塗装します。ハロン1301・1211消火器と窒素ガスの加圧用ガス容器はねずみ色です。'},
{i:'O683',c:'kiso',q:'力の三要素として、正しい組合せはどれか。',o:['大きさ、方向、作用点','大きさ、速度、質量','質量、加速度、距離','大きさ、向き、時間'],a:0,e:'力は「大きさ」「方向」「作用点」の3つが決まってはじめて定まります。大きさと方向を同時に持つ量をベクトル量といい、力はその代表です。複数の力を合成したものが合力、荷重に対してつり合う力が反力です。'},
{i:'O684',c:'kiso',q:'力のモーメントの大きさを表す式として、正しいものはどれか。',o:['力の大きさ × 回転軸から力の作用線までの距離','力の大きさ ÷ 距離','力の大きさ × 時間','質量 × 加速度'],a:0,e:'モーメント M＝F×L で、トルクとも呼ばれます。距離は回転軸から力の作用線までの垂直距離をとります。スパナの柄が長いほど小さな力でボルトが回せるのは、Lが大きくなってMが増えるからです。'},
{i:'O685',c:'kiso',q:'ニュートンの運動の3法則のうち、「物体に力を加えると、それを打ち消す同じ大きさの力が生じる」ものはどれか。',o:['作用・反作用の法則','慣性の法則','運動の法則','万有引力の法則'],a:0,e:'作用・反作用の法則（第3法則）です。慣性の法則（第1法則）は外力が働かない限り現在の状態を保つこと、運動の法則（第2法則）は力を加えると加速度が生じ、加速度は力に比例し質量に反比例すること（F＝ma）。3つの名前と内容の組合せがそのまま問われます。'},
{i:'O686',c:'kiso',q:'荷重の種類について、材料の断面に沿って平行にずらすように働く力はどれか。',o:['せん断荷重','引張荷重','圧縮荷重','曲げ荷重'],a:0,e:'せん断荷重はハサミで切るときのように、断面に沿ってずらす力です。引張は伸ばす、圧縮は押し縮める、曲げは曲げる、ねじりは軸まわりにねじる力。また、荷重のかかり方では、静かにかかり続けるものを静荷重、衝撃や繰り返しを伴うものを動荷重といいます。'},
{i:'O687',c:'kiso',q:'応力ひずみ線図において、荷重を取り去れば元の形に戻る限界の点を何というか。',o:['弾性限度','比例限度','降伏点','引張強さ'],a:0,e:'弾性限度を超えると永久ひずみが残ります。比例限度は応力とひずみが比例する限界（フックの法則が成り立つ範囲）で、弾性限度よりわずかに手前。降伏点は応力が増えないのにひずみが急増する点、引張強さは線図上の最大応力です。順番は 比例限度 → 弾性限度 → 降伏点 → 引張強さ。'},
{i:'O688',c:'kiso',q:'安全率の定義として、正しいものはどれか。',o:['引張強さ（基準強さ）÷ 許容応力','許容応力 ÷ 引張強さ','荷重 ÷ 断面積','ひずみ ÷ 応力'],a:0,e:'安全率＝基準強さ÷許容応力。安全率を大きくとるほど許容応力は小さくなり、設計は安全側に振れます。安全率は必ず1より大きい値になります。'},
{i:'O689',c:'kiso',q:'合金とその成分の組合せとして、誤っているものはどれか。',o:['青銅 …… 銅＋亜鉛','黄銅 …… 銅＋亜鉛','鋳鉄 …… 鉄＋炭素（約2％以上）','ステンレス鋼 …… 炭素鋼＋ニッケル＋クロム'],a:0,e:'青銅は銅＋すずです。銅＋亜鉛は黄銅（真ちゅう）。炭素鋼は鉄＋炭素（約0.02〜2％）で、炭素が約2％以上になると鋳鉄になります。炭素が多いほど硬くなりますが、もろくもなります。'},
{i:'O690',c:'kiso',q:'金属の熱処理のうち、高温に加熱した後で急冷却し、硬度を増す処理はどれか。',o:['焼入れ','焼戻し','焼なまし','焼ならし'],a:0,e:'焼入れは急冷却して硬くします。ただし硬くなる代わりにもろくなるため、再加熱して徐々に冷やす焼戻しで粘りを与えます。焼なましは一定時間加熱後に徐々に冷やして軟らかくする処理、焼ならしは加熱後に自然冷却して組織を均一にならす処理です。「急冷＝焼入れ」だけ覚えて、残りは徐冷・自然冷却で区別します。'},
{i:'O691',c:'kiso',q:'ねじについて、1回転させたときにねじが軸方向に進む距離を何というか。',o:['リード','ピッチ','有効径','呼び径'],a:0,e:'リードは1回転で進む距離、ピッチは隣り合うねじ山の間隔です。一条ねじではリード＝ピッチですが、二条ねじではリード＝ピッチ×2になります。なお一般的な右ねじは時計回りで締まりますが、消火器では誤操作防止のため左ねじが使われている箇所があります。'},
{i:'O692',c:'kiso',q:'ボイル・シャルルの法則を表す関係として、正しいものはどれか。',o:['圧力×体積÷絶対温度が一定','圧力×絶対温度÷体積が一定','圧力÷（体積×絶対温度）が一定','圧力＋体積＋絶対温度が一定'],a:0,e:'PV/T＝一定です。温度一定ならPV＝一定（ボイルの法則）、圧力一定ならV/T＝一定（シャルルの法則）。消火器の内圧が夏と冬で変わるのはこの法則によるもので、指示圧力計が高温で緑色範囲を超えるのも同じ理由です。絶対温度はセルシウス温度＋273です。'},
{i:'O693',c:'kiso',q:'仕事率（動力）の単位として、正しいものはどれか。',o:['W（ワット）','J（ジュール）','N（ニュートン）','Pa（パスカル）'],a:0,e:'仕事率は単位時間あたりの仕事で、W＝J/s。仕事そのものはJ（ジュール）で、仕事＝力×移動距離（N·m）。Nは力、Paは圧力（N/m²）の単位です。'},
{i:'O694',c:'kiso',q:'はりの種類のうち、一端のみを固定し、他端を自由にしたものを何というか。',o:['片持ばり','単純ばり','固定ばり','連続ばり'],a:0,e:'片持ばりは一端固定・他端自由。単純ばりは両端を支点で支えたもの、固定ばりは両端を固定したもの、連続ばりは3つ以上の支点で支えたものです。同じ荷重なら片持ばりが最もたわみます。'},

{i:'O695',c:'kozo',q:'住宅用消火器の加圧方式と消火剤について、規格省令上、正しいものはどれか。',o:['蓄圧式であり、消火剤を再充てんできない構造とする','加圧式であり、消火剤を再充てんできる構造とする','蓄圧式であり、消火剤を再充てんできる構造とする','加圧方式に定めはない'],a:0,e:'住宅用消火器は蓄圧式で、消火剤の再充てんができない構造（再使用不可）でなければなりません。キャップ・プラグ・口金・パッキンは溶接等により完全に固定され、取り外せない構造とすることも定められています。一般の人が自分で整備することを想定していないためです。'},
{i:'O696',c:'kozo',q:'住宅用消火器が所定の消火性能をもつことを求められている火災として、規格省令に定められていないものはどれか。',o:['ガス爆発','普通火災','天ぷら油火災','ストーブ火災'],a:0,e:'住宅用消火器は、普通火災・天ぷら油火災・ストーブ火災に対して所定の消火性能をもち、かつ電気火災に適応することが求められます。住宅で実際に起きる火災に合わせた区分で、業務用のA・B・C火災とは呼び方が違う点に注意してください。'},
{i:'O697',c:'kozo',q:'住宅用消火器の操作性について、規格省令上の定めとして正しいものはどれか。',o:['1動作で容易かつ確実に放射を開始できること','2動作以内で放射を開始できること','3動作以内で放射を開始できること','動作数の定めはない'],a:0,e:'住宅用消火器は1動作で放射を開始できることが必要です。ただし、保持装置から取り外す動作、安全栓をはずす動作、ホースをはずす動作はこの動作数に含めません。安全栓やレバー等の操作部分には操作方法を表示します。'},
{i:'O698',c:'kozo',q:'住宅用消火器の消火剤として使用してはならないものの組合せはどれか。',o:['ハロゲン化物と液化二酸化炭素','強化液と粉末','水と泡','りん酸塩類と炭酸水素塩類'],a:0,e:'ハロゲン化物と液化二酸化炭素は使用できません。いずれも住宅という狭い空間で放射すると酸欠などの危険があるためです。表示できる種別は水・強化液・泡・粉末の4つです。'},
{i:'O699',c:'kozo',q:'住宅用消火器の表示事項について、正しいものはどれか。',o:['能力単位の数値を表示する必要はない','能力単位の数値を必ず表示する','適応火災は文字でのみ表示する','製造年の表示は不要である'],a:0,e:'住宅用消火器に能力単位の表示は求められません。業務用のように設置本数を能力単位で算定する使い方をしないためです。一方で、住宅用消火器である旨、種別、使用方法（図示も）、使用温度範囲、適応火災の絵表示、放射時間・放射距離、製造番号・製造年・製造者名・型式番号、消火剤の容量または質量などは表示が必要です。'},
{i:'O700',c:'kozo',q:'住宅用消火器の放射性能について、規格省令上の定めはどれか。',o:['充てんされた消火剤の容量または質量の85％以上の量を放射できること','同じく90％以上','同じく70％以上','放射量の定めはない'],a:0,e:'85％以上です。業務用消火器の規格（放射する消火剤の量は充てん量の90％以上、化学泡は85％以上）と数値が近いので、住宅用は85％と押さえておきます。'},

{i:'O701',c:'kozo',q:'泡消火器が放射する泡の容量について、正しい組合せはどれか。',o:['化学泡（手さげ式・背負式）は薬剤容量の7倍以上、化学泡（車載式）は5.5倍以上、機械泡は5倍以上','化学泡はすべて7倍以上、機械泡は7倍以上','化学泡（手さげ式）は5倍以上、機械泡は7倍以上','泡の容量に定めはない'],a:0,e:'化学泡の手さげ式・背負式が7倍以上、車載式が5.5倍以上、機械泡が5倍以上です。数値が3つ並ぶので「手さげ7／車載5.5／機械5」とセットで覚えます。温度20℃の薬剤を標準発泡ノズルで放射した場合の値です。'},
{i:'O702',c:'kozo',q:'安全弁を設けなければならない消火器の組合せとして、正しいものはどれか。',o:['二酸化炭素消火器、ハロン1301消火器、化学泡消火器','蓄圧式粉末消火器、蓄圧式強化液消火器','加圧式粉末消火器、機械泡消火器','すべての消火器'],a:0,e:'安全弁が必要なのは二酸化炭素消火器、ハロン1301消火器、化学泡消火器の3つです。前2つは高圧ガス保安法の適用を受けるため、化学泡は化学反応でガスが発生し内圧が上がるためで、理由は異なりますが、どれも異常昇圧のおそれがある点で共通しています。'},
{i:'O703',c:'kozo',q:'二酸化炭素消火器およびハロゲン化物消火器を設置できない場所として、正しいものはどれか。',o:['地下街、準地下街、および換気について有効な開口部の面積が床面積の1/30以下で、かつ床面積20㎡以下の地階・無窓階・居室','延べ面積1000㎡以上のすべての防火対象物','地階を有するすべての防火対象物','屋外に面する場所'],a:0,e:'窒息作用で消火するため、人が逃げられない密閉空間では酸欠の危険があります。「1/30以下」「20㎡以下」の2つの数値が要件で、両方を満たす場所が規制対象です。なおハロン1301消火器はこの制限から除外されており、設置できます。'},
{i:'O704',c:'kozo',q:'中性強化液消火薬剤について、正しいものはどれか。',o:['界面活性剤にりん酸塩類などを配合したもので、pHは約7、窒息作用も有する','炭酸カリウムの濃厚水溶液で、pHは約12である','硫酸アルミニウムの水溶液で、酸性を示す','りん酸アンモニウムの粉末である'],a:0,e:'従来の強化液が炭酸カリウムの濃厚なアルカリ性水溶液（pH約12）であるのに対し、中性強化液は界面活性剤にりん酸塩類などを配合したもので、pHは約7。冷却・抑制に加えて窒息作用も持ちます。近年よく使われており、どちらを問われているかを読み分けてください。'},
{i:'O705',c:'kozo',q:'消火器のキャップまたは口金に減圧孔または減圧溝を設ける理由として、正しいものはどれか。',o:['キャップをはずすときに本体容器内部の圧力を徐々に逃がすため','消火薬剤の湿気を逃がすため','放射圧力を調整するため','薬剤の充てん量を確認するため'],a:0,e:'キャップをまわすと減圧孔から圧力が徐々に抜けていき、内圧が残ったままキャップが飛ぶ事故を防ぎます。キャップは減圧が完了するまでの間、本体容器内の圧力に耐えられることも求められます。なお消火器によっては、分解前に圧力を抜くための排圧栓がキャップに設けられています。'},
{i:'O706',c:'kozo',q:'消火器用消火薬剤の共通的性状として、規格省令上、誤っているものはどれか。',o:['一度使用された消火薬剤は、原料として再利用してよい','著しい毒性または腐食性を有しないこと','水溶性・液状のものは、結晶の析出や溶液の分離などの異常を生じないこと','粉末状のものは、塊状化や変質などの異常を生じないこと'],a:0,e:'一度使用されたものや、使用されずに収集・廃棄されたものは原料として用いてはなりません（再利用消火薬剤を除く）。また強化液消火薬剤については、アルカリ金属塩類の水溶液はアルカリ性反応を呈すること、凝固点が−20℃以下であることが定められています。'},
{i:'O707',c:'kan',q:'手さげ式消火器の安全栓のリング部について、正しいものはどれか。',o:['塗色は黄色で、材質はステンレス鋼（SUS304）またはこれと同等以上のもの','塗色は赤色で、材質は黄銅','塗色は緑色で、材質はアルミニウム','塗色・材質とも定めはない'],a:0,e:'リング部の塗色は黄色、材質はステンレス鋼（SUS304）またはこれと同等以上の耐食性および耐候性を有するものです。鑑別で写真から判別する際、黄色いリングが目印になります。'},
{i:'O708',c:'kan',q:'手さげ式消火器の安全栓を引き抜く方向として、規格省令上、正しいものはどれか。',o:['上方向（水平面上に置いた場合、垂直軸から30度以内の範囲）','下方向（垂直軸から30度以内の範囲）','横方向（水平面から45度以内の範囲）','方向の定めはない'],a:0,e:'上方向で、垂直軸から30度以内の範囲に引き抜くよう装着します。装着時、リング部は軸部が貫通する上レバーの穴から引き抜く方向に引いた線上になければなりません。衝撃を加えた場合やレバーを強く握った場合でも引き抜きに支障を生じず、かつ引き抜く動作以外では容易に抜けないことも要件です。'},
{i:'O709',c:'kozo',q:'大型消火器に必要な消火薬剤量の組合せとして、誤っているものはどれか。',o:['ハロゲン化物消火器 …… 20kg以上','水消火器 …… 80L以上','強化液消火器 …… 60L以上','二酸化炭素消火器 …… 50kg以上'],a:0,e:'ハロゲン化物消火器は30kg以上です。20kg以上は機械泡（20L以上）と粉末（20kg以上）。大型消火器の薬剤量は、水80L・強化液60L・機械泡20L・化学泡80L・二酸化炭素50kg・ハロゲン化物30kg・粉末20kgで、能力単位の要件（A火災10単位以上またはB火災20単位以上）と併せて問われます。'},
{i:'O710',c:'kozo',q:'手さげ式消火器（自動車用消火器を除く）の保持装置について、正しいものはどれか。',o:['原則として設けるが、鉛直に置くことができるものは設けなくてよい','すべての手さげ式消火器に必ず設ける','車載式にのみ設ける','保持装置の規定はない'],a:0,e:'保持装置は消火器を安定した状態に保たせるためのもので、手さげ式消火器（自動車用を除く）に原則として設けます。ただし鉛直に置くことができるものは不要とされており、現在販売されているほとんどの消火器がこれに該当します。質量による運搬方式の区分（28kg・35kg）とは別の規定なので、混同しないでください。'},
{i:'O711',c:'rui',q:'簡易消火用具に含まれないものはどれか。',o:['小型消火器','水バケツ','乾燥砂','膨張ひる石'],a:0,e:'簡易消火用具は、水バケツ、水槽、乾燥砂、膨張ひる石、膨張真珠岩の5つです。消火器（小型・大型・住宅用）と簡易消火用具をまとめて「消火器具」と呼びます。消火器そのものは簡易消火用具ではありません。'},
{i:'O712',c:'rui',q:'簡易消火用具の能力単位について、正しい組合せはどれか。',o:['水バケツ（8L×3個）…… 1.0単位','水バケツ（8L×3個）…… 0.5単位','乾燥砂（50L・スコップ付）…… 1.0単位','膨張ひる石（160L・スコップ付）…… 2.5単位'],a:0,e:'水バケツは容量8Lのもの3個で1.0単位です。水槽は80L（消火専用バケツ3個付）で1.5単位、190L（同6個付）で2.5単位。乾燥砂は50L（スコップ付）で0.5単位、膨張ひる石・膨張真珠岩は160L（スコップ付）で1.0単位。乾燥砂だけが0.5と半端なので、そこを起点に覚えると楽です。'},
{i:'O713',c:'rui',q:'水槽（消火専用バケツ6個付）190Lの能力単位はいくつか。',o:['2.5単位','1.0単位','1.5単位','0.5単位'],a:0,e:'190L・バケツ6個付で2.5単位です。80L・バケツ3個付なら1.5単位。容量が倍以上になってもバケツの数が倍なので、単位も約1.7倍という関係になります。'},
{i:'O714',c:'rui',q:'消火器具に設ける標識の表示として、誤っているものはどれか。',o:['乾燥砂 …… 「消火乾燥砂」','消火器 …… 「消火器」','水バケツ …… 「消火バケツ」','膨張ひる石・膨張真珠岩 …… 「消火ひる石」'],a:0,e:'乾燥砂は「消火砂」です。水槽は「消火水槽」。いずれも地は赤、文字は白で、大きさは長辺24cm以上×短辺8cm以上。設置高さは床面から1.5m以下という点は消火器と共通です。'},
{i:'O715',c:'rui',q:'消火器具の設置に関する基準として、誤っているものはどれか。',o:['すべての消火器について、地震による転倒を防止する措置を講じなければならない','床面からの高さが1.5m以下の箇所に設置すること','消火剤が凍結したり、変質・噴出するおそれが少ない箇所に設置すること','設置した箇所には、見やすい位置に標識を設けること'],a:0,e:'転倒防止措置は原則必要ですが、粉末消火器など転倒によって消火剤が漏出するおそれのない消火器は除かれます。化学泡消火器のように転倒すると作動・漏出するものには必要、という理屈です。'},
{i:'O716',c:'rui',q:'自動車用消火器として用いることができないものはどれか。',o:['化学泡消火器','霧状の強化液を放射する強化液消火器','二酸化炭素消火器','粉末消火器'],a:0,e:'自動車用消火器にできるのは、霧状の強化液消火器、機械泡消火器、ハロゲン化物消火器、二酸化炭素消火器、粉末消火器の5つです。水消火器と化学泡消火器は不可で、棒状放射の強化液消火器も設置できません。走行中の振動や転倒を考えれば、化学泡が外れる理由は想像がつきます。'},
{i:'O717',c:'rui',q:'電気設備がある場所に設ける消火器具について、正しいものはどれか。',o:['床面積100㎡以下ごとに1個以上の個数で算定する','床面積100㎡以下ごとに能力単位1以上で算定する','床面積25㎡で除した値以上の能力単位で算定する','床面積50㎡以下ごとに1個以上の個数で算定する'],a:0,e:'電気設備のある場所だけは「能力単位」ではなく「個数」で数えます。多量の火気を使用する場所は床面積÷25の能力単位、少量危険物は貯蔵量÷指定数量の能力単位、指定可燃物は貯蔵量÷（危政令別表第4の数量×50）の能力単位。電気設備だけ数え方が違う点が狙われます。'},
{i:'O718',c:'rui',q:'指定可燃物を貯蔵・取り扱う防火対象物に必要な能力単位の算定式として、正しいものはどれか.',o:['指定可燃物の数量 ÷（危険物政令別表第4で定める数量×50）','指定可燃物の数量 ÷ 危険物政令別表第4で定める数量','指定可燃物の数量 ÷ 25','指定可燃物の数量 ÷ 100'],a:0,e:'別表第4の数量の50倍で割ります。少量危険物が「貯蔵量÷指定数量」なのに対し、指定可燃物は50倍するぶん必要な能力単位が小さくなる、という関係です。'},

{i:'O719',c:'kozo',q:'A火災の能力単位を測定する第1消火試験において、第1模型を3個と第2模型を1個消火した場合の能力単位はいくつか。',o:['7','4','6','8'],a:0,e:'第1模型は1個につき2単位、第2模型は1個につき1単位として計算します。3×2＋1＝7。第1模型をS個だけ消火した場合は S×2、第2模型も1個消火した場合は S×2＋1 です。杉の角材を組んだ模型に点火して消火する試験で、B火災は第2・第3消火試験で測定します。'},
{i:'O720',c:'kozo',q:'手さげ式消火器（化学泡消火器を除く）の操作の機構について、規格省令上の動作数はどれか。',o:['1動作','2動作以内','3動作以内','4動作以内'],a:0,e:'手さげ式（化学泡を除く）は1動作です。化学泡消火器・据置式・背負式は2動作以内、車載式は3動作以内。なお保持装置から取りはずす動作、背負う動作、安全栓をはずす動作、ホースをはずす動作は、この動作数に含めません。'},
{i:'O721',c:'kozo',q:'消火器の放射性能について、規格省令上、正しいものはどれか。',o:['放射時間は温度20℃において10秒以上であること','放射時間は温度20℃において30秒以上であること','化学泡消火器は充てん量の90％以上を放射できること','放射距離は5m以上であること'],a:0,e:'放射時間は20℃で10秒以上。放射量は充てんされた消火剤の容量または質量の90％以上で、化学泡消火器だけ85％以上です。放射距離は「消火に有効な放射距離を有すること」とされるだけで、具体的な数値の定めはありません。'},
{i:'O722',c:'kozo',q:'規格省令上の消火器の使用温度範囲として、正しいものはどれか。',o:['化学泡消火器は5℃以上40℃以下、その他の消火器は0℃以上40℃以下','すべての消火器が0℃以上40℃以下','化学泡消火器は0℃以上40℃以下、その他は−20℃以上40℃以下','すべての消火器が5℃以上40℃以下'],a:0,e:'規格上は化学泡が5〜40℃、その他が0〜40℃です。この範囲は10℃単位で広げることができ、実際に市販されている消火器（化学泡・水消火器を除く）の下限は−20℃または−30℃になっています。「規格上の値」と「実際の製品の値」を区別して問われます。'},
{i:'O723',c:'kozo',q:'粉末消火薬剤の規格について、正しいものはどれか。',o:['呼び寸法180マイクロメートル以下の、消火上有効な微細な粉末であること','呼び寸法180ミリメートル以下であること','水面に均一に散布した場合、1時間以内に沈降すること','りん酸塩類等は白色に着色すること'],a:0,e:'180マイクロメートル以下です。また水面に均一に散布した場合に1時間以内に沈降しないこと（沈降してはいけません）、りん酸塩類等は淡紅色系に着色することが定められています。単位をミリに置き換えた選択肢と、沈降の有無を反転させた選択肢が定番です。'},
{i:'O724',c:'kozo',q:'消火器用消火薬剤の容器や包装に表示しなければならない事項として、誤っているものはどれか。',o:['能力単位の数値','品名','消火薬剤の容量または質量','充てん方法'],a:0,e:'表示事項は、品名、消火器の区別、消火薬剤の容量または質量、充てん方法、取扱い上の注意事項、製造年月、製造者名または商標、型式番号の8つです。能力単位は消火器本体の銘板に表示するもので、薬剤の容器には求められません。'},
{i:'O725',c:'kozo',q:'強化液消火薬剤の規格について、正しいものはどれか。',o:['凝固点が−20℃以下であること','凝固点が0℃以下であること','中性反応を呈すること','凝固点の定めはない'],a:0,e:'凝固点は−20℃以下です。またアルカリ金属塩類の水溶液にあってはアルカリ性反応を呈することとされています。強化液の使用温度範囲が−20℃からなのは、この凝固点の規定と対応しています。'},
{i:'O726',c:'kozo',q:'化学泡消火薬剤のうち、粉末状のものに求められる性状として正しいものはどれか。',o:['水に溶けやすい乾燥状態のものであること','水に溶けにくいものであること','あらかじめ水溶液としておくこと','油に溶けやすいものであること'],a:0,e:'粉末状の化学泡消火薬剤は、水に溶けやすい乾燥状態のものであることが求められます。泡消火薬剤には共通して、防腐処理を施したものであること（腐敗・変質等のおそれのないものを除く）、耐火性を持続できることも定められています。なお機械泡消火薬剤は「飲料水を使用すること」を容器に表示します。'},
{i:'O727',c:'kozo',q:'消火器の外面の塗色について、二酸化炭素消火器に求められる組合せとして正しいものはどれか。',o:['赤色25％以上、かつ緑色1/2以上','赤色1/2以上、かつ緑色25％以上','緑色のみ1/2以上','赤色のみ25％以上'],a:0,e:'消防法により外面の25％以上を赤色、高圧ガス保安法により1/2以上を緑色とします。2つの法令が同時にかかるため、両方を満たす必要があります。ハロン1301消火器は緑色ではなくねずみ色が1/2以上です。'},

{i:'O728',c:'kan',q:'耐圧性能に関する点検（水圧検査）の手順として、誤っているものはどれか。',o:['本体容器に消火薬剤を残したまま、水を足して加圧する','本体容器を分解し、消火薬剤を別の容器等に移す','本体容器を水道水で満たしてキャップを締める','レバー固定金具を取り付けてバルブを開いた状態にする'],a:0,e:'まず分解して消火薬剤を別の容器に移し、本体容器の内外を清掃して腐食や防錆材料の脱落がないかを確認してから、水道水で満たします。薬剤を残したまま加圧することはありません。その後ホース接続部に耐圧試験用接続金具を接続し、保護枠をかぶせ、レバー固定金具でバルブを開いた状態にして、表示された耐圧試験圧力値まで徐々に加圧します。'},
{i:'O729',c:'kan',q:'耐圧性能点検で加圧した後、水圧をかけ続ける時間として正しいものはどれか。',o:['5分間','1分間','10分間','30分間'],a:0,e:'所定の水圧を5分間かけて、変形・損傷・漏れがないことを確認します。終わったら耐圧試験機の排圧栓から水圧を排除し、圧力計の指針が0になったことを確認してから排水します。'},
{i:'O730',c:'kan',q:'耐圧性能点検の後、粉末消火器について特に注意すべきこととして正しいものはどれか。',o:['水分は厳禁なので、薬剤を充てんする前に乾燥炉などで十分に乾燥させる','水分が残っていても薬剤を充てんしてよい','水道水ではなく蒸留水を使用する','乾燥させずに直ちに充てんする'],a:0,e:'粉末消火薬剤は水分で固化するため、水分が残っていると消火器として機能しなくなります。ウエスやエアブローガンで水分を除去したうえで、乾燥炉などで十分に乾燥させてから充てんします。'},
{i:'O731',c:'kan',q:'加圧式粉末消火器に消火薬剤を充てんする手順について、安全栓をセットするタイミングとして正しいものはどれか。',o:['加圧用ガス容器を取り付ける前','加圧用ガス容器を取り付けた後','消火薬剤を入れた後','キャップを締めた後'],a:0,e:'加圧用ガス容器を取り付ける前に安全栓をセットします。先にガス容器を取り付けてしまうと、レバーが動いたときにカッターが作動封板を切ってしまうおそれがあるためです。順序は、粉上り防止用封板の交換 → 安全栓のセット → 加圧用ガス容器の取付け → 漏斗で薬剤を入れる、と続きます。'},
{i:'O732',c:'kan',q:'加圧式粉末消火器の充てん作業について、誤っているものはどれか。',o:['消火薬剤を入れた後、沈殿するまで待ってからサイホン管を挿入する','本体容器に漏斗を挿入して、規定量の消火薬剤を入れる','口金のパッキン座やねじ等に付着した粉末薬剤は刷毛等で取り除く','本体容器をクランプ台に固定し、キャップスパナでキャップを締める'],a:0,e:'逆です。充てんした消火薬剤が沈殿しないうちに、サイホン管をすばやく口金に挿入します。沈殿して固まるとサイホン管が入らなくなるためです。最後に安全栓の封と使用済み表示装置を取り付けて完了します。'},
{i:'O733',c:'kan',q:'化学泡消火器を分解する際、本体容器をクランプ台に固定するときの注意事項として正しいものはどれか。',o:['転倒式の消火器は30度以上傾けないこと','転倒式の消火器は45度以上傾けないこと','傾ける角度に制限はない','必ず逆さまにして固定すること'],a:0,e:'転倒式は傾けると薬剤が混ざって作動してしまうため、30度以上傾けてはいけません。固定したらキャップハンドルに木製のてこ棒を差し込んで左方向にまわし、キャップをはずして内筒を取り出します。金属製ではなく木製のてこ棒を使う点も問われます。'},
{i:'O734',c:'kan',q:'化学泡消火器を分解した後、消火薬剤の量を確認する方法として正しいものはどれか.',o:['内筒・外筒それぞれの液面表示で確認する','総質量を測定して確認する','指示圧力計で確認する','放射時間を計測して確認する'],a:0,e:'化学泡消火器は内筒・外筒それぞれに液面表示があるので、それで規定量を確認します。総質量で確認するのは二酸化炭素消火器や容器弁のない加圧用ガス容器、指示圧力計で確認するのは蓄圧式。消火器の種類によって確認方法が違う点が整理のポイントです。'},

{i:'O735',c:'kyo',q:'防炎規制の対象とならない防火対象物はどれか。',o:['小学校','テレビスタジオ','建設工事中の建築物','高さ33mの共同住宅'],a:0,e:'通常の非特定防火対象物である小学校は防炎規制の対象外です。防炎防火対象物は、高層建築物（高さ31mを超える建築物）、地下街、特定防火対象物、映画スタジオ・テレビスタジオ、工事中の建築物などです。共同住宅は非特定ですが、33mなら高層建築物として対象になります。'},
{i:'O736',c:'kyo',q:'防炎規制の対象となる防炎物品に含まれないものはどれか。',o:['木製の机','カーテン','じゅうたん等','工事用シート'],a:0,e:'防炎物品はカーテン、布製のブラインド、暗幕、じゅうたん等、展示用の合板、どん帳、舞台で使用する幕、舞台で使用する大道具用の合板、工事用シートです。家具は含まれません。基準をクリアした製品には防炎表示が付きます。'},
{i:'O737',c:'kyo',q:'統括防火管理者の選任が必要な防火対象物として、正しいものはどれか（いずれも管理権原が複数に分かれているものとする）。',o:['高さ31mを超える建築物のすべて','高さ31mの建築物のすべて','階数にかかわらずすべての特定防火対象物','収容人員30人以上のすべての防火対象物'],a:0,e:'高層建築物は「高さ31mを超える」もので、31mちょうどは含みません。このほか、自力避難困難者入所施設は地階を除く階数3以上かつ収容人員10人以上、それ以外の特定防火対象物は地階を除く階数3以上かつ収容人員30人以上、非特定用途のみの複合用途防火対象物は地階を除く階数5以上かつ収容人員50人以上、準地下街はすべて、地下街は消防長または消防署長が指定するものが対象です。'},
{i:'O738',c:'kyo',q:'統括防火管理者の業務として、正しいものはどれか。',o:['防火対象物全体についての消防計画を作成し、所轄消防長または消防署長に届け出る','各テナントごとの消防計画を作成する','消防用設備等の工事を行う','建築確認の申請を行う'],a:0,e:'統括防火管理者は、管理権原が複数に分かれている建物全体を統括する立場です。建物全体の消防計画を作成して所轄消防長または消防署長に届け出るほか、全体について防火管理上必要な業務を行います。各テナントの消防計画は、それぞれの防火管理者が作成します。'},
{i:'O739',c:'kyo',q:'消防用設備等の点検を、消防設備士または消防設備点検資格者に行わせなければならない防火対象物として、正しいものはどれか。',o:['延べ面積1000㎡以上の特定防火対象物','延べ面積500㎡以上のすべての防火対象物','延べ面積300㎡以上の特定防火対象物','すべての防火対象物'],a:0,e:'有資格者による点検が必要なのは、延べ面積1000㎡以上の特定防火対象物、延べ面積1000㎡以上で消防長等が指定した非特定防火対象物、特定一階段等防火対象物、全域放出方式の二酸化炭素消火設備が設けられたものです。これ以外は防火管理者等が点検できます。'},
{i:'O740',c:'kyo',q:'消防用設備等について、消防設備士でなくても行える工事または整備はどれか。',o:['電源、水源および配管の部分の工事','自動火災報知設備の感知器の交換','消火器の分解整備','屋内消火栓設備の開閉弁の取替え'],a:0,e:'電源・水源・配管の部分の工事は消防設備士の独占業務から除かれています。ほかに、表示灯の交換、ホースやノズル・ヒューズ類の交換、消火栓箱や漏電火災警報器の交換など軽微な整備も資格不要です。設備本体に関わる工事・整備は消防設備士でなければ行えません。'},

{i:'O741',c:'kiso',q:'一直線上で同じ向きに働く5Nと3Nの力の合力はいくらか。',o:['8N','2N','15N','4N'],a:0,e:'同じ向きなら単純な和で8N、逆向きなら差をとって2Nになり、向きは大きいほうに従います。直角に交わる場合は √(5²+3²)＝√34 ≈ 5.8N。力の合成はベクトルなので、向きによって計算が変わる点が出題の軸です。'},
{i:'O742',c:'kiso',q:'長さ2mの棒の一端を支点とし、他端に30Nの力を加えたときの力のモーメントはいくらか。',o:['60N·m','15N·m','32N·m','0.067N·m'],a:0,e:'M＝F×L＝30×2＝60N·m。単位がN·mである点も確認してください。同じモーメントを得るのに、距離が半分になれば力は倍必要になります。'},
{i:'O743',c:'kiso',q:'断面積20mm²の材料に600Nの引張荷重が加わったときの引張応力はいくらか。',o:['30N/mm²','12000N/mm²','0.033N/mm²','620N/mm²'],a:0,e:'応力＝荷重÷断面積＝600÷20＝30N/mm²（＝30MPa）。断面積が大きいほど応力は小さくなるので、太い材料のほうが丈夫、という直感と一致します。'},
{i:'O744',c:'kiso',q:'引張強さ400N/mm²の材料を、安全率4で使用する場合の許容応力はいくらか。',o:['100N/mm²','1600N/mm²','396N/mm²','0.01N/mm²'],a:0,e:'許容応力＝基準強さ÷安全率＝400÷4＝100N/mm²。安全率を大きくとるほど許容応力は小さくなり、設計は安全側に振れます。安全率は必ず1より大きい値です。'},
{i:'O745',c:'kiso',q:'長さ200mmの材料に荷重を加えたところ、1mm伸びた。このときのひずみはいくらか。',o:['0.005','0.5','200','0.05'],a:0,e:'ひずみ＝変形量÷元の長さ＝1÷200＝0.005。ひずみは長さを長さで割った比なので、単位はありません。百分率で表すと0.5％です。'},
{i:'O746',c:'kiso',q:'圧力0.2MPaで体積3Lの気体を、温度一定のまま圧力0.6MPaに圧縮したときの体積はいくらか。',o:['1L','9L','0.9L','2L'],a:0,e:'温度一定なのでボイルの法則 PV＝一定。0.2×3＝0.6×V より V＝1L。圧力が3倍になれば体積は1/3になる、という反比例の関係です。'},
{i:'O747',c:'kiso',q:'100Nの物体を5秒かけて2m持ち上げたときの仕事率はいくらか。',o:['40W','1000W','10W','200W'],a:0,e:'仕事＝100×2＝200J。仕事率＝200÷5＝40W。仕事の単位はJ（＝N·m）、仕事率の単位はW（＝J/s）です。'},
{i:'O748',c:'kiso',q:'セルシウス温度27℃を絶対温度で表すといくらか。',o:['300K','27K','246K','273K'],a:0,e:'絶対温度＝セルシウス温度＋273。27＋273＝300K。シャルルの法則やボイル・シャルルの法則の計算では、必ず絶対温度に直してから計算します。ここを摂氏のまま計算すると答えが合いません。'},
{i:'O749',c:'kiso',q:'金属材料の性質について、正しいものはどれか。',o:['炭素鋼は炭素の含有量が多いほど硬くなるが、もろくなる','炭素鋼は炭素の含有量が多いほど軟らかくなる','鋳鉄は炭素鋼より炭素の含有量が少ない','ステンレス鋼は銅と亜鉛の合金である'],a:0,e:'炭素が増えるほど硬く、同時にもろくなります。鋳鉄は炭素が約2％以上と炭素鋼より多く、硬いぶん衝撃に弱いため、消火器の本体容器には使われません。ステンレス鋼は炭素鋼にニッケルとクロムを加えたもの、銅と亜鉛の合金は黄銅です。'},
{i:'O750',c:'kiso',q:'ねじについて、誤っているものはどれか。',o:['一般的な右ねじは反時計回りで締まる','ピッチは隣り合うねじ山の間隔である','リードは1回転で軸方向に進む距離である','二条ねじではリードはピッチの2倍になる'],a:0,e:'右ねじは時計回りで締まります。ただし消火器の加圧用ガス容器の容器弁など、誤操作防止のために左ねじが使われている箇所があるため、整備時は必ず確認が必要です。'},
{i:'O751',c:'rui',q:'延べ面積にかかわりなく消火器具を設置しなければならない防火対象物はどれか。',o:['重要文化財','一般事務所','小学校','倉庫'],a:0,e:'延べ面積に関係なく設置が必要なのは、劇場・映画館等、キャバレー等、遊技場、性風俗関連店舗、カラオケボックス等、待合・料理店等と飲食店（火を使用する設備・器具を設けたもの）、入院施設のある病院・診療所、自力避難困難者入所施設、地下街、準地下街、重要文化財等、総務省令で定める舟車です。「重・病・老人、地下で火遊び」とまとめると拾えます。'},
{i:'O752',c:'rui',q:'延べ面積300㎡以上で消火器具の設置義務が生じる防火対象物はどれか。',o:['会社などの一般的な事務所','工場','旅館','共同住宅'],a:0,e:'300㎡以上の区分は、学校（小・中・高・大・専修学校等）、図書館・博物館・美術館等、車両の停車場や船舶・航空機の発着場、神社・寺院・教会等、一般的な事務所の5つだけです。工場・旅館・共同住宅はいずれも150㎡以上の区分に入ります。'},
{i:'O753',c:'rui',q:'延べ面積150㎡以上で消火器具の設置義務が生じる防火対象物として、誤っているものはどれか。',o:['図書館','百貨店・物品販売店舗','旅館・ホテル','自動車車庫または駐車場'],a:0,e:'図書館は300㎡以上の区分です。150㎡以上の区分には、公会堂・集会場、待合・料理店等と飲食店（火を使用する設備・器具のないもの）、百貨店・マーケット・物品販売店舗・展示場、旅館・ホテル・宿泊所等、寄宿舎・下宿・共同住宅、入院施設のない診療所等、社会福祉施設等、幼稚園・特別支援学校、公衆浴場、工場・作業場、映画スタジオ・テレビスタジオ、自動車車庫・駐車場、飛行機の格納庫、倉庫が入ります。'},
{i:'O754',c:'rui',q:'延べ面積200㎡の防火対象物のうち、消火器具を設置しなくてよいものはどれか。',o:['一般事務所','工場','物品販売店舗','倉庫'],a:0,e:'一般事務所は300㎡以上の区分なので、200㎡では設置義務がありません。工場・物品販売店舗・倉庫はいずれも150㎡以上の区分なので、200㎡なら必要です。面積を具体的に与えて判断させる形式が頻出です。'},
{i:'O755',c:'rui',q:'飲食店における消火器具の設置義務について、正しいものはどれか。',o:['火を使用する設備・器具を設けたものは延べ面積に関係なく、設けないものは150㎡以上で必要','延べ面積に関係なくすべて必要','150㎡以上ですべて必要','300㎡以上で必要'],a:0,e:'飲食店と待合・料理店等は、火を使用する設備・器具を設けたものは面積に関係なく、設けないものは150㎡以上という二段構えです。IHコンロなど火を使わないものや、調理油加熱安全装置を設ける場合は「設けたもの」から除かれます。'},
{i:'O756',c:'rui',q:'消火器具を設置する防火対象物の区分について、正しい組合せはどれか。',o:['地下街 …… 延べ面積に関係なく設置','地下街 …… 150㎡以上で設置','準地下街 …… 300㎡以上で設置','重要文化財 …… 150㎡以上で設置'],a:0,e:'地下街・準地下街・重要文化財等は、いずれも延べ面積に関係なく設置が必要です。避難が困難であったり、失われると取り返しがつかなかったりする対象なので、面積による免除がありません。'},

{i:'O757',c:'kyo',q:'消防法別表第1における危険物の分類について、第4類の性質として正しいものはどれか。',o:['引火性液体','酸化性固体','可燃性固体','自己反応性物質'],a:0,e:'第1類が酸化性固体、第2類が可燃性固体、第3類が自然発火性物質および禁水性物質、第4類が引火性液体、第5類が自己反応性物質、第6類が酸化性液体です。品名まで細かく覚える必要はありませんが、1類〜6類の「性質」は組合せで問われます。'},
{i:'O758',c:'kyo',q:'ガソリンが該当する危険物の区分として、正しいものはどれか。',o:['第4類・第1石油類','第4類・第2石油類','第2類・可燃性固体','第6類・酸化性液体'],a:0,e:'ガソリンは第4類（引火性液体）の第1石油類です。灯油・軽油は同じ第4類の第2石油類。危険物取扱者乙種4類の範囲と重なるので、お持ちであれば復習になります。'},
{i:'O759',c:'kyo',q:'消防法の規制対象となる危険物に含まれないものはどれか。',o:['放射性物質','引火性液体','酸化性固体','自己反応性物質'],a:0,e:'放射性物質や天然ガスは別の法律で規制されているため、消防法別表第1の危険物には含まれません。消防法が扱うのは、火災の発生や拡大に直接つながる6分類です。'},
{i:'O760',c:'kyo',q:'指定数量以上の危険物を貯蔵・取り扱うことができる施設の総称として、正しいものはどれか。',o:['製造所等','防火対象物','消防対象物','特定防火対象物'],a:0,e:'製造所・貯蔵所・取扱所をまとめて「製造所等」といいます。市町村長等の許可を得た施設で、指定数量以上の危険物は原則としてここ以外の場所で貯蔵・取扱いができません。指定数量は危険物の品名ごとに定められた基準量です。'},
{i:'O761',c:'kyo',q:'危険物施設とその説明の組合せとして、誤っているものはどれか。',o:['移送取扱所 …… タンクローリーで危険物を運搬する施設','給油取扱所 …… ガソリンスタンド','移動タンク貯蔵所 …… 車両に固定したタンクで危険物を運搬する施設','一般取扱所 …… クリーニング工場、ボイラー施設など'],a:0,e:'移送取扱所は配管で危険物を移送する施設（パイプライン）です。タンクローリーは移動タンク貯蔵所。「移送」と「移動」が紛らわしいので、移送＝配管、移動＝車両、と覚えてください。'},
{i:'O762',c:'kyo',q:'検定の対象とならないものはどれか。',o:['消防用ホース','消火器','閉鎖型スプリンクラーヘッド','緩降機'],a:0,e:'消防用ホースは検定対象ではなく、自主表示対象機械器具等です。検定対象は、消火器、消火器用消火薬剤（二酸化炭素を除く）、泡消火薬剤（水溶性液体用を除く）、感知器・発信機、中継器、受信機、住宅用防災警報器、閉鎖型スプリンクラーヘッド、流水検知装置、一斉開放弁、金属製避難はしご、緩降機の12品目です。'},
{i:'O763',c:'kyo',q:'自主表示対象機械器具等に含まれないものはどれか。',o:['消火器','動力消防ポンプ','消防用ホース','漏電火災警報器'],a:0,e:'消火器は検定対象です。自主表示対象は、動力消防ポンプ、消防用ホース、消防用吸管、結合金具、エアゾール式簡易消火具、漏電火災警報器の6つ。メーカー自身が規格適合を検査して表示する仕組みで、表示のない製品は販売・設置ができない点は検定対象と同じです。'},
{i:'O764',c:'kyo',q:'消火器用消火薬剤のうち、検定の対象とならないものはどれか。',o:['二酸化炭素','りん酸アンモニウムを主成分とする粉末','炭酸カリウム水溶液（強化液）','炭酸水素ナトリウムを主成分とする粉末'],a:0,e:'消火器用消火薬剤は検定対象ですが、二酸化炭素は除かれています。泡消火薬剤も検定対象ですが、水溶性液体用のものは除かれます。この2つの「除く」が選択肢になります。'},
{i:'O765',c:'kyo',q:'防火対象物点検資格者による点検が必要な防火対象物として、原則の基準はどれか。',o:['収容人員300人以上の特定防火対象物','収容人員100人以上の特定防火対象物','収容人員300人以上のすべての防火対象物','延べ面積1000㎡以上の特定防火対象物'],a:0,e:'原則は収容人員300人以上の特定防火対象物です。ただし特定一階段等防火対象物に該当する場合は、収容人員30人以上（自力避難困難者入所施設が避難階以外にある場合は10人以上）でも対象になります。点検基準に適合すると認められた防火対象物は、点検済証を表示できます。'},
{i:'O766',c:'kyo',q:'特定一階段等防火対象物に該当するものとして、正しいものはどれか（避難階は1階、階段はすべて避難階に直通するものとする）。',o:['屋内階段が1で、地階に飲食店がある複合用途防火対象物','屋内階段が2で、地階を除く階数3の病院','屋内階段が2で、地階を除く階数5の共同住宅','屋内階段が1で、1階が展示場、2階が遊技場の複合用途防火対象物'],a:0,e:'特定一階段等防火対象物は、特定用途部分が地階または3階以上にあり、かつ避難階に直通する屋内階段が1つしかないものです。選択肢2は階段が2つ、3は共同住宅で特定防火対象物でない、4は特定用途が1階と2階にあり地階・3階以上にないため、いずれも該当しません。'},

{i:'O767',c:'kiso',q:'10秒間に50m移動した物体の平均の速度はいくらか。',o:['5m/s','500m/s','0.2m/s','60m/s'],a:0,e:'速度 v＝S/t＝50÷10＝5m/s。速度は単位時間あたりの移動距離です。'},
{i:'O768',c:'kiso',q:'速度4m/sで動いていた物体が、5秒後に速度14m/sになった。このときの加速度はいくらか。',o:['2m/s²','10m/s²','2.8m/s²','70m/s²'],a:0,e:'加速度 α＝(v₁−v₀)/t＝(14−4)÷5＝2m/s²。加速度は単位時間あたりの速度の変化量で、単位はm/s²です。速度の式（m/s）と混同しないでください。'},
{i:'O769',c:'kiso',q:'物体が一定の加速度で移動することを何というか。',o:['等加速度運動','等速直線運動','自由落下運動','慣性運動'],a:0,e:'加速度が一定の運動を等加速度運動といいます。そのうち、重力によって物体が落下するものが自由落下運動で、加速度は重力加速度 g≒9.8m/s² になります。速度が一定で変化しないのは等速直線運動です。'},
{i:'O770',c:'kiso',q:'質量5kgの物体に10Nの力を加えたときに生じる加速度はいくらか。',o:['2m/s²','50m/s²','0.5m/s²','15m/s²'],a:0,e:'運動の法則 F＝ma より、α＝F/m＝10÷5＝2m/s²。加速度は力に比例し、質量に反比例します。同じ力でも重い物ほど加速しにくい、という日常の感覚と一致します。'},

{i:'O771',c:'kan',q:'外形点検で本体容器に腐食が認められた場合の措置として、正しいものはどれか。',o:['耐圧性能試験を行って安全性を確認する','直ちに廃棄処分とする','塗装し直して継続使用する','薬剤を詰め替えて継続使用する'],a:0,e:'腐食のあるものは耐圧性能試験を行います。ただし、溶接部の損傷や著しい変形により機能上支障のおそれがあるもの、著しく腐食しているもの、錆がはく離するようなものは、試験をせずに廃棄処分とします。腐食部分をサンドペーパーで処理しても深い腐食が残る場合も廃棄です。'},
{i:'O772',c:'kan',q:'外形点検の結果、試験を行わずに廃棄処分としなければならないものとして、誤っているものはどれか。',o:['指示圧力計が緑色範囲を下回っているもの','溶接部の損傷や著しい変形により、機能上支障のおそれのあるもの','著しく腐食しているもの','錆がはく離するようなもの'],a:0,e:'指示圧力計が緑色範囲を下回っているのは、薬剤やガスの漏れ、あるいは使用済みを示すもので、整備（再充てんや部品交換）の対象です。本体容器そのものの強度に関わる3つ（溶接部の損傷・著しい変形、著しい腐食、錆のはく離）が廃棄の基準になります。'},
{i:'O773',c:'kan',q:'点検のために消火器を所定の設置位置から移動したままにする場合の措置として、正しいものはどれか。',o:['代替消火器を設置しておく','標識だけを残しておく','移動した旨を掲示しておく','特に措置は不要である'],a:0,e:'消火器が不在になる間も消火能力を確保するため、代替消火器を設置しておきます。点検は防火対象物の安全を保つために行うものなので、点検中に無防備になっては本末転倒だという考え方です。'},
{i:'O774',c:'kan',q:'外形点検における安全栓の確認項目として、誤っているものはどれか。',o:['引き抜いて、確実に抜けることを確認する','はずれていないことを目視で確認する','操作に支障がある変形・損傷等がないことを確認する','確実に装着されていることを確認する'],a:0,e:'外形点検で安全栓を引き抜いてはいけません。引き抜けば封が壊れ、使用済みの状態になってしまいます。確認するのは、はずれていないこと、変形・損傷等がないこと、確実に装着されていること、そして封に損傷・脱落がなく確実に取り付けられていることです。'},
{i:'O775',c:'kan',q:'消火器の外形点検において、目視で確認する対象として適当でないものはどれか.',o:['本体容器内部の消火薬剤の状態','本体容器の変形・損傷・著しい腐食','安全栓の封の損傷・脱落','使用済み表示装置の状態'],a:0,e:'薬剤の状態は分解しないと見えないため、内部及び機能の点検で確認します。外形点検は設置されているすべての消火器について外観を目視で見るもので、分解は伴いません。外形点検と内部及び機能の点検の区別が問われます。'},
{i:'O776',c:'kan',q:'消火器の機器点検における、外形点検と内部及び機能の点検の関係として、正しいものはどれか。',o:['外形点検は設置されているすべての消火器について行い、内部及び機能の点検は種類ごとに定められた時期から行う','いずれもすべての消火器について毎回行う','外形点検は抜取り方式で行う','内部及び機能の点検は外形点検の前に行う'],a:0,e:'外形点検は6か月ごとの機器点検で全数について行います。内部及び機能の点検は、加圧式が製造年から3年、蓄圧式が5年、化学泡が設置後1年ごとと、開始時期が種類で分かれます。外形で異常が見つかった場合に、より踏み込んだ確認へ進むという関係です。'},
{i:'O777',c:'kan',q:'消火器の点検において、キャップの確認で用いる工具として適当なものはどれか。',o:['キャップスパナ','モンキーレンチ','プライヤー','ドライバー'],a:0,e:'キャップの締付けや取りはずしにはキャップスパナを使います。汎用工具でこじるとキャップや口金を傷め、内圧がかかった状態では危険です。化学泡の分解では、キャップハンドルに木製のてこ棒を差し込んで左方向にまわします。'},
{i:'O778',c:'rui',q:'消火器具を設置する場所について、地階・無窓階・3階以上の階に設置義務が生じる床面積の基準はどれか。',o:['50㎡以上','100㎡以上','150㎡以上','300㎡以上'],a:0,e:'建物全体としての設置義務とは別に、地階・無窓階・3階以上の階については、用途にかかわらず床面積50㎡以上で設置が必要です。避難が困難な階だからです。能力単位は「床面積÷算定基準面積」で求めます。延べ面積の150㎡・300㎡と混同しないでください。'},
{i:'O779',c:'rui',q:'消火器具を設置する場所に他の消火設備を設置した場合、能力単位を減少できる割合として、正しい組合せはどれか。',o:['大型消火器は1／2、屋内消火栓設備・スプリンクラー設備は1／3','大型消火器は1／3、屋内消火栓設備・スプリンクラー設備は1／2','いずれも1／2','いずれも1／3'],a:0,e:'大型消火器が1／2、屋内消火栓設備・スプリンクラー設備が1／3、水噴霧消火設備・泡消火設備・不活性ガス消火設備・ハロゲン化物消火設備・粉末消火設備が1／3です。大型消火器だけが1／2で、固定式の消火設備はすべて1／3、と整理すると取り違えません。'},
{i:'O780',c:'rui',q:'本来なら能力単位6が必要な部分にスプリンクラー設備を設置した場合、必要な能力単位はいくつになるか。',o:['4','2','3','6'],a:0,e:'スプリンクラー設備は1／3を減少できるので、6×1／3＝2を減らせます。6−2＝4が必要な能力単位です。「1／3に減少する（答えが2になる）」ではなく「1／3を減少できる」という規定なので、残るのは3分の2です。ここが最も間違えやすい点です。'},
{i:'O781',c:'rui',q:'設置個数の減少規定について、正しいものはどれか。',o:['設置する消火設備の火災に対する適応性が、消火器の適応性と同じでなければ減少できない','消火設備の種類を問わず減少できる','減少できるのは建物全体についてである','大型消火器を設置した場合は減少できない'],a:0,e:'適応性が同じでなければ能力単位を減少できません。また減少できるのは、その消火設備の有効範囲内の部分についてだけで、建物全体ではありません。たとえばB火災にしか適応しない設備を置いても、A火災に対する能力単位は減らせない、という理屈です。'},
{i:'O782',c:'rui',q:'指定可燃物を貯蔵・取り扱う場所について、大型消火器の設置が必要となるのはどのような場合か。',o:['取扱数量が危険物政令別表第4に指定する数量の500倍以上の場合','取扱数量が指定数量の50倍以上の場合','取扱数量にかかわらず常に必要','床面積が500㎡以上の場合'],a:0,e:'指定可燃物の取扱数量が危政令別表第4の数量の500倍以上になると、大型消火器の設置が必要です。能力単位の算定式（取扱数量÷（別表第4の数量×50））の50倍と、大型消火器が必要になる500倍を取り違えないでください。'},

{i:'O783',c:'kan',q:'消火器の分解・整備に用いる器具とその用途の組合せとして、誤っているものはどれか。',o:['プライヤー …… キャップを外す（口径固定）','キャップスパナ …… キャップを外す','クランプ台 …… 消火器本体を固定する','ロート（漏斗）…… 粉末薬剤を充てんする'],a:0,e:'プライヤーは口径が可変の工具で、加圧用ガス容器を外すときなどに使います。キャップを外すのはキャップスパナです。汎用工具でキャップをこじると口金を傷め、内圧が残っていれば危険なので、専用のキャップスパナを使います。'},
{i:'O784',c:'kan',q:'加圧式粉末消火器を分解する手順として、正しい順序はどれか。',o:['総質量を測り薬剤量を確認 → クランプ台に固定 → 排圧栓を開き残圧を抜く → キャップスパナでキャップを緩める → バルブを抜き取り加圧用ガス容器を外す','クランプ台に固定 → キャップを緩める → 残圧を抜く → 加圧用ガス容器を外す','キャップを緩める → 総質量を測る → 残圧を抜く → 加圧用ガス容器を外す','残圧を抜く → キャップを緩める → クランプ台に固定 → 総質量を測る'],a:0,e:'最初に総質量を測るのは、分解すると薬剤量が分からなくなるためです。そして残圧を抜くのは必ずキャップを緩める前。内圧が残ったままキャップを緩めると、キャップが飛んで重大事故になります。この2点の順序が守られているかで正誤が判断できます。'},
{i:'O785',c:'kan',q:'消火器の分解・整備において、クランプ台を使用する目的として正しいものはどれか.',o:['消火器本体を固定して、キャップを回す際に本体が動かないようにする','消火器を傾けて薬剤を排出する','加圧用ガス容器を保持する','本体容器に水圧をかける'],a:0,e:'クランプ台は本体を固定する台です。キャップはかなり強く締まっているため、本体を固定しないと回せません。なお化学泡消火器を固定するときは、転倒式を30度以上傾けないよう注意します。'},

{i:'O786',c:'kozo',q:'加圧用ガス容器の塗色について、正しい組合せはどれか（内容積100cm³を超えるものとする）。',o:['液化炭酸ガスは緑色、窒素ガスはねずみ色を、それぞれ表面積の1／2以上','いずれもねずみ色を容器全体に','いずれも緑色を表面積の1／2以上','液化炭酸ガスはねずみ色、窒素ガスは緑色を、それぞれ容器全体に'],a:0,e:'充てんされているガスの種類で色が決まります。液化炭酸ガスが緑色、窒素ガス（二酸化炭素との混合ガスを含む）がねずみ色。いずれも容器全体ではなく、表面積の1／2以上です。二酸化炭素消火器が緑色なのと同じ理屈で、中身のガスが何かを色で示しています。'},
{i:'O787',c:'kozo',q:'高圧ガス保安法の適用について、正しいものはどれか。',o:['二酸化炭素消火器とハロン1301消火器は蓄圧式だが、適用を受ける','蓄圧式の消火器はすべて適用を受けない','加圧式の消火器はすべて適用を受ける','化学泡消火器が適用を受ける'],a:0,e:'「蓄圧式だから適用外」ではありません。蓄圧式の水・強化液・機械泡・粉末は使用圧力が0.98MPa以下に抑えられているため適用を受けませんが、同じ蓄圧式でも二酸化炭素消火器とハロン1301・1211消火器は充てん圧力が高く、適用を受けます。加圧方式ではなく圧力で決まる、というのが正しい理解です。'},
{i:'O788',c:'kozo',q:'高圧ガスの定義（圧縮ガスの場合）として、正しいものはどれか。',o:['温度35℃において圧力1MPa以上のもの','温度20℃において圧力1MPa以上のもの','温度にかかわらず圧力1MPa以上のもの','温度35℃において圧力0.98MPa以上のもの'],a:0,e:'温度35℃という条件が付きます。蓄圧式消火器の使用圧力範囲の上限が0.98MPaという中途半端な数値なのは、35℃でもこの1MPaを下回るように決められているからです。温度の条件を落とした選択肢が出ます。'},
{i:'O789',c:'kozo',q:'規格省令が定める消火器の使用温度範囲として、正しいものはどれか。',o:['化学泡消火器は5℃以上40℃以下、その他の消火器は0℃以上40℃以下','すべての消火器が0℃以上40℃以下','化学泡消火器は0℃以上40℃以下、その他は−20℃以上40℃以下','すべての消火器が−30℃以上40℃以下'],a:0,e:'規格省令が定めるのは、化学泡5〜40℃、その他0〜40℃の2区分です。この範囲は10℃単位で広げることができ、実際の製品はその分だけ下限が低くなっています。「規格上の値」と「実際の製品の値」は別物なので、設問がどちらを聞いているかを読み分けてください。'},
{i:'O791',c:'kozo',q:'消火器ごとの使用温度範囲（実際の製品）について、誤っているものはどれか。',o:['粉末消火器（ガス加圧式）…… −30℃〜+40℃','粉末消火器（蓄圧式）…… −30℃〜+40℃','強化液消火器 …… −20℃〜+40℃','化学泡消火器 …… +5℃〜+40℃'],a:0,e:'ガス加圧式の粉末消火器は−20℃〜+40℃です。同じ粉末でも、蓄圧式が−30℃、ガス加圧式が−20℃と下限が違います。蓄圧式は窒素ガスで加圧されていて低温でも圧力が確保しやすいのに対し、ガス加圧式は作動時のガス発生が低温で鈍るためです。この2つを入れ替えた選択肢が出ます。'},
{i:'O792',c:'kozo',q:'水消火器の使用温度範囲として、正しいものはどれか。',o:['0℃〜+40℃','−20℃〜+40℃','−30℃〜+40℃','+5℃〜+40℃'],a:0,e:'水消火器は0℃〜+40℃です。水そのものが0℃で凍るためで、凝固点を下げる処理をしている強化液（−20℃）とは対照的です。化学泡の+5℃とあわせて、下限が0℃以上になるのは水消火器と化学泡消火器の2つだけ、と押さえてください。'},
{i:'O793',c:'kozo',q:'消火器本体に表示しなければならない事項として、誤っているものはどれか。',o:['消火薬剤の製造年月','加圧式又は蓄圧式の区別','A火災又はB火災に対する能力単位の数値','安全弁の作動圧力値'],a:0,e:'製造年月（年と月）は消火薬剤の容器・包装への表示事項です。消火器本体に表示するのは製造年（年のみ）で、ほかに製造番号・製造者名・型式番号があります。本体は19項目、薬剤容器は8項目で、似た言葉を入れ替える出題が定番です。'},
{i:'O794',c:'kozo',q:'消火器の表示に関する記述として、正しいものはどれか。',o:['使用方法は、手さげ式及び据置式の消火器では図示もしなければならない','ホースの有効長はすべての消火器で表示しなければならない','放射距離の表示は不要である','業務用消火器である旨の表示は求められていない'],a:0,e:'使用方法は全消火器が表示対象で、そのうち手さげ式と据置式は図示も必要です。ホースの有効長は据置式のみ。放射時間と放射距離はどちらも表示事項です。住宅用消火器でない旨（業務用消火器）の表示も必要で、住宅用と業務用を区別させるための規定です。'},
{i:'O795',c:'kozo',q:'消火器本体の表示のうち、取扱い上の注意事項に含まれないものはどれか。',o:['消火器の型式番号','廃棄時の連絡先','維持管理上適切な設置場所に関する事項','安全上支障なく使用できる標準的な期間又は期限'],a:0,e:'型式番号は独立した表示事項であって、取扱い上の注意事項の中身ではありません。注意事項に含まれるのは、加圧用ガス容器に関する事項、指示圧力計に関する事項、使用期限、使用時の安全な取扱い、維持管理上適切な設置場所、点検に関する事項、廃棄時の連絡先などです。'},
{i:'O790',c:'kozo',q:'化学泡消火器のA剤とB剤について、正しいものはどれか。',o:['A剤は外筒の炭酸水素ナトリウム、B剤は内筒の硫酸アルミニウムで、薬剤の色に規定はない','A剤は褐色、B剤は白色と規定されている','A剤は内筒、B剤は外筒に入れる','A剤・B剤ともに炭酸水素ナトリウムである'],a:0,e:'外筒のA剤が炭酸水素ナトリウム（アルカリ性）、内筒のB剤が硫酸アルミニウム（酸性）です。「外がアルカリ、内が酸」。薬剤の色についての規定はありません。なお、りん酸塩類の粉末を淡紅色系に着色するといった色の規定は、粉末消火薬剤にはあります。'}
]},
