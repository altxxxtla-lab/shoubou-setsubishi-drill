<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>消防設備士 演習 ／ 甲4・乙6・甲1</title>
<style>
:root{
  --paper:#EFF1EE; --card:#FFFFFF; --ink:#19212A; --muted:#66727E;
  --rule:#D5DAD4; --rule-dark:#9AA5A0;
  --shu:#B7272D; --shu-soft:#FBEDED;
  --ok:#17654A; --ok-soft:#E9F3EE;
  --flag:#9A6B12; --flag-soft:#FAF2E0;
  --band:#20303F;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--paper); color:var(--ink);
  font-family:"Hiragino Kaku Gothic ProN","Yu Gothic Medium","Yu Gothic",Meiryo,system-ui,sans-serif;
  font-size:16px; line-height:1.75; font-variant-numeric:tabular-nums;
  -webkit-text-size-adjust:100%;
}
.wrap{max-width:820px;margin:0 auto;padding:0 18px 72px}
button{font-family:inherit;font-size:inherit;cursor:pointer}
button:focus-visible,select:focus-visible{outline:2px solid var(--band);outline-offset:2px}

/* ---- header ---- */
header{background:var(--band);color:#F0F3F1;padding:20px 0 0;margin-bottom:22px}
.hd{max-width:820px;margin:0 auto;padding:0 18px}
.hd h1{margin:0;font-size:19px;font-weight:700;letter-spacing:.06em}
.hd p{margin:4px 0 16px;font-size:13px;color:#9DB0BC}
.tabs{display:flex;gap:2px}
.tab{
  flex:1;background:#2B3E4F;color:#B9C7D1;border:0;border-radius:6px 6px 0 0;
  padding:10px 6px 11px;text-align:center;line-height:1.35;transition:background .12s;
}
.tab b{display:block;font-size:14px;font-weight:700}
.tab span{display:block;font-size:11px;opacity:.8}
.tab:hover{background:#354A5D}
.tab[aria-selected="true"]{background:var(--paper);color:var(--ink)}
.tab[aria-selected="true"] span{color:var(--muted);opacity:1}

/* ---- gauge (hero) ---- */
.gauge{background:var(--card);border:1px solid var(--rule);border-radius:10px;padding:18px 20px 14px;margin-bottom:18px}
.gauge h2{margin:0 0 2px;font-size:15px;font-weight:700}
.gauge .sub{margin:0 0 16px;font-size:12.5px;color:var(--muted)}
.grow{display:grid;grid-template-columns:112px 1fr 46px;gap:10px;align-items:center;margin-bottom:9px}
.glab{font-size:12.5px;line-height:1.4}
.gtrack{position:relative;height:19px;background:#EDEFEC;border-radius:3px;overflow:hidden}
.gfill{position:absolute;left:0;top:0;bottom:0;background:var(--rule-dark);transition:width .45s ease}
.gfill.low{background:var(--shu)} .gfill.mid{background:var(--flag)} .gfill.hi{background:var(--ok)}
.gtrack i{position:absolute;top:0;bottom:0;width:1px;background:var(--band);opacity:.45}
.gtrack i.l40{left:40%} .gtrack i.l60{left:60%;opacity:.85;width:2px}
.gnum{font-size:12.5px;text-align:right;color:var(--muted)}
.legend{margin-top:12px;padding-top:11px;border-top:1px solid var(--rule);font-size:11.5px;color:var(--muted)}

/* ---- panels ---- */
.panel{background:var(--card);border:1px solid var(--rule);border-radius:10px;padding:18px 20px;margin-bottom:18px}
.panel h2{margin:0 0 12px;font-size:15px;font-weight:700}
.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(168px,1fr));gap:9px}
.mode{background:#FBFCFB;border:1px solid var(--rule);border-radius:8px;padding:12px 13px;text-align:left;transition:border-color .12s,background .12s}
.mode:hover{border-color:var(--rule-dark);background:#fff}
.mode b{display:block;font-size:14px;font-weight:700;margin-bottom:2px}
.mode span{display:block;font-size:12px;color:var(--muted);line-height:1.5}
.mode:disabled{opacity:.42;cursor:default}
.catlist{border-top:1px solid var(--rule);margin-top:14px;padding-top:12px}
.catrow{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid #EDEFEC}
.catrow:last-child{border-bottom:0}
.catrow b{flex:1;font-size:13.5px;font-weight:500}
.catrow em{font-style:normal;font-size:12px;color:var(--muted);min-width:76px;text-align:right}
.mini{background:transparent;border:1px solid var(--rule-dark);border-radius:5px;padding:4px 12px;font-size:12.5px;color:var(--ink)}
.mini:hover{background:var(--band);border-color:var(--band);color:#fff}

/* ---- lessons ---- */
.lead{margin:-6px 0 14px;font-size:12.5px;color:var(--muted)}
.lsrow{display:flex;align-items:center;gap:11px;width:100%;background:#FBFCFB;border:1px solid var(--rule);border-radius:8px;padding:11px 13px;margin-bottom:7px;text-align:left;transition:border-color .12s,background .12s}
.lsrow:hover{border-color:var(--rule-dark);background:#fff}
.lsrow i{flex:none;width:24px;height:24px;border-radius:50%;border:1px solid var(--rule-dark);display:grid;place-items:center;font-size:11.5px;font-style:normal;color:var(--muted)}
.lsrow.done i{background:var(--ok);border-color:var(--ok);color:#fff}
.lsrow b{flex:1;font-size:14px;font-weight:500}
.lsrow em{font-style:normal;font-size:11.5px;color:var(--muted)}
.lsTitle{margin:0 0 18px;font-size:21px;font-weight:700;line-height:1.5}
#lsBody h3{margin:24px 0 8px;font-size:14.5px;font-weight:700;padding-left:11px;border-left:3px solid var(--band)}
#lsBody p{margin:0 0 12px;font-size:15px;line-height:1.95}
#lsBody table{width:100%;border-collapse:collapse;margin:6px 0 16px;font-size:13.5px}
#lsBody th{background:#EDEFEC;text-align:left;font-weight:700;padding:8px 10px;border:1px solid var(--rule);line-height:1.6}
#lsBody td{padding:8px 10px;border:1px solid var(--rule);line-height:1.7;vertical-align:top}
#lsBody tr:nth-child(even) td{background:#FAFBFA}
@media(max-width:560px){#lsBody table{font-size:12.5px} #lsBody th,#lsBody td{padding:6px 7px} .lsTitle{font-size:18px}}

/* ---- quiz ---- */
.qmeta{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:12px;font-size:12px;color:var(--muted)}
.qmeta .cat{background:var(--band);color:#fff;border-radius:4px;padding:2px 9px;font-size:11.5px}
.qmeta .cnt{margin-left:auto}
.qtext{font-size:17px;line-height:1.85;margin:0 0 16px;font-weight:500}
.qtext .note{display:block;font-size:14px;font-weight:400;color:var(--muted);margin-top:6px}
.choices{display:flex;flex-direction:column;gap:8px}
.ch{display:flex;gap:11px;align-items:flex-start;text-align:left;background:#FBFCFB;border:1px solid var(--rule);border-radius:8px;padding:12px 14px;line-height:1.7;transition:border-color .12s,background .12s}
.ch:hover:not(:disabled){border-color:var(--rule-dark);background:#fff}
.ch u{flex:none;text-decoration:none;width:23px;height:23px;border:1px solid var(--rule-dark);border-radius:50%;display:grid;place-items:center;font-size:12.5px;margin-top:1px}
.ch.pick-ok{border-color:var(--ok);background:var(--ok-soft)}
.ch.pick-ok u{background:var(--ok);border-color:var(--ok);color:#fff}
.ch.pick-ng{border-color:var(--shu);background:var(--shu-soft)}
.ch.pick-ng u{background:var(--shu);border-color:var(--shu);color:#fff}
.ch.reveal{border-color:var(--ok)}
.ch:disabled{cursor:default;opacity:1}
.ch.dim{opacity:.5}

.exp{margin-top:16px;border-top:2px solid var(--rule);padding-top:14px}
.verdict{font-size:14px;font-weight:700;margin:0 0 7px}
.verdict.ok{color:var(--ok)} .verdict.ng{color:var(--shu)}
.exp p{margin:0;font-size:14.5px;line-height:1.85}
.exp .ref{margin-top:9px;font-size:12.5px;color:var(--muted)}
.actions{display:flex;gap:9px;margin-top:18px;flex-wrap:wrap}
.primary{background:var(--band);color:#fff;border:1px solid var(--band);border-radius:7px;padding:10px 22px;font-size:14.5px;font-weight:700}
.primary:hover{background:#2C4155}
.ghost{background:transparent;border:1px solid var(--rule-dark);border-radius:7px;padding:10px 16px;font-size:13.5px;color:var(--ink)}
.ghost:hover{background:#EDEFEC}
.ghost.on{background:var(--flag-soft);border-color:var(--flag);color:var(--flag)}

/* ---- result ---- */
.score{text-align:center;padding:6px 0 18px}
.score b{display:block;font-size:52px;font-weight:700;line-height:1.1;letter-spacing:-.02em}
.score b small{font-size:22px;font-weight:500;color:var(--muted)}
.score p{margin:6px 0 0;font-size:14px;color:var(--muted)}
.judge{display:inline-block;margin-top:12px;border-radius:5px;padding:5px 16px;font-size:13.5px;font-weight:700}
.judge.pass{background:var(--ok-soft);color:var(--ok)}
.judge.fail{background:var(--shu-soft);color:var(--shu)}
.rlist{border-top:1px solid var(--rule);margin-top:6px}
.rrow{display:flex;gap:11px;padding:11px 0;border-bottom:1px solid #EDEFEC;font-size:13.5px;line-height:1.7}
.rrow span{flex:none;width:22px;font-weight:700}
.rrow span.o{color:var(--ok)} .rrow span.x{color:var(--shu)}
.foot{margin-top:26px;font-size:11.5px;color:var(--muted);line-height:1.8}
.foot button{background:none;border:0;color:var(--shu);text-decoration:underline;padding:0;font-size:11.5px}
.hide{display:none !important}
@media(max-width:560px){
  .wrap{padding:0 13px 60px} .hd{padding:0 13px}
  .grow{grid-template-columns:92px 1fr 42px}
  .qtext{font-size:16px} .score b{font-size:44px}
}
@media(prefers-reduced-motion:reduce){*{transition:none !important}}
</style>
</head>
<body>
<header>
  <div class="hd">
    <h1>消防設備士　演習</h1>
    <p>試験範囲に沿った書き下ろし問題集　／　解答は都度自分でテキスト照合を</p>
    <div class="tabs" role="tablist" id="tabs"></div>
  </div>
</header>

<div class="wrap">
  <!-- HOME -->
  <div id="home">
    <div class="panel" id="learnPanel">
      <h2>学ぶ</h2>
      <p class="lead">先に読んでから、その単元の問題を解きます。上から順に進めてください。</p>
      <div id="lessons"></div>
    </div>
    <div class="gauge">
      <h2 id="gTitle">科目別 到達度</h2>
      <p class="sub" id="gSub"></p>
      <div id="gRows"></div>
      <p class="legend">縦線は左が科目別足切り40％、右が合格ライン60％。全科目が40％を超え、かつ全体で60％以上が必要です。</p>
    </div>

    <div class="panel">
      <h2>演習を始める</h2>
      <div class="modes">
        <button class="mode" data-mode="random"><b>ランダム20問</b><span>全科目から出題</span></button>
        <button class="mode" data-mode="mock"><b>模擬試験</b><span id="mockDesc">本番と同じ科目配分</span></button>
        <button class="mode" data-mode="wrong" id="mWrong"><b>間違い直し</b><span id="wrongDesc">誤答した問題だけ</span></button>
        <button class="mode" data-mode="flag" id="mFlag"><b>チェック済み</b><span id="flagDesc">見直し印をつけた問題</span></button>
      </div>
      <div class="catlist" id="cats"></div>
    </div>
  </div>

  <!-- LESSON -->
  <div id="lesson" class="panel hide">
    <div class="qmeta"><span class="cat" id="lsNo"></span><span class="cnt" id="lsOf"></span></div>
    <h2 class="lsTitle" id="lsTitle"></h2>
    <div id="lsBody"></div>
    <div class="actions">
      <button class="primary" id="btnLsQuiz"></button>
      <button class="ghost" id="btnLsNext">次の単元</button>
      <button class="ghost" id="btnLsBack">一覧にもどる</button>
    </div>
  </div>

  <!-- QUIZ -->
  <div id="quiz" class="panel hide">
    <div class="qmeta">
      <span class="cat" id="qCat"></span>
      <span id="qId"></span>
      <span class="cnt" id="qCnt"></span>
    </div>
    <p class="qtext" id="qText"></p>
    <div class="choices" id="qChoices"></div>
    <div class="exp hide" id="qExp">
      <p class="verdict" id="qVerdict"></p>
      <p id="qExpText"></p>
      <p class="ref hide" id="qRef"></p>
    </div>
    <div class="actions">
      <button class="primary hide" id="btnNext">次の問題</button>
      <button class="ghost" id="btnFlag">見直し印</button>
      <button class="ghost" id="btnQuit">中断してもどる</button>
    </div>
  </div>

  <!-- RESULT -->
  <div id="result" class="panel hide">
    <div class="score">
      <b id="rScore"></b>
      <p id="rSub"></p>
      <div id="rJudge"></div>
    </div>
    <div class="rlist" id="rList"></div>
    <div class="actions">
      <button class="primary" id="btnHome">ホームにもどる</button>
      <button class="ghost hide" id="btnRetryWrong">誤答だけもう一度</button>
      <button class="ghost hide" id="btnLsCont">次の単元へ進む</button>
    </div>
  </div>

  <p class="foot" id="foot"></p>
</div>

<script>
const BANK = {
common: [
{i:'CM01',c:'kyo',q:'消防設備士免状の書換えを申請しなければならないのは、次のうちどれか。',o:['本籍地の都道府県が変わったとき','勤務先の会社が変わったとき','引っ越して住所が変わったとき','免状を亡失したとき'],a:0,e:'書換えが必要なのは、免状の記載事項（氏名・本籍地の都道府県・生年月日など）に変更が生じたときと、免状に貼ってある写真が撮影から10年を経過したときです。住所や勤務先は免状の記載事項ではないため、変わっても書換えは不要。亡失した場合は「書換え」ではなく「再交付」の手続きになります。'},
{i:'CM02',c:'kyo',q:'免状を亡失して再交付を受けた後、亡失した免状を発見した場合の措置として正しいものはどれか。',o:['発見した日から10日以内に、再交付を受けた都道府県知事に提出する','発見した日から14日以内に、居住地の消防長に提出する','発見した免状を破棄すればよく、届出は不要である','発見した日から30日以内に、総務大臣に返納する'],a:0,e:'亡失した免状を発見したときは、発見した日から10日以内に、再交付を受けた都道府県知事へ提出しなければなりません。「10日以内」「再交付を受けた知事」の2点がよく狙われます。'},
{i:'CM03',c:'kyo',q:'消防設備士が受けなければならない講習について、正しいものはどれか。',o:['免状の交付を受けた日から2年以内、その後は5年以内ごとに受講する','免状の交付を受けた日以後における最初の4月1日から2年以内、その後は講習を受けた日以後における最初の4月1日から5年以内ごとに受講する','3年以内ごとに繰り返し受講する','業務に従事していない期間は受講義務がない'],a:1,e:'起算日が「交付日」ではなく「交付日以後における最初の4月1日」である点が引っかけです。初回は2年以内、2回目以降は直前の講習日以後最初の4月1日から5年以内ごと。業務に従事していなくても、免状を持っている限り受講義務があります。'},
{i:'CM04',c:'kyo',q:'甲種消防設備士が工事に着手しようとする場合、着工届はいつ、誰に提出するか。',o:['着手しようとする日の7日前までに、都道府県知事','着手しようとする日の10日前までに、消防長または消防署長','工事完了後4日以内に、消防長または消防署長','着手した日から10日以内に、都道府県知事'],a:1,e:'着工届は「工事に着手しようとする日の10日前までに」「消防長または消防署長へ」、甲種消防設備士本人が届け出ます。工事完了後4日以内に届け出るのは、関係者が行う設置届（検査申請）で、こちらと混同させる問題が頻出です。'},
{i:'CM05',c:'kyo',q:'消防用設備等を設置したときの届出および検査について、正しいものはどれか。',o:['工事をした消防設備士が、完了後10日以内に届け出る','関係者が、工事完了後4日以内に消防長または消防署長に届け出て検査を受ける','関係者が、工事完了後14日以内に都道府県知事に届け出る','届出は必要だが、検査は任意である'],a:1,e:'設置届は「関係者（所有者・管理者・占有者）」が「工事が完了した日から4日以内」に消防長または消防署長へ届け出て、検査を受けます。届出義務者が消防設備士ではない点に注意。'},
{i:'CM06',c:'kyo',q:'消防用設備等の点検結果の報告期間について、正しい組合せはどれか。',o:['特定防火対象物は1年に1回、非特定防火対象物は3年に1回','特定防火対象物は6か月に1回、非特定防火対象物は1年に1回','用途にかかわらず1年に1回','特定防火対象物は1年に1回、非特定防火対象物は2年に1回'],a:0,e:'報告は特定防火対象物が1年に1回、非特定防火対象物が3年に1回です。これとは別に、点検そのものは機器点検が6か月ごと、総合点検が1年ごとに行います。「点検の周期」と「報告の周期」を混ぜた選択肢に注意してください。'},
{i:'CM07',c:'kyo',q:'次のうち、特定防火対象物に該当しないものはどれか。',o:['映画館','旅館','小学校','地下街'],a:2,e:'特定防火対象物は不特定多数が出入りする、または避難が困難な人が利用する用途で、劇場・映画館、キャバレー、飲食店、百貨店、旅館・ホテル、病院・福祉施設、地下街などが該当します。小学校（(7)項 学校）は在館者が特定されているため非特定防火対象物です。共同住宅((5)項ロ)や事務所((15)項)も非特定です。'},
{i:'CM08',c:'kyo',q:'消防用設備等の技術上の基準が改正された場合、既存の防火対象物には原則として改正前の基準が適用される（既存不遡及）が、次のうち常に改正後の基準に適合させなければならない設備はどれか。',o:['屋内消火栓設備','消火器','連結送水管','スプリンクラー設備'],a:1,e:'既存不遡及の例外として、消火器、避難器具、簡易消火用具、自動火災報知設備（特定防火対象物などに設けるもの）、ガス漏れ火災警報設備、漏電火災警報器、非常警報器具・設備、誘導灯・誘導標識は、常に改正後の基準に適合させる必要があります。また、防火対象物が特定防火対象物である場合は、設備の種類を問わず遡及適用されます。'},
{i:'CM09',c:'kyo',q:'消防用機械器具等の検定制度について、正しいものはどれか。',o:['型式承認は日本消防検定協会が行い、型式適合検定は総務大臣が行う','型式承認は総務大臣が行い、型式適合検定は日本消防検定協会等が行う','型式承認・型式適合検定とも都道府県知事が行う','型式適合検定に合格すれば、型式承認は不要である'],a:1,e:'型式承認は総務大臣が行う「形状等が技術上の規格に適合している」という承認、型式適合検定は日本消防検定協会または登録検定機関が行う「個々の製品が承認を受けた型式に適合するか」の検定です。両方に合格し、検定合格表示が付されていないものは販売・販売目的の陳列・工事への使用ができません。'},
{i:'CM10',c:'kyo',q:'次のうち、検定の対象となる消防用機械器具等に含まれないものはどれか。',o:['閉鎖型スプリンクラーヘッド','消火器用消火薬剤','漏電火災警報器','緩降機'],a:2,e:'検定対象品目は、消火器、消火器用消火薬剤、泡消火薬剤、感知器・発信機、中継器、受信機、住宅用防災警報器、閉鎖型スプリンクラーヘッド、流水検知装置、一斉開放弁、金属製避難はしご、緩降機の12品目です。漏電火災警報器は、かつての検定対象から自主表示対象機械器具等へ移されており、検定対象には含まれません。'},
{i:'CM11',c:'kyo',q:'消防用設備等の分類において、「消火活動上必要な施設」に該当しないものはどれか。',o:['連結送水管','非常コンセント設備','排煙設備','誘導灯'],a:3,e:'消防用設備等は「消防の用に供する設備（消火設備・警報設備・避難設備）」「消防用水」「消火活動上必要な施設」に分かれます。消火活動上必要な施設は、排煙設備、連結散水設備、連結送水管、非常コンセント設備、無線通信補助設備の5つ。誘導灯は避難設備です。'},
{i:'CM12',c:'kyo',q:'防火管理者の選任を要する防火対象物として、正しいものはどれか。',o:['特定防火対象物で収容人員30人以上、非特定防火対象物で収容人員50人以上','用途にかかわらず収容人員50人以上','特定防火対象物で収容人員50人以上、非特定防火対象物で収容人員30人以上','延べ面積300㎡以上のすべての防火対象物'],a:0,e:'防火管理者が必要なのは、特定防火対象物で収容人員30人以上、非特定防火対象物で収容人員50人以上（自力避難困難者入所施設は10人以上）です。なお甲種・乙種の区分は延べ面積で決まり、特定は300㎡以上、非特定は500㎡以上が甲種となります。'},
{i:'CM13',c:'kyo',q:'消防同意について、正しいものはどれか。',o:['建築主が消防長または消防署長に直接申請する','建築主事等が、建築確認をする前に消防長または消防署長の同意を得る','工事完了後に消防長の同意を得る','都道府県知事の同意を得る'],a:1,e:'消防同意は、建築主事や指定確認検査機関が建築確認をしようとするときに、その建築物の所在地を管轄する消防長または消防署長の同意を得る制度です。同意を求めるのは建築主ではなく建築主事等である点が問われます。'},
{i:'CM14',c:'kyo',q:'無窓階の定義として、正しいものはどれか。',o:['窓が全くない階','避難上または消火活動上有効な開口部を有しない階','地階のうち窓がない階','窓の面積が床面積の10分の1未満の階'],a:1,e:'無窓階とは、建築物の地上階のうち、避難上または消火活動上有効な開口部を有しない階をいいます。窓がゼロという意味ではなく、開口部の大きさ・位置・格子の有無などの要件を満たさない場合に無窓階となります。無窓階は設置基準が厳しくなるため、判定は重要です。'},
{i:'CM15',c:'kyo',q:'消防設備士でなければ行ってはならない工事または整備に該当するものはどれか。',o:['屋内消火栓設備の表示灯の交換','消火栓箱の補修','自動火災報知設備の感知器の交換','電源部分の工事'],a:2,e:'表示灯の交換、消火栓箱やホース・ノズルの補修など軽微な整備、および電源・水源・配管の部分の工事は、消防設備士でなくても行えます。感知器や受信機の交換など設備本体に関わる整備・工事は消防設備士の独占業務です。'},
{i:'CM16',c:'kyo',q:'消防設備士免状について、正しいものはどれか。',o:['交付を受けた都道府県内でのみ有効である','全国どこでも有効である','5年ごとに更新しなければ失効する','消防設備士でなくなったときは返納しなければならない'],a:1,e:'免状は交付した都道府県知事にかかわらず全国で有効です。有効期限による失効はなく、講習を受けなければならない義務はありますが、受講しなくても直ちに失効するのではなく、免状の返納命令の対象になり得るという扱いです。'},
{i:'CM17',c:'kyo',q:'消防長または消防署長が行う立入検査について、正しいものはどれか。',o:['個人の住居には、関係者の承諾があるか火災発生のおそれが著しく大であり特に緊急の必要がある場合でなければ立ち入れない','いかなる場合も個人の住居には立ち入れない','事前に必ず日時を通告しなければならない','立入検査は日出から日没までに限られる'],a:0,e:'立入検査は原則として時間の制限なく行えますが、個人の住居については関係者の承諾を得た場合か、火災発生のおそれが著しく大であって特に緊急の必要がある場合に限られます。事前通告の義務や日出から日没までという制限は、現行法では設けられていません。'},
{i:'CM18',c:'kyo',q:'防火対象物の関係者に対して、消防用設備等が技術上の基準に従って設置されていない場合に、その設置を命ずることができる者はどれか。',o:['都道府県知事','総務大臣','消防長または消防署長','建築主事'],a:2,e:'設置命令・維持命令は消防長または消防署長が、防火対象物の関係者で権原を有する者に対して行います。命令に違反した場合は罰則の対象となり、法人にも両罰規定が適用されます。'}
],
ko4: {

q:[
{i:'K401',c:'rui',q:'自動火災報知設備の警戒区域について、原則として正しいものはどれか。',o:['面積600㎡以下、一辺の長さ50m以下','面積500㎡以下、一辺の長さ50m以下','面積600㎡以下、一辺の長さ100m以下','面積1000㎡以下、一辺の長さ50m以下'],a:0,e:'警戒区域は原則、面積600㎡以下・一辺の長さ50m以下。ただし主要な出入口からその内部を見通すことができる場合は1000㎡以下とでき、光電式分離型感知器を設置する場合は一辺を100m以下とできます。'},
{i:'K402',c:'rui',q:'警戒区域が2以上の階にわたることが認められる場合として、正しいものはどれか。',o:['2の階にわたる部分の床面積の合計が500㎡以下のとき','2の階にわたる部分の床面積の合計が600㎡以下のとき','いかなる場合も認められない','階数が3以下のとき'],a:0,e:'警戒区域は原則として2以上の階にわたってはなりませんが、2の階にわたる部分の床面積の合計が500㎡以下の場合は認められます。また、階段・傾斜路・エレベーター昇降路などのたて穴区画は別に警戒区域を設定します。600㎡は1警戒区域の面積の上限であり、混同しやすい数値です。'},
{i:'K403',c:'rui',q:'次のうち、延べ面積にかかわらず自動火災報知設備を設置しなければならない防火対象物はどれか。',o:['飲食店','事務所','旅館・ホテル','小学校'],a:2,e:'(5)項イの旅館・ホテル・宿泊所は、延べ面積に関係なく全部に設置が必要です。ほかに(6)項イ(1)〜(3)の病院・診療所、(6)項ロの自力避難困難者入所施設、(2)項ニ（カラオケボックス等）、(13)項ロ（飛行機格納庫）、(17)項（重要文化財）などが面積無関係で必要となります。'},
{i:'K404',c:'rui',q:'地階・無窓階・3階以上の階で、床面積が何㎡以上のときに自動火災報知設備の設置が必要となるか（一般の場合）。',o:['100㎡以上','200㎡以上','300㎡以上','500㎡以上'],a:2,e:'地階、無窓階、3階以上の階は、床面積300㎡以上で設置が必要です。また11階以上の階はすべての階に必要で、駐車の用に供する部分で地階または2階以上にあり床面積200㎡以上の場合、通信機器室で床面積500㎡以上の場合も設置対象です。'},
{i:'K405',c:'rui',q:'地区音響装置の設置について、正しいものはどれか。',o:['各階の各部分から一の地区音響装置までの水平距離が25m以下','各階の各部分から一の地区音響装置までの歩行距離が25m以下','各階の各部分から一の地区音響装置までの水平距離が50m以下','各階の各部分から一の地区音響装置までの歩行距離が50m以下'],a:0,e:'地区音響装置は水平距離25m以下です。音圧は取付位置の中心から1m離れた位置で90dB以上（音声によるものは92dB以上）。一方、発信機は各階の各部分から一の発信機までの歩行距離50m以下で、「水平距離／歩行距離」「25m／50m」の組合せが頻出の引っかけです。'},
{i:'K406',c:'rui',q:'P型2級受信機（1回線用を除く）を設置できる防火対象物の延べ面積の上限はどれか。',o:['150㎡以下','350㎡以下','500㎡以下','制限はない'],a:2,e:'P型2級受信機は延べ面積500㎡以下、P型2級1回線用は350㎡以下、P型3級は150㎡以下の防火対象物に設置できます。P型1級には面積制限がありません。数値の並び（150／350／500）をセットで覚えるのが有効です。'},
{i:'K407',c:'rui',q:'自動火災報知設備の予備電源が満たすべき性能として、正しいものはどれか。',o:['監視状態を60分間継続した後、2回線を10分間作動させられること','監視状態を30分間継続した後、2回線を10分間作動させられること','監視状態を60分間継続した後、1回線を10分間作動させられること','監視状態を10分間継続した後、2回線を60分間作動させられること'],a:0,e:'予備電源は密閉型蓄電池とし、監視状態を60分間継続した後、2回線を10分間有効に作動させられる容量が必要です。また、常用電源が停電したときは自動的に予備電源に切り替わり、復旧時は自動的に常用電源に復帰する必要があります。'},
{i:'K408',c:'rui',q:'自動火災報知設備の非常電源として蓄電池設備によらなければならないのは、どのような防火対象物か。',o:['延べ面積1000㎡以上の特定防火対象物','延べ面積500㎡以上のすべての防火対象物','地階を有するすべての防火対象物','11階以上の階を有する防火対象物'],a:0,e:'延べ面積1000㎡以上の特定防火対象物では、非常電源は蓄電池設備によらなければなりません。それ以外は非常電源専用受電設備でも認められます。'},
{i:'K409',c:'kozo',q:'差動式スポット型感知器2種を、主要構造部を耐火構造とした取付面の高さ4m未満の場所に設ける場合、1個あたりの感知面積はいくらか。',o:['90㎡','70㎡','45㎡','35㎡'],a:1,e:'差動式スポット型は耐火構造・4m未満で1種が90㎡、2種が70㎡。4m以上8m未満になるとそれぞれ半分の45㎡、35㎡になります。耐火構造でない場合は1種50㎡・2種40㎡（4m未満）とさらに小さくなります。'},
{i:'K410',c:'kozo',q:'定温式スポット型感知器の公称作動温度について、正しいものはどれか。',o:['取付場所の最高周囲温度より20℃以上高いものを選ぶ','取付場所の最高周囲温度より10℃以上高いものを選ぶ','取付場所の平均温度と同じものを選ぶ','取付場所の最低周囲温度より20℃以上高いものを選ぶ'],a:0,e:'定温式スポット型は、正常時の熱で誤作動しないよう、取付場所の最高周囲温度より20℃以上高い公称作動温度のものを選定します。公称作動温度の範囲は60℃以上150℃以下で、60〜80℃までは5℃刻み、80℃を超えるものは10℃刻みです。'},
{i:'K411',c:'kozo',q:'煙感知器（1種・2種）を廊下および通路に設ける場合の設置間隔として、正しいものはどれか。',o:['歩行距離30mにつき1個以上','水平距離30mにつき1個以上','歩行距離20mにつき1個以上','水平距離15mにつき1個以上'],a:0,e:'廊下・通路には歩行距離30m（3種は20m）につき1個以上設けます。階段・傾斜路では垂直距離15m（3種は10m）につき1個以上。「廊下は歩行距離30m、階段は垂直距離15m」とセットで覚えると混乱しません。'},
{i:'K412',c:'kozo',q:'煙感知器を設置する際、換気口等の空気吹出し口から離すべき距離として正しいものはどれか。',o:['0.6m以上','1.0m以上','1.5m以上','3.0m以上'],a:2,e:'煙感知器は空気吹出し口から1.5m以上離して設けます。また感知器の下端は取付面の下方0.6m以内（熱感知器は0.3m以内）とし、吸気口がある場合はその付近に設けます。'},
{i:'K413',c:'kozo',q:'差動式スポット型感知器の取付けについて、正しいものはどれか。',o:['取付面に対して45度以上傾斜させて設ける','取付面に対して45度以上傾斜させないこと','傾斜角度に制限はない','垂直な壁面にのみ設ける'],a:1,e:'差動式スポット型・補償式スポット型・定温式スポット型は、45度以上傾斜させて設けてはなりません。傾斜させると空気室内の熱の伝わり方が変わり、性能が確保できないためです。'},
{i:'K414',c:'kozo',q:'感知器回路の共通線1本が受け持つことができる警戒区域の数の上限はどれか。',o:['5警戒区域','7警戒区域','10警戒区域','15警戒区域'],a:1,e:'共通線1本につき7警戒区域以下です。8警戒区域あれば共通線は2本必要になります。合わせて、P型1級受信機の感知器回路の電路の抵抗は50Ω以下という数値も頻出です。'},
{i:'K415',c:'kozo',q:'P型1級受信機の感知器回路を送り配線とし、末端に発信機や回路試験器等を設ける理由はどれか。',o:['断線の有無を確認する導通試験を行うため','絶縁抵抗を測定するため','受信機の予備電源を試験するため','地区音響装置の音圧を測定するため'],a:0,e:'感知器回路は送り配線とし、末端に発信機・押しボタン・回路試験器のいずれかを設けます。これにより受信機側から回路の導通試験ができ、断線を検出できます。分岐配線にすると断線箇所を検出できなくなるため認められません。'},
{i:'K416',c:'kozo',q:'自動火災報知設備の配線について、正しいものはどれか。',o:['60V以下の弱電流回線と同一の管に収めてよい','電源回路と同一の管に収めてよい','他の回線と同一の管に収めてはならないが、60V以下の弱電流回路は例外として同一の管に収めることができる','すべての回線を同一の管に収めなければならない'],a:2,e:'自動火災報知設備の配線は他の電線と同一の管・ダクト等に収めてはならないのが原則ですが、60V以下の弱電流回路に用いる電線は例外として同一の管に収めることができます。誘導障害を避けるための規定です。'},
{i:'K417',c:'kozo',q:'受信機の主音響装置の音圧として、正しいものはどれか（P型3級・GP型3級を除く）。',o:['取付面から1m離れた位置で70dB以上','取付面から1m離れた位置で85dB以上','取付面から1m離れた位置で90dB以上','取付面から3m離れた位置で85dB以上'],a:1,e:'受信機の主音響装置は1m離れた位置で85dB以上（P型3級・GP型3級の受信機は70dB以上）。地区音響装置の90dB以上と混同しやすいので、「主音響85／地区音響90／3級70」と整理しておきましょう。'},
{i:'K418',c:'kozo',q:'光電式分離型感知器の公称監視距離の範囲として、正しいものはどれか。',o:['5m以上100m以下（5m刻み）','1m以上50m以下','10m以上100m以下（10m刻み）','5m以上50m以下'],a:0,e:'光電式分離型感知器の公称監視距離は5m以上100m以下で、5m刻みです。設置時は送光部と受光部を背部の壁から1m以内、光軸は壁から0.6m以上離し、天井高の80％以上の高さに設けます。'},
{i:'K419',c:'kozo',q:'煙感知器を設置してはならない場所として、適当なものはどれか。',o:['ホテルの客室','事務所の廊下','厨房など煙が多量に滞留する場所','エレベーターの昇降路'],a:2,e:'厨房・浴室など水蒸気や煙が多量に滞留する場所、著しく高温となる場所、排気ガスが多量に滞留する場所などには煙感知器を設けません。厨房には定温式スポット型（防水型）が一般的です。エレベーター昇降路は逆に煙感知器を設ける代表的な場所です。'},
{i:'K420',c:'kozo',q:'差動式分布型感知器（空気管式）の空気管の露出部分の長さについて、正しいものはどれか。',o:['1感知区域ごとに20m以上','1感知区域ごとに10m以上','1感知区域ごとに5m以上','制限はない'],a:0,e:'空気管は1感知区域ごとに露出部分が20m以上必要で、1つの検出部に接続する空気管の長さは100m以下です。取付けは壁面から1.5m以内、相互間隔は6m以下（耐火構造は9m以下）とします。'},
{i:'K421',c:'kozo',q:'自動火災報知設備の絶縁抵抗試験において、対地電圧150V以下の電路で必要な絶縁抵抗値はどれか。',o:['0.1MΩ以上','0.2MΩ以上','0.4MΩ以上','1.0MΩ以上'],a:0,e:'電路と大地間および配線相互間の絶縁抵抗は、対地電圧150V以下で0.1MΩ以上、150Vを超え300V以下で0.2MΩ以上、300Vを超えるもので0.4MΩ以上です。測定には直流500Vの絶縁抵抗計を用います。'},
{i:'K422',c:'kozo',q:'受信機の火災表示試験で確認する内容として、適当でないものはどれか。',o:['地区表示装置が正しい警戒区域を表示すること','主音響装置および地区音響装置が鳴動すること','火災灯が点灯すること','感知器回路の断線の有無'],a:3,e:'火災表示試験は、火災表示試験スイッチと回線選択スイッチを操作し、火災灯・地区表示・音響装置の作動と自己保持機能を確認するものです。感知器回路の断線を調べるのは回路導通試験で、目的が異なります。'},
{i:'K423',c:'kozo',q:'発信機（P型1級）の設置高さとして、正しいものはどれか。',o:['床面から0.8m以上1.5m以下','床面から1.0m以上1.8m以下','床面から0.5m以上1.0m以下','床面から1.5m以上2.0m以下'],a:0,e:'発信機は床面から0.8m以上1.5m以下の高さに設けます。設置間隔は各階の各部分から一の発信機までの歩行距離50m以下。近くには赤色の表示灯を、取付面と15度以上の角度となる方向に沿って10m離れた位置から点灯が容易に識別できるように設けます。'},
{i:'K424',c:'kozo',q:'P型1級発信機とP型2級発信機の違いとして、正しいものはどれか。',o:['1級には電話ジャックと応答ランプがあるが、2級にはない','2級には電話ジャックがあるが、1級にはない','1級は押しボタン式、2級はレバー式である','1級は屋外用、2級は屋内用である'],a:0,e:'P型1級発信機には受信機との相互通話用の電話ジャックと、信号が受信機に伝わったことを知らせる応答ランプ（確認灯）があります。P型2級発信機にはこれらがありません。'},
{i:'K425',c:'kozo',q:'中継器の役割として、正しいものはどれか。',o:['感知器・発信機からの信号を受け、受信機や消火設備等へ発信するもの','火災を直接感知するもの','火災を音響により報知するもの','電源を供給するためだけのもの'],a:0,e:'中継器は、感知器または発信機から発せられた信号を受信し、これを受信機や消火設備等に発信するものです。電源を必要とするものと必要としないものがあり、電源を必要とするものは予備電源が必要（受信機から電源を供給されるものを除く）です。'},
{i:'K426',c:'kiso',q:'抵抗3Ω、4Ω、6Ωを並列に接続したときの合成抵抗はいくらか。',o:['1.33Ω','2.0Ω','4.33Ω','13Ω'],a:0,e:'並列合成抵抗は 1/R = 1/3 + 1/4 + 1/6 = 4/12 + 3/12 + 2/12 = 9/12。よって R = 12/9 ≒ 1.33Ω です。並列接続の合成抵抗は必ず最小の抵抗（この場合3Ω）より小さくなるので、それだけで選択肢を1つに絞れます。'},
{i:'K427',c:'kiso',q:'100Vの電源に、抵抗20Ωの負荷を接続したときの消費電力はいくらか。',o:['200W','500W','2000W','5000W'],a:1,e:'P = V²/R = 100² ÷ 20 = 10000 ÷ 20 = 500W。電流から求めるなら I = 100/20 = 5A、P = VI = 100×5 = 500W。どちらの式でも同じ結果になります。'},
{i:'K428',c:'kiso',q:'交流回路において、抵抗8Ω、誘導リアクタンス6Ωを直列接続したときのインピーダンスはいくらか。',o:['10Ω','14Ω','2Ω','48Ω'],a:0,e:'Z = √(R² + X²) = √(8² + 6²) = √(64+36) = √100 = 10Ω。3:4:5の直角三角形の比になっており、この組合せは出題頻度が高いので覚えておくと計算が速くなります。力率は cosθ = R/Z = 8/10 = 0.8 です。'},
{i:'K429',c:'kiso',q:'コンデンサ3μFと6μFを直列に接続したときの合成静電容量はいくらか。',o:['2μF','4.5μF','9μF','18μF'],a:0,e:'コンデンサの直列合成は抵抗の並列と同じ計算で、1/C = 1/3 + 1/6 = 3/6 なので C = 2μF。並列接続なら単純な和で9μFになります。抵抗と逆になる点が引っかけどころです。'},
{i:'K430',c:'kiso',q:'指示電気計器のうち、直流専用で交流の測定に使用できないものはどれか。',o:['可動コイル形','可動鉄片形','電流力計形','熱電形'],a:0,e:'可動コイル形は永久磁石を用いるため直流専用です。可動鉄片形は交流用（主に商用周波数）、電流力計形と熱電形は交直両用。可動コイル形は感度が高く目盛が均等という特徴があります。'},
{i:'K431',c:'kiso',q:'変圧器の一次側巻数1000回、二次側巻数100回、一次側電圧200Vのとき、二次側電圧はいくらか。',o:['10V','20V','2000V','2V'],a:1,e:'変圧比は巻数比に等しいので、V₂ = V₁ × (N₂/N₁) = 200 × (100/1000) = 20V。電流は逆比になり、二次側電流は一次側の10倍になります。'},
{i:'K432',c:'kiso',q:'導体の電気抵抗について、正しいものはどれか。',o:['断面積に比例し、長さに反比例する','長さに比例し、断面積に反比例する','長さにも断面積にも比例する','長さにも断面積にも反比例する'],a:1,e:'R = ρL/A で、長さLに比例し断面積Aに反比例します。ρは抵抗率で材料によって決まり、温度が上がると金属導体の抵抗は増加します。'},
{i:'K433',c:'kiso',q:'ホイートストンブリッジ回路が平衡している条件として、正しいものはどれか。',o:['対辺の抵抗の積が等しい','隣り合う抵抗の積が等しい','すべての抵抗が等しい','抵抗の和が等しい'],a:0,e:'向かい合う（対辺の）抵抗の積が等しいとき、検流計に電流が流れず平衡します。P·R = Q·X の関係から未知抵抗を精密に測定できます。'},
{i:'K434',c:'kiso',q:'三相誘導電動機の回転方向を逆にする方法として、正しいものはどれか。',o:['電源電圧を下げる','三相のうち任意の2線を入れ替える','周波数を変える','三相すべての線を入れ替える'],a:1,e:'三相のうち任意の2線を入れ替えると回転磁界の向きが反転し、逆回転します。3線すべてを入れ替えても相順は変わらないため回転方向は変わりません。'},
{i:'K435',c:'kan',q:'差動式スポット型感知器の作動原理として、正しいものはどれか。',o:['周囲の温度が一定の温度以上になったときに作動する','周囲の温度の上昇率が一定の率以上になったときに作動する','煙が一定の濃度以上になったときに作動する','炎から放射される紫外線を検知して作動する'],a:1,e:'差動式は「温度上昇率」に反応します。空気室の空気が膨張してダイヤフラムを押し上げ接点が閉じる仕組みで、リーク孔が緩やかな温度変化を逃がすことで誤作動を防いでいます。一定温度で作動するのが定温式、両方の性能を持つのが補償式です。'},
{i:'K436',c:'kan',q:'差動式スポット型感知器のリーク孔が詰まった場合に生じる現象はどれか。',o:['作動しにくくなる','非火災報（誤作動）が起きやすくなる','変化はない','断線警報が出る'],a:1,e:'リーク孔は暖房などによる緩やかな温度上昇時に空気を逃がす役割を持ちます。詰まると空気が逃げられず、火災でない温度変化でもダイヤフラムが押し上げられて誤作動（非火災報）を起こします。逆にリーク孔が大きすぎると、火災時でも空気が逃げてしまい作動が遅れます。'},
{i:'K437',c:'kan',q:'差動式分布型感知器（空気管式）の機能試験で、空気管の漏れやつまりを調べる試験はどれか。',o:['火災作動試験','作動継続試験','流通試験','接点水高試験'],a:2,e:'流通試験はテストポンプで空気を送り、マノメーターの水位の下がり方（流通時間）から空気管の漏れ・つまり・つぶれを判定します。接点水高試験は接点間隔の適否、火災作動試験は作動時間、作動継続試験は作動継続時間を確認する試験です。'},
{i:'K438',c:'kan',q:'加熱試験器（火災試験器）を用いて機能を確認する感知器はどれか。',o:['光電式スポット型感知器','定温式スポット型感知器','炎感知器','ガス漏れ検知器'],a:1,e:'定温式・差動式などの熱感知器には加熱試験器を使用します。煙感知器には加煙試験器、炎感知器には専用の作動試験器を用います。試験器の対応関係は鑑別でよく問われます。'},
{i:'K439',c:'kan',q:'受信機の回路導通試験で、断線が確認された場合に考えられる原因として適当でないものはどれか.',o:['感知器回路の配線が切断されている','終端抵抗が外れている','感知器の接触不良','地区音響装置のスピーカーが故障している'],a:3,e:'回路導通試験は感知器回路の電気的な導通を見るものなので、配線の断線・終端抵抗の脱落・端子の接触不良などが原因になります。地区音響装置の故障は導通試験の結果には現れません。'},
{i:'K440',c:'kan',q:'メガー（絶縁抵抗計）を用いて自動火災報知設備の絶縁抵抗を測定する際、使用する電圧はどれか。',o:['直流100V','直流250V','直流500V','交流100V'],a:2,e:'自動火災報知設備の絶縁抵抗測定には直流500Vの絶縁抵抗計を用います。測定前には必ず電源を切り、コンデンサが入っている回路では放電させてから測定します。'}
]},
otsu6: {
name:'乙種6類', sub:'消火器',
cats:{kyo:'消防関係法令（共通）',rui:'消防関係法令（6類）',kiso:'機械に関する基礎的知識',kozo:'構造・機能・整備',kan:'実技（鑑別）'},
mock:{kyo:6,rui:4,kiso:5,kozo:15,kan:5},

q:[
{i:'O601',c:'rui',q:'消火器を設置する場合、防火対象物の各部分から一の消火器までの歩行距離の上限はどれか。',o:['大型消火器は20m以下、その他は30m以下','大型消火器は30m以下、その他は20m以下','用途にかかわらず20m以下','用途にかかわらず30m以下'],a:1,e:'大型消火器は歩行距離30m以下、それ以外の消火器は20m以下です。「大型のほうが数が少なくてよい＝距離が長い」と理解すると取り違えません。なお水平距離ではなく歩行距離である点にも注意。'},
{i:'O602',c:'rui',q:'消火器の設置高さと標識について、正しいものはどれか。',o:['床面から1.5m以下の高さに設け、「消火器」と表示した標識を設ける','床面から1.0m以下の高さに設け、標識は不要である','床面から1.5m以上の高さに設ける','高さの制限はないが標識は必要である'],a:0,e:'消火器は床面からの高さ1.5m以下の位置に設け、見やすい箇所に「消火器」と表示した標識を設けます。標識は長辺24cm以上、短辺8cm以上で、地色は赤、文字は白です。'},
{i:'O603',c:'rui',q:'電気設備がある場所に消火器具を設ける場合の基準として、正しいものはどれか。',o:['床面積100㎡以下ごとに1個','床面積50㎡以下ごとに1個','床面積200㎡以下ごとに1個','床面積300㎡以下ごとに1個'],a:0,e:'変圧器や配電盤などの電気設備がある場所には、床面積100㎡以下ごとに1個、電気火災に適応する消火器を設けます。ボイラー室など多量の火気を使用する場所は床面積を25㎡で除した数以上の能力単位が必要です。'},
{i:'O604',c:'rui',q:'消火器具の能力単位の算定において、主要構造部が耐火構造であり、かつ内装が難燃材料で仕上げられている場合の扱いとして正しいものはどれか。',o:['算定基準面積を2倍にできる','算定基準面積を半分にする','能力単位を2倍にする','変わらない'],a:0,e:'主要構造部が耐火構造で、壁および天井の室内に面する部分の仕上げが難燃材料の場合、算定基準面積を2倍にできます。たとえば基準面積100㎡の用途なら200㎡で1単位となり、必要な能力単位が半分で済みます。'},
{i:'O605',c:'rui',q:'大型消火器の能力単位として、正しいものはどれか。',o:['A火災10単位以上またはB火災20単位以上','A火災20単位以上またはB火災10単位以上','A火災5単位以上またはB火災10単位以上','A火災10単位以上かつB火災20単位以上'],a:0,e:'大型消火器はA火災10単位以上またはB火災20単位以上のもので、「または」である点がポイント。薬剤量も規定があり、水80L以上、強化液60L以上、機械泡20L以上、化学泡80L以上、二酸化炭素50kg以上、粉末20kg以上です。'},
{i:'O606',c:'kozo',q:'蓄圧式消火器（二酸化炭素消火器等を除く）の指示圧力計の使用圧力範囲として、正しいものはどれか。',o:['0.5MPa以上0.8MPa以下','0.7MPa以上0.98MPa以下','0.9MPa以上1.2MPa以下','1.0MPa以上1.5MPa以下'],a:1,e:'蓄圧式消火器の使用圧力範囲は0.7〜0.98MPaで、指示圧力計の緑色の範囲がこれにあたります。二酸化炭素消火器およびハロン1301消火器は高圧ガス保安法の適用を受け、指示圧力計は設けません。'},
{i:'O607',c:'kozo',q:'化学泡消火器の外筒に入れる薬剤（A剤）と内筒に入れる薬剤（B剤）の組合せとして、正しいものはどれか。',o:['A剤＝硫酸アルミニウム、B剤＝炭酸水素ナトリウム','A剤＝炭酸水素ナトリウム、B剤＝硫酸アルミニウム','A剤＝りん酸アンモニウム、B剤＝炭酸水素ナトリウム','A剤＝炭酸水素ナトリウム、B剤＝りん酸アンモニウム'],a:1,e:'外筒のA剤が炭酸水素ナトリウム（重曹）、内筒のB剤が硫酸アルミニウムです。転倒させて両者を混合すると化学反応で二酸化炭素が発生し、その圧力で泡を放射します。反応式のイメージで「外＝アルカリ、内＝酸」と覚えると確実です。'},
{i:'O608',c:'kozo',q:'ABC粉末消火器の消火薬剤の主成分として、正しいものはどれか。',o:['炭酸水素ナトリウム','炭酸水素カリウム','りん酸アンモニウム','塩化ナトリウム'],a:2,e:'ABC粉末（りん酸塩類）はりん酸二水素アンモニウムが主成分で、色は淡紅色。BC粉末は炭酸水素ナトリウム（白色）または炭酸水素カリウム（紫色）で、普通火災には適応しません。'},
{i:'O609',c:'kozo',q:'二酸化炭素消火器が適応しない火災はどれか。',o:['普通火災（A火災）','油火災（B火災）','電気火災（C火災）','油火災と電気火災の両方'],a:0,e:'二酸化炭素消火器は窒息効果で消火するため、B火災（油）とC火災（電気）に適応しますが、A火災（普通火災）には適応しません。深部まで浸透しないためです。地下街や換気の悪い場所には設置できない点も重要です。'},
{i:'O610',c:'kozo',q:'安全栓の構造について、正しいものはどれか。',o:['内径2mm以上のリング部を有し、上方向に引き抜くよう装着されている','内径5mm以上のリング部を有し、下方向に引き抜く','リング部の大きさに規定はない','横方向に引き抜くよう装着されている'],a:0,e:'安全栓は内径2mm以上のリング部、軸部の太さ2mm以上で、上方向（軸部が上方向に引き抜かれるよう）に装着し、封が施されています。ただし手動ポンプ式水消火器や転倒式化学泡消火器など、動作により作動しないものには設けなくてよいとされています。'},
{i:'O611',c:'kozo',q:'消火器にホースを設けなくてよいものとして、正しいものはどれか。',o:['薬剤量が1kg以下の粉末消火器','薬剤量が3kg以下の粉末消火器','薬剤量が4kg以下の二酸化炭素消火器','すべての消火器にホースが必要である'],a:0,e:'ホースを設けなくてよいのは、消火薬剤量1kg以下の粉末消火器と、薬剤量4kg未満のハロゲン化物消火器です。二酸化炭素消火器はすべてホースが必要です。数値と対象を取り違えさせる選択肢が定番です。'},
{i:'O612',c:'kozo',q:'消火器の保持装置について、消火器の質量が何kgを超えると車載式としなければならないか。',o:['20kg','28kg','35kg','50kg'],a:1,e:'保持装置は、消火器の質量が28kg以下は手さげ式または据置式、28kgを超えるものは車載式とします。大型消火器の多くが車載式なのはこのためです。'},
{i:'O613',c:'kozo',q:'消火器の外面を赤色に塗装しなければならない面積の割合として、正しいものはどれか。',o:['表面積の25％以上','表面積の50％以上','表面積の75％以上','全面'],a:0,e:'消火器の外面は、その表面積の25％以上を赤色仕上げとします。ただし二酸化炭素消火器の容器は高圧ガス保安法により表面積の2分の1以上を緑色に、ハロン1301はねずみ色に塗装する必要があり、残りの部分で赤色25％以上を確保します。'},
{i:'O614',c:'kozo',q:'加圧式（ガス加圧式）粉末消火器の内部および機能の点検を開始する時期として、正しいものはどれか。',o:['製造年から1年を経過したもの','製造年から3年を経過したもの','製造年から5年を経過したもの','設置後1年を経過したもの'],a:1,e:'内部及び機能の点検は、加圧式（化学泡を除く）が製造年から3年経過後、蓄圧式が5年経過後から実施します。化学泡消火器は設置後1年経過ごとに全数実施します。「加圧3年／蓄圧5年／化学泡1年」と3点セットで覚えてください。'},
{i:'O615',c:'kozo',q:'蓄圧式消火器の内部及び機能の点検を抜取り方式で行う場合、確認ロットの全数を確認し終えるまでの年数として正しいものはどれか。',o:['3年','5年','10年','15年'],a:2,e:'抜取り方式では、加圧式は5年で、蓄圧式は10年で確認ロットの全数の確認が終わるように試料を抽出します。点検開始時期（加圧3年・蓄圧5年）とセットで問われます。'},
{i:'O616',c:'kozo',q:'消火器の耐圧性能に関する点検（水圧検査）の実施時期として、正しいものはどれか。',o:['製造年から10年を経過したもの、およびその後3年ごと','製造年から5年を経過したもの、およびその後3年ごと','製造年から10年を経過したもの、およびその後5年ごと','製造年から3年を経過したもの、およびその後3年ごと'],a:0,e:'耐圧性能点検は、製造年から10年を経過した消火器について実施し、以後は3年ごとに行います。所定の水圧を5分間かけて、漏れや変形がないかを確認します。'},
{i:'O617',c:'kozo',q:'使用済み表示装置を設けなくてよい消火器として、適当なものはどれか。',o:['ガス加圧式粉末消火器','蓄圧式強化液消火器','化学泡消火器','蓄圧式機械泡消火器'],a:2,e:'使用済み表示装置は、指示圧力計のある蓄圧式消火器、バルブを有しない消火器、および手動ポンプ式水消火器・化学泡消火器には設けなくてよいとされています。化学泡は転倒させれば使用したことが明らかなためです。'},
{i:'O618',c:'kozo',q:'粉末消火器の消火作用として、主たるものはどれか。',o:['冷却作用','窒息作用と抑制（負触媒）作用','希釈作用','乳化作用'],a:1,e:'粉末消火器は窒息作用と抑制（負触媒）作用が主体です。水・強化液は冷却作用、泡は窒息作用、二酸化炭素は窒息作用が主。強化液は霧状にすると抑制作用も加わり、電気火災にも適応します。'},
{i:'O619',c:'kozo',q:'強化液消火器の消火薬剤について、正しいものはどれか。',o:['炭酸カリウムの濃厚な水溶液で、アルカリ性を示す','硫酸アルミニウムの水溶液で、酸性を示す','りん酸アンモニウムの水溶液で、弱酸性を示す','中性の界面活性剤水溶液である'],a:0,e:'強化液は炭酸カリウムの濃厚水溶液で、pH約12のアルカリ性、凝固点が約−20℃と低いため寒冷地でも使えます。棒状放射では電気火災に適応しませんが、霧状放射なら適応します。'},
{i:'O620',c:'kozo',q:'消火器の分解時に、最初に行うべき作業として最も適当なものはどれか。',o:['キャップを緩める','指示圧力計を取り外す','排圧栓またはノズル等により内圧を完全に排出する','ホースを外す'],a:2,e:'蓄圧式や加圧式で内圧が残ったままキャップを緩めると、キャップや部品が飛び出して重大事故につながります。排圧栓のあるものは排圧栓を開き、ないものは容器を逆さにしてレバーを握るなどして完全に排圧してから分解します。'},
{i:'O621',c:'kozo',q:'加圧用ガス容器について、正しいものはどれか。',o:['内容積100cm³以下のものは高圧ガス保安法の適用を受けない','すべて高圧ガス保安法の適用を受ける','内容積500cm³以下のものは検査が不要である','窒素ガスは使用できない'],a:0,e:'内容積100cm³以下の加圧用ガス容器は高圧ガス保安法の適用を受けず、容器弁を設けないものが一般的です。100cm³を超えるものは容器弁付きで、高圧ガス保安法の適用を受けます。充てんガスは二酸化炭素または窒素ガスです。'},
{i:'O622',c:'kiso',q:'力（荷重）のうち、材料を引き伸ばそうとする力を何というか。',o:['圧縮荷重','引張荷重','せん断荷重','曲げ荷重'],a:1,e:'引張荷重は材料を引き伸ばす方向に働く力です。圧縮荷重は押し縮める力、せん断荷重は断面に沿ってずらす力、ねじり荷重は軸を回そうとする力。消火器の容器は内圧により引張応力を受けます。'},
{i:'O623',c:'kiso',q:'応力の単位として、正しいものはどれか。',o:['N','N/mm²','N·m','N/s'],a:1,e:'応力は単位面積あたりの力なのでN/mm²（＝MPa）で表します。Nは力、N·mはモーメントやエネルギー、N/sは力の変化率の単位です。'},
{i:'O624',c:'kiso',q:'金属材料の性質のうち、薄く広げることができる性質を何というか。',o:['展性','延性','靭性','脆性'],a:0,e:'展性は薄板状に広げられる性質、延性は線状に引き延ばせる性質です。靭性は粘り強さ、脆性は脆さを表します。'},
{i:'O625',c:'kiso',q:'ボイルの法則について、正しいものはどれか。',o:['温度一定のとき、気体の体積は圧力に比例する','温度一定のとき、気体の体積は圧力に反比例する','圧力一定のとき、気体の体積は絶対温度に反比例する','体積一定のとき、圧力は絶対温度に反比例する'],a:1,e:'ボイルの法則は、温度一定で体積と圧力が反比例（PV＝一定）。シャルルの法則は圧力一定で体積が絶対温度に比例します。消火器の内圧が温度によって変動するのは、これらの法則によるものです。'},
{i:'O626',c:'kiso',q:'ねじについて、右ねじを締める方向として正しいものはどれか。',o:['時計回り','反時計回り','ねじの種類によらず反時計回り','どちらでもよい'],a:0,e:'一般的な右ねじは時計回りで締まります。ただし消火器の加圧用ガス容器の容器弁など、誤操作防止のために左ねじが使われている箇所があるため、整備時は必ず確認が必要です。'},
{i:'O627',c:'kan',q:'消火器の内部及び機能の点検において、放射能力を確認する試料の割合として正しいものはどれか（抜取り方式の場合）。',o:['全数','抜き取った試料の10％以上','抜き取った試料の50％以上','抜き取った試料の20％以上'],a:1,e:'放射能力は、抜取り方式の場合は抜き取った消火器の10％以上について確認します。化学泡消火器は全数について放射能力を除く項目を確認します。'},
{i:'O628',c:'kan',q:'二酸化炭素消火器のホーン（ホーン握り）が設けられている理由として、正しいものはどれか。',o:['放射音を小さくするため','放射時の低温による凍傷を防ぐため','薬剤の飛散を防ぐため','ホーンの破損を防ぐため'],a:1,e:'二酸化炭素は放射時に断熱膨張して急激に温度が下がり、ホーンが著しく低温になります。凍傷防止のためホーン握りを設け、必ずそこを持って操作します。'},
{i:'O629',c:'kan',q:'消火器の指示圧力計が緑色範囲より下を指している場合、考えられる原因として最も適当なものはどれか。',o:['充てん圧力が過大である','薬剤または加圧ガスの漏れが生じている','周囲温度が高い','指示圧力計の目盛が細かすぎる'],a:1,e:'緑色範囲を下回るのは、パッキンの劣化やバルブからのガス漏れ、あるいは消火器を使用した後などが原因です。逆に緑色範囲より上を指す場合は充てん量過多や高温環境が疑われます。いずれも再充てんや部品交換が必要です。'},
{i:'O630',c:'kan',q:'化学泡消火器の薬剤を詰め替える際の注意事項として、適当でないものはどれか。',o:['A剤とB剤はそれぞれ別の容器で水に溶かしてから注入する','外筒液面表示まで確実に薬剤水溶液を入れる','A剤とB剤をあらかじめ混合してから注入する','薬剤は1年ごとに詰め替える'],a:2,e:'A剤とB剤を先に混ぜると反応が始まってしまい、消火器として機能しません。必ず別々に溶解し、外筒・内筒それぞれの液面表示まで注入します。化学泡は1年ごとの詰替えが必要です。'},
{i:'O631',c:'kan',q:'消火器の適応火災を示す絵表示のうち、B火災（油火災）を示す標識の地色はどれか。',o:['白色','黄色','青色','赤色'],a:1,e:'絵表示の地色は、A火災（普通火災）が白色、B火災（油火災）が黄色、C火災（電気火災）が青色です。文字表示ではなく絵表示で示すことが定められています。'},
{i:'O632',c:'kan',q:'開がい転倒式の化学泡消火器の使用方法として、正しいものはどれか。',o:['レバーを握ってから本体を転倒させる','押し金具を押し下げてから本体を転倒させる','本体を転倒させるだけでよい','安全栓を抜きレバーを握る'],a:1,e:'開がい転倒式は、押し金具を押して内筒のふたを開いてから本体を転倒させます。転倒式は転倒させるだけ、破がい転倒式は押し金具で内筒の封板を破ってから転倒させます。3方式の区別が鑑別で問われます。'},
{i:'O633',c:'kan',q:'消火器の廃棄・処分に関して、加圧用ガス容器を取り外した際の措置として最も適当なものはどれか。',o:['そのまま一般ごみとして廃棄する','内部のガスを完全に放出してから処分する','水中に投棄する','焼却処分する'],a:1,e:'加圧用ガス容器は高圧のガスが残っていると破裂の危険があるため、専用の器具でガスを完全に放出してから処分します。消火器本体は指定引取場所やリサイクル窓口を通じた回収が原則です。'},
{i:'O634',c:'kan',q:'消火器の外形点検で「変形・損傷・著しい腐食」が認められた容器の措置として、正しいものはどれか。',o:['そのまま継続使用してよい','耐圧性能に関する点検を行い、判断する','塗装し直して使用する','薬剤を詰め替えれば使用できる'],a:1,e:'変形・損傷・著しい腐食が認められた場合は、廃棄するか、耐圧性能に関する点検（水圧検査）を行って安全性を確認します。外観の補修だけで判断してはなりません。'}
]},

q:[
{i:'I101',c:'rui',q:'1号消火栓の設置について、防火対象物の階ごとに、その階の各部分から一のホース接続口までの水平距離の上限はどれか。',o:['15m以下','25m以下','40m以下','50m以下'],a:1,e:'1号消火栓と広範囲型2号消火栓は水平距離25m以下、2号消火栓は15m以下、屋外消火栓は40m以下です。歩行距離ではなく水平距離である点に注意してください。'},
{i:'I102',c:'rui',q:'1号消火栓のノズル先端における放水圧力および放水量として、正しいものはどれか。',o:['0.17MPa以上0.7MPa以下、130L/min以上','0.25MPa以上0.7MPa以下、60L/min以上','0.17MPa以上0.7MPa以下、60L/min以上','0.25MPa以上0.6MPa以下、350L/min以上'],a:0,e:'1号は0.17MPa以上0.7MPa以下で130L/min以上。2号は0.25MPa以上0.7MPa以下で60L/min以上、広範囲型2号は0.17MPa以上で80L/min以上、屋外消火栓は0.25MPa以上0.6MPa以下で350L/min以上です。'},
{i:'I103',c:'rui',q:'1号消火栓の水源水量の算定として、正しいものはどれか（設置個数が最も多い階の設置個数をNとする。ただしNが2を超えるときは2とする）。',o:['1.2m³×N','1.6m³×N','2.6m³×N','7m³×N'],a:2,e:'水源水量は1号が2.6m³×N、2号が1.2m³×N、広範囲型2号が1.6m³×N、屋外消火栓が7m³×Nです。いずれもNの上限は2（屋外消火栓も2）です。'},
{i:'I104',c:'rui',q:'屋内消火栓設備の開閉弁の設置高さとして、正しいものはどれか。',o:['床面からの高さ1.5m以下','床面からの高さ1.0m以下','床面からの高さ1.8m以下','高さの制限はない'],a:0,e:'屋内消火栓の開閉弁は床面から1.5m以下に設けます。屋外消火栓の開閉弁は地盤面から1.5m以下（地下に設ける場合は地盤面下0.6m以内）です。'},
{i:'I105',c:'rui',q:'屋内消火栓設備の表示灯について、正しいものはどれか。',o:['赤色で、取付面と15度以上の角度となる方向に沿って10m離れた位置から容易に識別できること','緑色で、5m離れた位置から識別できること','赤色で、取付面と30度以上の角度となる方向に沿って15m離れた位置から識別できること','色の指定はないが、常時点灯していること'],a:0,e:'表示灯は赤色で、取付面と15度以上の角度となる方向に沿って10m離れた位置から容易に識別できるものとします。この「15度・10m」の要件は発信機の表示灯と共通で、まとめて覚えられます。'},
{i:'I106',c:'rui',q:'屋内消火栓設備の非常電源として、有効に作動できる時間はどれか。',o:['10分間以上','20分間以上','30分間以上','60分間以上'],a:2,e:'非常電源は30分間以上有効に作動できる容量が必要です。延べ面積1000㎡以上の特定防火対象物では、非常電源専用受電設備ではなく自家発電設備・蓄電池設備・燃料電池設備によらなければなりません。'},
{i:'I107',c:'rui',q:'閉鎖型スプリンクラーヘッドの放水圧力および放水量として、正しいものはどれか。',o:['0.1MPa以上1MPa以下、80L/min以上','0.17MPa以上0.7MPa以下、130L/min以上','0.1MPa以上0.7MPa以下、60L/min以上','0.25MPa以上1MPa以下、80L/min以上'],a:0,e:'スプリンクラーヘッドは放水圧力0.1MPa以上1MPa以下、放水量80L/min以上です。屋内消火栓の数値と混同しやすいので区別しておきましょう。'},
{i:'I108',c:'kozo',q:'閉鎖型スプリンクラーヘッド（標準型・高感度型を除く）を耐火建築物に設ける場合の、各部分からヘッドまでの水平距離の上限はどれか。',o:['1.7m以下','2.1m以下','2.3m以下','2.6m以下'],a:2,e:'耐火建築物は2.3m以下、耐火建築物以外は2.1m以下、高感度型ヘッドは2.6m以下です。ラック式倉庫や地下街の一部など、用途によってさらに厳しい基準が定められています。'},
{i:'I109',c:'kozo',q:'閉鎖型スプリンクラーヘッドの標示温度の選定について、取付場所の最高周囲温度が39℃以上64℃未満の場合、選定すべき標示温度はどれか。',o:['79℃未満','79℃以上121℃未満','121℃以上162℃未満','162℃以上'],a:1,e:'最高周囲温度が39℃未満なら標示温度79℃未満、39℃以上64℃未満なら79℃以上121℃未満、64℃以上106℃未満なら121℃以上162℃未満、106℃以上なら162℃以上を選びます。ヘッドの色別表示（無色・白・青・赤・緑・橙）と併せて押さえてください。'},
{i:'I110',c:'kozo',q:'湿式流水検知装置を用いるスプリンクラー設備の末端試験弁について、正しいものはどれか。',o:['二次側に圧力計、一次側に試験用放水口を設ける','一次側に圧力計、二次側に開放型ヘッドと同等の放水性能を有するオリフィス等の試験用放水口を設ける','圧力計は不要である','各階の最も送水口に近い位置に設ける'],a:1,e:'末端試験弁は流水検知装置の作動、圧力の状況、警報の発報を確認するためのもので、一次側に圧力計、二次側に開放型ヘッドと同等の放水性能を持つオリフィス等の試験用放水口を設けます。設置位置は放水圧力が最も低くなると予想される配管の部分で、階ごとに設けます。'},
{i:'I111',c:'kozo',q:'加圧送水装置に用いるポンプの性能として、正しいものはどれか。',o:['締切全揚程は定格全揚程の140％以下、定格吐出量の150％で運転したときの全揚程は定格全揚程の65％以上','締切全揚程は定格全揚程の110％以下、定格吐出量の150％で全揚程の80％以上','締切全揚程は定格全揚程の140％以上、定格吐出量の150％で全揚程の65％以下','締切全揚程は定格全揚程の65％以下'],a:0,e:'締切運転時の全揚程が定格全揚程の140％を超えないこと、定格吐出量の150％で運転したときの全揚程が定格全揚程の65％以上であることが必要です。これを確認するのが性能試験装置（性能試験配管）の役割です。'},
{i:'I112',c:'kozo',q:'ポンプに設ける呼水槽の有効水量として、原則正しいものはどれか。',o:['50L以上','100L以上','200L以上','500L以上'],a:1,e:'呼水槽は有効水量100L以上（フート弁の呼び径が150mm以下の場合など条件により50L以上とできる場合があります）で、減水警報装置と補給水管を設けます。水源の水位がポンプより高い位置にある場合は呼水装置そのものが不要です。'},
{i:'I113',c:'kozo',q:'加圧送水装置に設ける「逃し配管」の目的として、正しいものはどれか。',o:['ポンプの締切運転時の水温上昇を防止するため','配管内の空気を抜くため','水源の水位を一定に保つため','放水圧力を高めるため'],a:0,e:'締切運転が続くとポンプ内の水が撹拌されて温度が上昇し、機器を損傷します。これを防ぐため、ポンプ吐出側の逆止弁の一次側から水源へ少量の水を常時逃がす配管（逃し配管）を設けます。'},
{i:'I114',c:'kozo',q:'起動用水圧開閉装置に設ける圧力タンクの容積として、正しいものはどれか。',o:['50L以上','100L以上','150L以上','200L以上'],a:1,e:'起動用水圧開閉装置の圧力タンクは容積100L以上です。消火栓の開閉弁を開くと配管内の圧力が低下し、圧力スイッチが動作してポンプが自動起動する仕組みです。呼水槽の100L以上と数値が同じなので、混同せず両方覚えておきましょう。'},
{i:'I115',c:'kozo',q:'屋内消火栓設備の加圧送水装置におけるポンプの吐出量として、1号消火栓の場合に正しいものはどれか（設置個数が最も多い階の個数をNとし、Nが2を超えるときは2とする）。',o:['70L/min×N','90L/min×N','150L/min×N','400L/min×N'],a:2,e:'ポンプ吐出量は1号が150L/min×N、2号が70L/min×N、広範囲型2号が90L/min×N、屋外消火栓が400L/min×Nです。ノズル放水量（130／60／80／350）より大きい値になっている点に注目すると覚えやすくなります。'},
{i:'I116',c:'kozo',q:'1号消火栓の加圧送水装置の全揚程Hを求める式として、正しいものはどれか。',o:['H＝h1＋h2＋h3＋17m','H＝h1＋h2＋h3＋25m','H＝h1＋h2＋h3＋10m','H＝h1＋h2＋h3'],a:0,e:'H＝消防用ホースの摩擦損失水頭h1＋配管の摩擦損失水頭h2＋落差h3＋ノズル放水圧力換算水頭。この換算水頭が1号消火栓は17m、2号消火栓と屋外消火栓は25m、スプリンクラー設備は10mです。放水圧力0.17MPa≒17mという対応関係で理解できます。'},
{i:'I117',c:'kozo',q:'閉鎖型スプリンクラー設備のうち、二次側配管を圧縮空気等で満たしておく方式はどれか。',o:['湿式','乾式','開放型','放水型'],a:1,e:'乾式は二次側配管を圧縮空気で満たしており、凍結のおそれのある寒冷地に用います。予作動式は二次側を空気で満たし、感知器の作動と ヘッドの開放の両方が成立して初めて放水するため、誤放水を嫌う電算室などに適します。'},
{i:'I118',c:'kozo',q:'一斉開放弁が用いられるスプリンクラー設備はどれか。',o:['湿式','乾式','開放型','予作動式'],a:2,e:'開放型ヘッドを用いる設備では、感知用ヘッドや火災感知器の作動により一斉開放弁が開き、その放水区域のヘッドから一斉に放水します。舞台部など天井が高く火災の拡大が速い場所に用いられます。'},
{i:'I119',c:'kozo',q:'スプリンクラー設備の補助散水栓について、各部分からホース接続口までの水平距離の上限はどれか。',o:['10m以下','15m以下','25m以下','40m以下'],a:1,e:'補助散水栓は水平距離15m以下です。スプリンクラーヘッドの設置が免除される部分（トイレ・浴室など）をカバーするために設けるもので、2号消火栓と同等の性能を持ちます。'},
{i:'I120',c:'kozo',q:'スプリンクラー設備の送水口の形式として、原則正しいものはどれか。',o:['単口形','双口形','形式の指定はない','三口形'],a:1,e:'スプリンクラー設備の送水口は双口形とし、地盤面からの高さ0.5m以上1m以下の位置に設けます。消防隊が送水する際の接続口で、屋内消火栓設備には設けません。'},
{i:'I121',c:'kozo',q:'消防用配管に用いる管について、適当でないものはどれか。',o:['配管用炭素鋼鋼管（SGP）','圧力配管用炭素鋼鋼管（STPG）','ステンレス鋼鋼管','鉛管'],a:3,e:'消防用設備等の配管には、配管用炭素鋼鋼管、圧力配管用炭素鋼鋼管、ステンレス鋼鋼管、銅合金管、および所定の合成樹脂管などが使用できます。鉛管は強度・耐熱性の面から用いられません。'},
{i:'I122',c:'kozo',q:'配管の摩擦損失について、正しいものはどれか。',o:['管径が大きいほど大きくなる','流速が大きいほど大きくなる','管の長さが短いほど大きくなる','流量に関係しない'],a:1,e:'摩擦損失は流速の2乗にほぼ比例し、管の長さに比例、管径に反比例します。したがって流速を下げる（管径を大きくする）ほど損失は小さくなります。'},
{i:'I123',c:'kiso',q:'水頭1mに相当する圧力はおよそいくらか。',o:['約0.0098MPa','約0.098MPa','約0.98MPa','約9.8MPa'],a:0,e:'水1mの水頭は約0.0098MPa（≒0.01MPa）です。したがって0.17MPaは約17m、0.1MPaは約10mに相当し、加圧送水装置の全揚程計算で用いる換算水頭の根拠になります。'},
{i:'I124',c:'kiso',q:'パスカルの原理について、正しいものはどれか。',o:['密閉容器内の静止流体の一部に加えた圧力は、流体のすべての部分に同じ大きさで伝わる','流体の速度が増すと圧力が増す','流体の粘度は温度に比例する','浮力は物体の体積に反比例する'],a:0,e:'パスカルの原理は水圧機や油圧ジャッキの原理です。速度が増すと圧力が下がるのはベルヌーイの定理、浮力が押しのけた流体の重さに等しいのはアルキメデスの原理です。'},
{i:'I125',c:'kiso',q:'ポンプの吸込側で圧力が飽和蒸気圧以下になり、気泡が発生・消滅して振動や壊食を起こす現象を何というか。',o:['ウォーターハンマー','キャビテーション','サージング','スケーリング'],a:1,e:'キャビテーションは吸込揚程が大きすぎる、吸込配管の抵抗が大きい、水温が高いなどの条件で発生します。ウォーターハンマーは弁の急閉による水撃、サージングは流量と圧力が周期的に変動する現象です。'},
{i:'I126',c:'kiso',q:'ベルヌーイの定理において、一定に保たれるものの組合せとして正しいものはどれか。',o:['位置水頭＋圧力水頭＋速度水頭','圧力＋温度','流量＋粘度','密度＋体積'],a:0,e:'理想流体では位置水頭・圧力水頭・速度水頭の和（全水頭）が一定に保たれます。管が細くなって流速が増すと圧力水頭が下がるのはこのためです。'},
{i:'I127',c:'kiso',q:'金属材料に力を加えて変形させたあと、力を取り去っても元に戻らない変形を何というか。',o:['弾性変形','塑性変形','熱変形','弾性限度'],a:1,e:'力を取り去れば元に戻るのが弾性変形、戻らないのが塑性変形です。その境界となる応力を弾性限度といい、これを超えると永久ひずみが残ります。'},
{i:'I128',c:'kiso',q:'ステンレス鋼の主な合金元素として、正しいものはどれか。',o:['クロムとニッケル','銅と亜鉛','鉛とすず','アルミニウムとマグネシウム'],a:0,e:'ステンレス鋼はクロムを含む合金鋼で、クロムが表面に不動態皮膜を作ることで耐食性を発揮します。オーステナイト系（SUS304など）はニッケルも加えられています。銅と亜鉛の合金は黄銅（真ちゅう）です。'},
{i:'I129',c:'kiso',q:'管継手のうち、配管の方向を90度変えるために用いるものはどれか。',o:['ソケット','エルボ','ティー','ニップル'],a:1,e:'エルボは方向転換、ソケットとニップルは直線接続、ティーは分岐に用います。径の異なる管をつなぐにはレデューサ（径違いソケット）を使います。'},
{i:'I130',c:'kan',q:'流水検知装置の作動を確認する試験を行う場合、操作する弁として正しいものはどれか。',o:['末端試験弁','制御弁','送水口の弁','逃し弁'],a:0,e:'末端試験弁を開いて放水し、流水検知装置の作動・警報の発報・圧力計の指示を確認します。制御弁は放水区域への送水を止める弁で、点検後の閉め忘れが重大事故につながるため、点検では開放状態への復旧確認が必須です。'},
{i:'I131',c:'kan',q:'屋内消火栓設備の総合点検で行う放水試験において、ノズル先端の放水圧力を測定する器具はどれか。',o:['ピトーゲージ','マノメーター','絶縁抵抗計','スケール'],a:0,e:'ピトーゲージ（ピトー管付圧力計）をノズル先端から放水口径の2分の1程度離した位置に、放水軸に直角に当てて測定します。放水量は Q＝0.653×D²×√P の式で算出します。'},
{i:'I132',c:'kan',q:'放水量を求める式 Q＝0.653×D²×√P において、Dが表すものはどれか。',o:['ノズルの口径（mm）','配管の内径（mm）','ホースの長さ（m）','水源の深さ（m）'],a:0,e:'Dはノズル口径（mm）、Pは放水圧力（MPa）、Qは放水量（L/min）です。口径の2乗に比例するため、ノズル径の違いが放水量に大きく効きます。'},
{i:'I133',c:'kan',q:'ポンプの吸込側に設けるフート弁の役割として、正しいものはどれか。',o:['水の逆流を防ぎ、吸込管内を満水に保つ','配管内の空気を抜く','ポンプの締切運転を防止する','放水圧力を調整する'],a:0,e:'フート弁は逆止弁とストレーナを兼ねた弁で、水源の水位がポンプより低い場合に吸込管内の水が落ちるのを防ぎます。あわせて呼水装置が必要になります。'},
{i:'I134',c:'kan',q:'消防用ホースの点検において、確認すべき事項として適当でないものはどれか。',o:['ホースの著しい摩耗・損傷の有無','結合金具の変形・損傷の有無','ホースの製造年月と耐圧性能点検の実施状況','ホースの色が赤色であること'],a:3,e:'ホースの色は規定されていません。点検では摩耗・損傷・カビ・結合金具の状態を確認し、製造から10年を経過したホースは3年ごとに耐圧性能点検（水圧試験）を行います。'}
]},
};

        ['化学泡 A剤（外筒）','炭酸水素ナトリウム','—'],
        ['化学泡 B剤（内筒）','硫酸アルミニウム','—']]},
  {p:'化学泡は「外がアルカリ、内が酸」と覚えます。転倒させて混ざると反応して二酸化炭素が発生し、その圧力で泡を押し出します。'}
 ], q:['O607','O608','O609','O619','O618']},

{id:'L603', t:'加圧方式の3種類と、内部構造',
 b:[
  {p:'消火薬剤を押し出す力をどこから得るか、で3方式に分かれます。整備と点検の話はすべてここに紐づくので、構造をイメージできるようにしておきます。'},
  {h:'蓄圧式'},
  {p:'容器の中に薬剤と一緒に窒素ガスをあらかじめ充てんしておき、常に圧力がかかっている方式です。レバーを握るとバルブが開いて出ます。常時圧力がかかっているため、圧力が正常かを外から見る必要があり、指示圧力計が付いています。使用圧力範囲は0.7〜0.98MPa（緑色の範囲）。'},
  {p:'ただし二酸化炭素消火器とハロン1301は例外で、指示圧力計を付けません。これらは高圧ガス保安法の適用を受け、圧力が非常に高いためです。代わりに総質量を量って薬剤量を確認します。'},
  {h:'加圧式（ガス加圧式）'},
  {p:'容器の中に小さな加圧用ガス容器（ボンベ）が入っていて、レバーを握るとカッターがその封板を破り、ガスが噴き出して薬剤を押し出します。使用前は容器内に圧力がかかっていないので、指示圧力計はありません。'},
  {p:'加圧用ガス容器は内容積100cm³以下なら高圧ガス保安法の適用を受けず、容器弁のないものが使われます。100cm³を超えると容器弁付きになり、同法の適用を受けます。'},
  {h:'反応式（化学泡）'},
  {p:'外筒のA剤と内筒のB剤を混合させ、化学反応で発生する二酸化炭素の圧力で放射します。押し出すためのガスを別に持たないのが特徴です。'},
  {tbl:[['方式','押し出す力','指示圧力計','代表例'],
        ['蓄圧式','あらかじめ充てんした窒素','あり（CO₂・ハロン除く）','粉末、強化液、機械泡'],
        ['加圧式','内蔵ボンベのガス','なし','粉末（業務用に多い）'],
        ['反応式','化学反応で発生するCO₂','なし','化学泡']]},
  {h:'分解するときの鉄則'},
  {p:'内圧が残ったままキャップを緩めると、キャップや内部部品が高圧で飛び出します。実際に死亡事故が起きています。排圧栓があるものは排圧栓を開き、ないものは容器を逆さにしてレバーを握るなどして、必ず完全に圧を抜いてから分解します。試験でも実務でも最重要事項です。'}
 ], q:['O606','O620','O621']},

{id:'L604', t:'能力単位と、必要な消火器の本数',
 b:[
  {p:'乙6で唯一の計算らしい計算です。毎回出ます。考え方は「その建物には消火能力がいくつ必要か」を面積から出し、それを満たすように本数を決める、という2段構えです。'},
  {h:'基本の式'},
  {p:'必要能力単位 ＝ 延べ面積 ÷ 算定基準面積'},
  {h:'算定基準面積は用途の危険度で3段階'},
  {tbl:[['基準面積','用途の例','考え方'],
        ['50㎡','劇場、映画館、キャバレー、地下街','不特定多数・避難困難'],
        ['100㎡','飲食店、百貨店、旅館、病院、共同住宅、工場','中間'],
        ['200㎡','学校、図書館、神社仏閣、事務所','在館者が特定・出火リスク低']]},
  {p:'危険なところほど基準面積が小さく、必要な単位数が多くなります。理屈は素直です。'},
  {h:'内装制限による2倍緩和'},
  {p:'主要構造部が耐火構造で、かつ壁と天井の室内に面する部分の仕上げが難燃材料なら、算定基準面積を2倍にできます。燃え広がりにくい建物なので消火器は半分で済む、という発想です。'},
  {h:'計算例'},
  {p:'延べ面積1,200㎡の飲食店（耐火構造・難燃内装）の場合。基準面積100㎡が2倍で200㎡になるので、1,200 ÷ 200 ＝ 6単位。ABC粉末10型がA-3程度なので、6 ÷ 3 ＝ 2本という流れで本数が決まります。'},
  {h:'付加設置（本体の算定とは別枠）'},
  {tbl:[['場所','必要なもの'],
        ['電気設備がある場所','床面積100㎡以下ごとに1個（電気火災適応のもの）'],
        ['多量の火気を使用する場所','床面積 ÷ 25 の能力単位'],
        ['少量危険物','貯蔵量 ÷ 指定数量 の能力単位'],
        ['指定可燃物','貯蔵量 ÷（危険物政令別表の数量×50）の能力単位']]},
  {p:'付加設置は本体の算定に足し算します。「合計で計算する」のではなく「別に上乗せする」点が引っかけどころです。なお電気設備の場合だけ「能力単位」ではなく「個数」で数える点にも注意してください。'},
  {h:'大型消火器の基準'},
  {p:'A火災10単位以上、またはB火災20単位以上のものが大型消火器です。「または」であって「かつ」ではありません。薬剤量にも規定があり、水80L、強化液60L、機械泡20L、化学泡80L、二酸化炭素50kg、粉末20kg以上です。'}
 ], q:['O603','O604','O605']},

{id:'L605', t:'設置の基準',
 b:[
  {p:'本数が決まったら、次はどこに置くかです。数値が3つ出てきますが、いずれも「いざというとき手が届くか」という発想から出ています。'},
  {tbl:[['項目','基準'],
        ['歩行距離（一般の消火器）','各部分から一の消火器まで20m以下'],
        ['歩行距離（大型消火器）','各部分から一の消火器まで30m以下'],
        ['設置高さ','床面から1.5m以下'],
        ['標識','「消火器」と表示。地色は赤、文字は白、長辺24cm以上×短辺8cm以上']]},
  {h:'よくある取り違え'},
  {p:'第一に、水平距離ではなく歩行距離です。壁を突き抜けた直線距離ではなく、実際に歩く経路の長さで測ります。屋内消火栓が水平距離25mなのと対照的で、ここを入れ替えた選択肢が定番です。'},
  {p:'第二に、大型のほうが距離が長い（30m）ことです。大型は数を減らせるぶん、遠くまでカバーしてよいと考えれば取り違えません。'},
  {p:'第三に、高さは「1.5m以下」で、上限だけが決まっています。下限はないので床置きでも構いません。'},
  {h:'設置してはならない場所'},
  {p:'二酸化炭素消火器とハロゲン化物消火器は、地下街、準地下街、換気について有効な開口部のない地階・無窓階・居室には設置できません。窒息作用で消すため、人がいる密閉空間で放射すると酸欠を起こすからです。'}
 ], q:['O601','O602','O609']},

{id:'L606', t:'点検の周期と、抜取り方式',
 b:[
  {p:'現場で最も使う知識であり、試験でも数値がそのまま問われます。3つの点検を区別してください。'},
  {h:'1. 外形点検'},
  {p:'6か月ごとの機器点検で、設置されているすべての消火器について外観を目視で確認します。変形・損傷・腐食、指示圧力計の指示値、安全栓の封、標識の有無などを見ます。'},
  {h:'2. 内部及び機能の点検'},
  {p:'消火器を分解して中を確認します。開始時期が消火器の種類で分かれます。'},
  {tbl:[['種類','開始時期','抜取りで全数を確認し終える年数'],
        ['加圧式（化学泡を除く）','製造年から3年経過','5年'],
        ['蓄圧式','製造年から5年経過','10年'],
        ['化学泡','設置後1年経過ごと（全数）','—']]},
  {p:'「加圧3年・蓄圧5年・化学泡1年」を3点セットで覚えます。加圧式が早いのは、内蔵ボンベや粉末の固化など、内部で起きる不具合が多いためです。'},
  {h:'抜取り方式の考え方'},
  {p:'対象が多数あるとき、同一メーカー・同一種類・同一製造年でロットを組み、その中から試料を抜き取って点検します。加圧式は5年、蓄圧式は10年でロット全数の確認が終わるように試料数を決めます。放射能力は抜き取った消火器の10％以上について確認します。'},
  {h:'3. 耐圧性能に関する点検（水圧検査）'},
  {p:'製造年から10年を経過した消火器について実施し、以後は3年ごとに行います。所定の水圧を5分間かけ、漏れや変形がないかを確認します。ホースも同様に、製造から10年経過後は3年ごとです。'},
  {h:'報告の周期（法令共通と重なる部分）'},
  {p:'点検そのものは機器点検6か月・総合点検1年ですが、消防機関への報告は特定防火対象物が1年に1回、非特定防火対象物が3年に1回です。「点検の周期」と「報告の周期」を混ぜた選択肢が頻出します。'}
 ], q:['O614','O615','O616','O627','O634']},

{id:'L607', t:'部品の規格',
 b:[
  {p:'規格省令からの出題です。数値が細かいですが、出るところは限られています。'},
  {h:'安全栓'},
  {p:'内径2mm以上のリング部、軸部の太さ2mm以上。上方向に引き抜くよう装着し、封が施されています。ただし手動ポンプ式水消火器と転倒式化学泡消火器のように、その動作をしないと作動しないものには設けなくて構いません。'},
  {h:'ホース'},
  {p:'原則すべての消火器に必要ですが、例外が2つあります。薬剤量1kg以下の粉末消火器と、薬剤量4kg未満のハロゲン化物消火器です。二酸化炭素消火器はすべてホースが必要で、ここを入れ替えた選択肢が定番です。'},
  {h:'使用済み表示装置'},
  {p:'一度使うと元に戻らない表示で、使いかけの消火器を見分けるためのものです。指示圧力計のある蓄圧式、バルブのないもの、手動ポンプ式水消火器、化学泡消火器には不要です。蓄圧式は圧力計を見れば使用済みとわかり、化学泡は転倒させれば明らかだからです。'},
  {h:'保持装置'},
  {p:'消火器の質量が28kg以下は手さげ式または据置式、28kgを超えるものは車載式とします。大型消火器の多くが車載式なのはこのためです。'},
  {h:'塗色'},
  {tbl:[['対象','塗色'],
        ['消火器一般','外面の表面積の25％以上を赤色'],
        ['二酸化炭素消火器の容器','表面積の1/2以上を緑色（高圧ガス保安法）'],
        ['ハロン1301の容器','ねずみ色（高圧ガス保安法）']]},
  {p:'二酸化炭素消火器は、緑色1/2以上を確保したうえで、残りの部分で赤色25％以上も満たす必要があります。両方の法令がかかっているためです。'},
  {h:'指示圧力計'},
  {p:'使用圧力範囲0.7〜0.98MPaが緑色で表示されます。緑より下を指していれば薬剤やガスの漏れ、使用後の可能性。緑より上なら充てん過多や高温環境が疑われます。いずれも整備が必要です。'}
 ], q:['O610','O611','O612','O613','O617','O629']},

{id:'L608', t:'法令共通の骨格（甲4・甲1でもそのまま使えます）',
 b:[
  {p:'ここは全類で共通に出題される部分です。乙6のために覚えたものが、そのまま甲4・甲1でも得点になります。投資効率が最も高い単元です。'},
  {h:'免状まわり'},
  {tbl:[['手続き','いつ','どこへ'],
        ['書換え','記載事項の変更時、写真が10年経過したとき','居住地・勤務地・交付地のいずれかの知事'],
        ['再交付','亡失・滅失・汚損・破損したとき','交付または書換えをした知事'],
        ['亡失した免状を発見','発見から10日以内','再交付を受けた知事に提出']]},
  {p:'住所や勤務先は免状の記載事項ではないので、変わっても書換えは不要です。免状は全国で有効で、有効期限による失効もありません。'},
  {h:'講習'},
  {p:'免状交付を受けた日以後における最初の4月1日から2年以内に初回、その後は講習を受けた日以後における最初の4月1日から5年以内ごとに受講します。起算日が「交付日」ではなく「その後の最初の4月1日」である点が引っかけどころです。業務に従事していなくても義務があります。'},
  {h:'届出の2種類（混同注意）'},
  {tbl:[['届出','誰が','いつ','どこへ'],
        ['着工届','甲種消防設備士','着手しようとする日の10日前まで','消防長または消防署長'],
        ['設置届','関係者','工事完了後4日以内','消防長または消防署長']]},
  {p:'届出義務者が違います。着工届は消防設備士本人、設置届は所有者などの関係者です。乙種消防設備士は工事ができないので、着工届も出しません。'},
  {h:'特定防火対象物とは'},
  {p:'不特定多数が出入りする、または避難が困難な人が利用する用途です。劇場・映画館、キャバレー、飲食店、百貨店、旅館・ホテル、病院・福祉施設、地下街などが該当します。学校、共同住宅、事務所、図書館は非特定です。この区分は点検報告の周期、防火管理者の要否、既存不遡及の例外など、多くの規定の分かれ目になります。'},
  {h:'既存不遡及とその例外'},
  {p:'基準が改正されても既存の建物は従前の基準でよい、というのが原則です。ただし消火器、避難器具、簡易消火用具、自動火災報知設備（特定用途）、ガス漏れ火災警報設備、漏電火災警報器、非常警報器具・設備、誘導灯・誘導標識は常に改正後の基準に適合させる必要があります。消火器が含まれているのは乙6で重要です。また、特定防火対象物なら設備の種類を問わず遡及します。'},
  {h:'検定制度'},
  {p:'型式承認は総務大臣が行い、型式適合検定は日本消防検定協会等が行います。消火器と消火器用消火薬剤はいずれも検定対象品目です。検定合格表示のないものは販売・陳列・工事への使用ができません。'}
 ], q:['CM01','CM02','CM03','CM04','CM05','CM06','CM07','CM08','CM09']}
],

ko4: [
{id:'L401', t:'自動火災報知設備の全体像',
 b:[
  {p:'甲4は範囲が広く見えますが、構成要素は4つしかありません。まず信号の流れを頭に入れると、個別の基準がどこに効くのかが見えるようになります。'},
  {h:'信号の流れ'},
  {p:'感知器または発信機が火災を検出 → （中継器を経由することもある）→ 受信機が受信 → 火災灯の点灯・地区表示・主音響装置の鳴動 → 地区音響装置が建物内に報知。この一本道です。'},
  {tbl:[['機器','役割'],
        ['感知器','熱・煙・炎を自動的に検出する'],
        ['発信機','人が押しボタンで手動通報する'],
        ['中継器','信号を受けて受信機や消火設備へ発信する'],
        ['受信機','信号を受け、火災の発生と場所を表示・報知する'],
        ['地区音響装置','建物内の人に音で知らせる']]},
  {h:'警戒区域という考え方'},
  {p:'受信機は「どこで火災が起きたか」を表示しますが、部屋単位では表示灯が膨大になります。そこで建物を区画に分け、その単位で表示します。この区画が警戒区域です。原則、面積600㎡以下・一辺50m以下で、2以上の階にわたらないこととされています。'},
  {p:'例外もあります。主要な出入口からその内部を見通せる場合は1000㎡以下、光電式分離型感知器を設ける場合は一辺100m以下、2の階にわたる部分の床面積の合計が500㎡以下なら階をまたいでも可。階段やエレベーター昇降路などのたて穴区画は、別に警戒区域を設定します。'},
  {p:'「600㎡は面積の上限、500㎡は階をまたぐときの合計」という数字の役割の違いを意識してください。'}
 ], q:['K401','K402','K425']},

{id:'L402', t:'感知器の種類と作動原理',
 b:[
  {p:'何を検出するかで大きく3系統に分かれます。原理がわかると、どこに設置すべきか・どこに設置してはいけないかが自然に出てきます。'},
  {h:'熱感知器'},
  {tbl:[['種類','作動条件','設置に向く場所'],
        ['差動式','周囲の温度上昇率が一定以上','事務室、居室など温度変化の少ない場所'],
        ['定温式','周囲の温度が一定の温度以上','厨房、ボイラー室など常時高温の場所'],
        ['補償式','差動式と定温式の両方の性能','温度変化が緩やかな火災も想定される場所']]},
  {p:'差動式スポット型の中身は空気室（チャンバー）とダイヤフラムです。急激に温められると空気が膨張してダイヤフラムを押し上げ、接点が閉じます。ただし暖房のような緩やかな温度上昇では誤作動してほしくないので、逃がし穴（リーク孔）が付いていて、ゆっくりした膨張分は逃げるようになっています。'},
  {p:'ここから点検の要点が導けます。リーク孔が詰まれば逃げ場を失って誤作動（非火災報）が増え、逆に広がりすぎれば火災時も空気が逃げて作動が遅れます。'},
  {p:'定温式は、正常時の熱で作動しないよう、取付場所の最高周囲温度より20℃以上高い公称作動温度のものを選びます。'},
  {h:'煙感知器'},
  {p:'イオン化式と光電式があり、現在の主流は光電式です。光電式スポット型は、暗箱の中で発光素子の光が煙の粒子に当たって散乱し、その散乱光を受光素子が捉えることで作動します。光電式分離型は送光部と受光部を離して設置し、その間の光の減光量で判定します。公称監視距離は5m以上100m以下（5m刻み）。'},
  {p:'煙感知器を設けてはならないのは、厨房・浴室のように水蒸気が多量に滞留する場所、著しく高温になる場所、排気ガスが滞留する場所です。煙と紛らわしいものがあると誤作動するためで、これも原理から導けます。'},
  {h:'炎感知器'},
  {p:'炎から放射される紫外線または赤外線を検出します。天井が高くて熱や煙が感知器まで届かない場所（アトリウム、体育館、工場など）で使われます。'}
 ], q:['K410','K419','K435','K436','K438']},

{id:'L403', t:'感知器の設置基準',

/* ============ 状態管理 ============ */
const KEY = 'shoubou-drill-v1';
const COURSES = ['ko4','otsu6','ko1'];
let S = load();
let cur = S.lastCourse || 'ko4';
let session = null;

function blank(){
  const o = {lastCourse:'ko4', log:{}, flags:{}, days:[], read:{}};
  return o;
}
function load(){
  try{
    const raw = localStorage.getItem(KEY);
    if(!raw) return blank();
    const d = JSON.parse(raw);
    return Object.assign(blank(), d);
  }catch(e){ return blank(); }
}
function save(){
  try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){}
}
function today(){ const d=new Date(); return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate(); }
function markDay(){
  const t = today();
  if(S.days[S.days.length-1] !== t){ S.days.push(t); if(S.days.length>400) S.days.shift(); save(); }
}
function streak(){
  if(!S.days.length) return 0;
  const ms = 86400000, base = new Date(); base.setHours(0,0,0,0);
  const set = new Set(S.days);
  let n = 0;
  for(let i=0;i<400;i++){
    const d = new Date(base.getTime()-i*ms);
    const k = d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate();
    if(set.has(k)) n++;
    else if(i>0) break;
  }
  return n;
}

/* 全問取得（法令共通を各コースに合流） */
function pool(cid){
  const c = BANK[cid];
  return BANK.common.concat(c.q);
}
function catsOf(cid){ return BANK[cid].cats; }

/* ============ 集計 ============ */
function statOf(cid){
  const qs = pool(cid), cats = catsOf(cid);
  const out = {};
  Object.keys(cats).forEach(k => out[k] = {n:0, done:0, ok:0});
  qs.forEach(q => {
    if(!out[q.c]) return;
    out[q.c].n++;
    const r = S.log[q.i];
    if(r && r.t > 0){ out[q.c].done++; if(r.o > 0) out[q.c].ok++; }
  });
  return out;
}
function wrongList(cid){
  return pool(cid).filter(q => { const r = S.log[q.i]; return r && r.t>0 && r.o < r.t; });
}
function flagList(cid){
  return pool(cid).filter(q => S.flags[q.i]);
}

/* ============ 画面：ホーム ============ */
const $ = id => document.getElementById(id);

function renderTabs(){
  $('tabs').innerHTML = COURSES.map(id =>
    `<button class="tab" role="tab" data-c="${id}" aria-selected="${id===cur}">
       <b>${BANK[id].name}</b><span>${BANK[id].sub}</span></button>`).join('');
  $('tabs').querySelectorAll('.tab').forEach(b => b.onclick = () => {
    cur = b.dataset.c; S.lastCourse = cur; save(); renderTabs(); renderHome();
  });
}

function renderHome(){
  show('home');
  renderLessonList();
  const cats = catsOf(cur), st = statOf(cur), qs = pool(cur);
  const done = Object.values(st).reduce((a,b)=>a+b.done,0);
  const ok = Object.values(st).reduce((a,b)=>a+b.ok,0);
  const rate = done ? Math.round(ok/done*100) : 0;

  $('gSub').textContent = `${BANK[cur].name}（${BANK[cur].sub}）　収録 ${qs.length}問　／　解答済 ${done}問　総合正答率 ${done?rate+'％':'—'}`;

  $('gRows').innerHTML = Object.keys(cats).map(k => {
    const s = st[k];
    const p = s.done ? Math.round(s.ok/s.done*100) : 0;
    const cls = !s.done ? '' : p<40 ? 'low' : p<60 ? 'mid' : 'hi';
    return `<div class="grow">
      <div class="glab">${cats[k]}</div>
      <div class="gtrack"><div class="gfill ${cls}" style="width:${s.done?p:0}%"></div><i class="l40"></i><i class="l60"></i></div>
      <div class="gnum">${s.done? p+'%' : '—'}</div>
    </div>`;
  }).join('');

  const w = wrongList(cur).length, f = flagList(cur).length;
  $('wrongDesc').textContent = w ? `誤答した ${w}問` : '誤答した問題はまだありません';
  $('flagDesc').textContent = f ? `印をつけた ${f}問` : '印をつけた問題はありません';
  $('mWrong').disabled = !w;
  $('mFlag').disabled = !f;
  const mk = BANK[cur].mock;
  $('mockDesc').textContent = '本番配分 ' + Object.keys(mk).map(k=>mk[k]).reduce((a,b)=>a+b,0) + '問（不足分は収録数まで）';

  $('cats').innerHTML = Object.keys(cats).map(k => {
    const s = st[k];
    return `<div class="catrow">
      <b>${cats[k]}</b>
      <em>${s.done}／${s.n}問</em>
      <button class="mini" data-cat="${k}">解く</button>
    </div>`;
  }).join('');
  $('cats').querySelectorAll('.mini').forEach(b => b.onclick = () => startCat(b.dataset.cat));

  const total = COURSES.reduce((a,id)=>a+pool(id).length,0);
  const lsAll = COURSES.reduce((a,id)=>a+lessonsOf(id).length,0);
  const st2 = streak();
  $('foot').innerHTML = `全3コース 講義 ${lsAll}単元・収録 ${total}問。${st2?`連続学習 ${st2}日。`:''}
    解答の記録はこの端末のブラウザにのみ保存されます。
    <button id="btnReset">${BANK[cur].name}の記録を消去</button><br>
    問題は試験範囲に沿って書き下ろしたもので、実際の試験問題ではありません。
    法令や規格が改正されている可能性があるため、最終確認は必ず最新のテキストで行ってください。`;
  $('btnReset').onclick = () => {
    if(!confirm(BANK[cur].name + 'の解答記録と見直し印を消去します。よろしいですか。')) return;
    pool(cur).forEach(q => { delete S.log[q.i]; delete S.flags[q.i]; });
    lessonsOf(cur).forEach(l => delete S.read[l.id]);
    save(); renderHome();
  };
}

function show(which){
  ['home','lesson','quiz','result'].forEach(id => $(id).classList.toggle('hide', id!==which));
  window.scrollTo({top:0, behavior:'instant'});
}

/* ============ 出題 ============ */
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]];} return a; }

function begin(list, label){
  if(!list.length) return;
  session = {qs:list, i:0, res:[], label:label};
  markDay();
  renderQ();
}
function startCat(k){
  const list = shuffle(pool(cur).filter(q=>q.c===k));
  begin(list, catsOf(cur)[k]);
}
function startMode(m){
  if(m==='random') return begin(shuffle(pool(cur)).slice(0,20), 'ランダム20問');
  if(m==='wrong')  return begin(shuffle(wrongList(cur)), '間違い直し');
  if(m==='flag')   return begin(shuffle(flagList(cur)), 'チェック済み');
  if(m==='mock'){
    const mk = BANK[cur].mock, out = [];
    Object.keys(mk).forEach(k => {
      out.push(...shuffle(pool(cur).filter(q=>q.c===k)).slice(0, mk[k]));
    });
    return begin(out, '模擬試験');
  }
}

function renderQ(){
  show('quiz');
  const q = session.qs[session.i];
  const cats = catsOf(cur);
  $('qCat').textContent = cats[q.c] || '';
  $('qId').textContent = q.i;
  $('qCnt').textContent = `${session.label}　${session.i+1} / ${session.qs.length}`;
  $('qText').textContent = q.q;
  $('qExp').classList.add('hide');
  $('btnNext').classList.add('hide');
  $('btnFlag').classList.toggle('on', !!S.flags[q.i]);
  $('btnFlag').textContent = S.flags[q.i] ? '見直し印を外す' : '見直し印';

  const order = shuffle(q.o.map((_,n)=>n));
  session.order = order;
  session.ansPos = order.indexOf(q.a);
  $('qChoices').innerHTML = order.map((src,pos) =>
    `<button class="ch" data-n="${pos}"><u>${pos+1}</u><span>${q.o[src]}</span></button>`).join('');
  $('qChoices').querySelectorAll('.ch').forEach(b => b.onclick = () => answer(+b.dataset.n));
}

function answer(n){
  const q = session.qs[session.i];
  const ansPos = session.ansPos;
  const ok = (n === ansPos);
  const r = S.log[q.i] || {t:0,o:0};
  r.t++; if(ok) r.o++;
  S.log[q.i] = r; save();
  session.res.push({q:q, ok:ok, pick:n});

  $('qChoices').querySelectorAll('.ch').forEach(b => {
    const bn = +b.dataset.n;
    b.disabled = true;
    if(bn === n) b.classList.add(ok ? 'pick-ok' : 'pick-ng');
    else if(bn === ansPos) b.classList.add('reveal');
    else b.classList.add('dim');
  });
  $('qVerdict').textContent = ok ? '正解' : '不正解　正答は ' + (ansPos+1);
  $('qVerdict').className = 'verdict ' + (ok ? 'ok' : 'ng');
  $('qExpText').textContent = q.e;
  $('qExp').classList.remove('hide');
  const last = session.i === session.qs.length - 1;
  $('btnNext').textContent = last ? '結果を見る' : '次の問題';
  $('btnNext').classList.remove('hide');
  $('btnNext').focus();
}

$('btnNext').onclick = () => {
  if(session.i === session.qs.length - 1) return renderResult();
  session.i++; renderQ();
};
$('btnFlag').onclick = () => {
  const q = session.qs[session.i];
  if(S.flags[q.i]) delete S.flags[q.i]; else S.flags[q.i] = 1;
  save();
  $('btnFlag').classList.toggle('on', !!S.flags[q.i]);
  $('btnFlag').textContent = S.flags[q.i] ? '見直し印を外す' : '見直し印';
};
$('btnQuit').onclick = () => { session = null; renderHome(); };
$('btnHome').onclick = () => { session = null; renderHome(); };
$('btnLsCont').onclick = () => { session = null; openLesson(lsIdx + 1); };
$('btnRetryWrong').onclick = () => {
  const list = session.res.filter(r=>!r.ok).map(r=>r.q);
  begin(shuffle(list), '誤答の再挑戦');
};

function renderResult(){
  show('result');
  const n = session.res.length, ok = session.res.filter(r=>r.ok).length;
  const p = Math.round(ok/n*100);
  $('rScore').innerHTML = `${p}<small>％</small>`;
  $('rSub').textContent = `${session.label}　${n}問中 ${ok}問正解`;
  const pass = p >= 60;
  $('rJudge').innerHTML = `<span class="judge ${pass?'pass':'fail'}">${pass?'合格ライン到達':'合格ラインまであと'+(Math.ceil(n*0.6)-ok)+'問'}</span>`;
  $('rList').innerHTML = session.res.map((r,idx) =>
    `<div class="rrow"><span class="${r.ok?'o':'x'}">${r.ok?'○':'×'}</span><div>${idx+1}. ${r.q.q}</div></div>`).join('');
  $('btnRetryWrong').classList.toggle('hide', ok === n);
  const isLs = session.label.indexOf('第') === 0;
  $('btnLsCont').classList.toggle('hide', !isLs || lsIdx >= lessonsOf(cur).length-1);
}

/* ============ 講義 ============ */
let lsIdx = 0;

function lessonsOf(cid){ return LESSONS[cid] || []; }

function renderLessonList(){
  const ls = lessonsOf(cur);
  if(!ls.length){ $('learnPanel').classList.add('hide'); return; }
  $('learnPanel').classList.remove('hide');
  $('lessons').innerHTML = ls.map((l,n) => {
    const done = S.read[l.id];
    return `<button class="lsrow ${done?'done':''}" data-n="${n}">
      <i>${done?'✓':n+1}</i><b>${l.t}</b><em>${(l.q||[]).length}問</em></button>`;
  }).join('');
  $('lessons').querySelectorAll('.lsrow').forEach(b => b.onclick = () => openLesson(+b.dataset.n));
}

function openLesson(n){
  const ls = lessonsOf(cur);
  if(n < 0 || n >= ls.length) return renderHome();
  lsIdx = n;
  const l = ls[n];
  show('lesson');
  $('lsNo').textContent = '第' + (n+1) + '講';
  $('lsOf').textContent = BANK[cur].name + '　' + (n+1) + ' / ' + ls.length;
  $('lsTitle').textContent = l.t;
  $('lsBody').innerHTML = l.b.map(x => {
    if(x.h) return '<h3>' + esc(x.h) + '</h3>';
    if(x.p) return '<p>' + esc(x.p) + '</p>';
    if(x.tbl){
      const [head, ...rows] = x.tbl;
      return '<table><thead><tr>' + head.map(c=>'<th>'+esc(c)+'</th>').join('') +
             '</tr></thead><tbody>' + rows.map(r=>'<tr>'+r.map(c=>'<td>'+esc(c)+'</td>').join('')+'</tr>').join('') +
             '</tbody></table>';
    }
    return '';
  }).join('');
  const qn = (l.q||[]).length;
  $('btnLsQuiz').textContent = qn ? `この単元の問題を解く（${qn}問）` : '一覧にもどる';
  $('btnLsNext').classList.toggle('hide', n === ls.length-1);
  S.read[l.id] = 1; save();
}
function esc(t){ return String(t).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }

$('btnLsQuiz').onclick = () => {
  const l = lessonsOf(cur)[lsIdx];
  const ids = l.q || [];
  if(!ids.length) return renderHome();
  const map = {}; pool(cur).forEach(q => map[q.i] = q);
  const list = ids.map(id => map[id]).filter(Boolean);
  begin(shuffle(list), '第' + (lsIdx+1) + '講　' + l.t);
};
$('btnLsNext').onclick = () => openLesson(lsIdx + 1);
$('btnLsBack').onclick = () => renderHome();

document.querySelectorAll('.mode').forEach(b => b.onclick = () => startMode(b.dataset.mode));
renderTabs();
renderHome();
</script>
</body>
</html>
