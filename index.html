{i:'I101',c:'rui',q:'1号消火栓の設置について、防火対象物の階ごとに、その階の各部分から一のホース接続口までの水平距離の上限はどれか。',o:['15m以下','25m以下','40m以下','50m以下'],a:1,e:'1号消火栓と広範囲型2号消火栓は水平距離25m以下、2号消火栓は15m以下、屋外消火栓は40m以下です。歩行距離ではなく水平距離である点に注意してください。'},
{i:'I102',c:'rui',q:'1号消火栓のノズル先端における放水圧力および放水量として、正しいものはどれか。',o:['0.17MPa以上0.7MPa以下、130L/min以上','0.25MPa以上0.7MPa以下、60L/min以上','0.17MPa以上0.7MPa以下、60L/min以上','0.25MPa以上0.6MPa以下、350L/min以上'],a:0,e:'1号は0.17MPa以上0.7MPa以下で130L/min以上。2号は0.25MPa以上0.7MPa以下で60L/min以上、広範囲型2号は0.17MPa以上で80L/min以上、屋外消火栓は0.25MPa以上0.6MPa以下で350L/min以上です。'},
{i:'I103',c:'rui',q:'1号消火栓の水源水量の算定として、正しいものはどれか（設置個数が最も多い階の設置個数をNとする。ただしNが2を超えるときは2とする）。',o:['1.2m³×N','1.6m³×N','2.6m³×N','7m³×N'],a:2,e:'水源水量は1号が2.6m³×N、2号が1.2m³×N、広範囲型2号が1.6m³×N、屋外消火栓が7m³×Nです。いずれもNの上限は2（屋外消火栓も2）です。'},
{i:'I104',c:'rui',q:'屋内消火栓設備の開閉弁の設置高さとして、正しいものはどれか。',o:['床面からの高さ1.5m以下','床面からの高さ1.0m以下','床面からの高さ1.8m以下','高さの制限はない'],a:0,e:'屋内消火栓の開閉弁は床面から1.5m以下に設けます。屋外消火栓の開閉弁は地盤面から1.5m以下（地下に設ける場合は地盤面下0.6m以内）です。'},
{i:'I105',c:'rui',q:'屋内消火栓設備の表示灯について、正しいものはどれか。',o:['赤色で、取付面と15度以上の角度となる方向に沿って10m離れた位置から容易に識別できること','緑色で、5m離れた位置から識別できること','赤色で、取付面と30度以上の角度となる方向に沿って15m離れた位置から識別できること','色の指定はないが、常時点灯していること'],a:0,e:'表示灯は赤色で、取付面と15度以上の角度となる方向に沿って10m離れた位置から容易に識別できるものとします。この「15度・10m」の要件は発信機の表示灯と共通で、まとめて覚えられます。'},
{i:'I106',c:'rui',q:'屋内消火栓設備の非常電源として、有効に作動できる時間はどれか。',o:['10分間以上','20分間以上','30分間以上','60分間以上'],a:2,e:'非常電源は30分間以上有効に作動できる容量が必要です。延べ面積1000㎡以上の特定防火対象物では、非常電源専用受電設備ではなく自家発電設備・蓄電池設備・燃料電池設備によらなければなりません。'},
{i:'I107',c:'rui',q:'閉鎖型スプリンクラーヘッドの放水圧力および放水量として、正しいものはどれか。',o:['0.1MPa以上1MPa以下、80L/min以上','0.17MPa以上0.7MPa以下、130L/min以上','0.1MPa以上0.7MPa以下、60L/min以上','0.25MPa以上1MPa以下、80L/min以上'],a:0,e:'スプリンクラーヘッドは放水圧力0.1MPa以上1MPa以下、放水量80L/min以上です。屋内消火栓の数値と混同しやすいので区別しておきましょう。'},
{i:'I108',c:'kozo',q:'閉鎖型スプリンクラーヘッド（標準型・高感度型を除く）を耐火建築物に設ける場合の、各部分からヘッドまでの水平距離の上限はどれか。',o:['1.7m以下','2.1m以下','2.3m以下','2.6m以下'],a:2,e:'耐火建築物は2.3m以下、耐火建築物以外は2.1m以下、高感度型ヘッドは2.6m以下です。ラック式倉庫や地下街の一部など、用途によってさらに厳しい基準が定められています。'},
{i:'I109',c:'kozo',q:'閉鎖型スプリンクラーヘッドの標示温度の選定について、取付場所の最高周囲温度が39℃以上64℃未満の場合、選定すべき標示温度はどれか。',o:['79℃未満','79℃以上121℃未満','121℃以上162℃未満','162℃以上'],a:1,e:'最高周囲温度が39℃未満なら標示温度79℃未満、39℃以上64℃未満なら79℃以上121℃未満、64℃以上106℃未満なら121℃以上162℃未満、106℃以上なら162℃以上を選びます。ヘッドの色別表示（無色・白・青・赤・緑・橙）と併せて押さえてください。'},
{i:'I110',c:'kozo',q:'湿式流水検知装置を用いるスプリンクラー設備の末端試験弁について、正しいものはどれか。',o:['二次側に圧力計、一次側に試験用放水口を設ける','一次側に圧力計、二次側に開放型ヘッドと同等の放水性能を有するオリフィス等の試験用放水口を設ける','圧力計は不要である','各階の最も送水口に近い位置に設ける'],a:1,e:'末端試験弁は流水検知装置の作動、圧力の状況、警報の発報を確認するためのもので、一次側に圧力計、二次側に開放型ヘッドと同等の放水性能を持つオリフィス等の試験用放水口を設けます。設置位置は放水圧力が最も低くなると予想される配管の部分で、階ごとに設けます。'},
{i:'I111',c:'kozo',q:'加圧送水装置に用いるポンプの性能として、正しいものはどれか。',o:['締切全揚程は定格全揚程の140％以下、定格吐出量の150％で運転したときの全揚程は定格全揚程の65％以上','締切全揚程は定格全揚程の110％以下、定格吐出量の150％で全揚程の80％以上','締切全揚程は定格全揚程の140％以上、定格吐出量の150％で全揚程の65％以下','締切全揚程は定格全揚程の65％以下'],a:0,e:'締切運転時の全揚程が定格全揚程の140％を超えないこと、定格吐出量の150％で運転したときの全揚程が定格全揚程の65％以上であることが必要です。これを確認するのが性能試験装置（性能試験配管）の役割です。'},
{i:'I112',c:'kozo',q:'ポンプに設ける呼水槽の有効水量として、原則正しいものはどれか。',o:['50L以上','100L以上','200L以上','500L以上'],a:1,e:'呼水槽は有効水量100L以上（フート弁の呼び径が150mm以下の場合など条件により50L以上とできる場合があります）で、減水警報装置と補給水管を設けます。水源の水位がポンプより高い位置にある場合は呼水装置そのものが不要です。'},
{i:'I113',c:'kozo',q:'加圧送水装置に設ける「逃し配管」の目的として、正しいものはどれか。',o:['ポンプの締切運転時の水温上昇を防止するため','配管内の空気を抜くため','水源の水位を一定に保つため','放水圧力を高めるため'],a:0,e:'締切運転が続くとポンプ内の水が撹拌されて温度が上昇し、機器を損傷します。これを防ぐため、ポンプ吐出側の逆止弁の一次側から水源へ少量の水を常時逃がす配管（逃し配管）を設けます。'},
{i:'I114',c:'kozo',q:'起動用水圧開閉装置に設ける圧力タンクの容積として、正しいものはどれか。',o:['50L以上','100L以上','150L以上','200L以上'],a:1,e:'起動用水圧開閉装置の圧力タンクは容積100L以上です。消火栓の開閉弁を開くと配管内の圧力が低下し、圧力スイッチが動作してポンプが自動起動する仕組みです。呼水槽の100L以上と数値が同じなので、混同せず両方覚えておきましょう。'},
{i:'I115',c:'kozo',q:'屋内消火栓設備の加圧送水装置におけるポンプの吐出量として、1号消火栓の場合に正しいものはどれか（設置個数が最も多い階の個数をNとし、Nが2を超えるときは2とする）。',o:['70L/min×N','90L/min×N','150L/min×N','400L/min×N'],a:2,e:'ポンプ吐出量は1号が150L/min×N、2号が70L/min×N、広範囲型2号が90L/min×N、屋外消火栓が400L/min×Nです。ノズル放水量（130／60／80／350）より大きい値になっている点に注目すると覚えやすくなります。'},
{i:'I116',c:'kozo',q:'1号消火栓の加圧送水装置の全揚程Hを求める式として、正しいものはどれか。',o:['H＝h1＋h2＋h3＋17m','H＝h1＋h2＋h3＋25m','H＝h1＋h2＋h3＋10m','H＝h1＋h2＋h3'],a:0,e:'H＝消防用ホースの摩擦損失水頭h1＋配管の摩擦損失水頭h2＋落差h3＋ノズル放水圧力換算水頭。この換算水頭が1号消火栓は17m、2号消火栓と屋外消火栓は25m、スプリンクラー設備は10mです。放水圧力0.17MPa≒17mという対応関係で理解できます。'},
{i:'I117',c:'kozo',q:'閉鎖型スプリンクラー設備のうち、二次側配管を圧縮空気等で満たしておく方式はどれか。',o:['湿式','乾式','開放型','放水型'],a:1,e:'乾式は二次側配管を圧縮空気で満たしており、凍結のおそれのある寒冷地に用います。予作動式は二次側を空気で満たし、感知器の作動と ヘッドの開放の両方が成立して初めて放水するため、誤放水を嫌う電算室などに適します。'},
{i:'I118',c:'kozo',q:'一斉開放弁が用いられるスプリンクラー設備はどれか。',o:['湿式','乾式','開放型','予作動式'],a:2,e:'開放型ヘッドを用いる設備では、感知用ヘッドや火災感知器の作動により一斉開放弁が開き、その放水区域のヘッドから一斉に放水します。舞台部など天井が高く火災の拡大が速い場所に用いられます。'},
{i:'I119',c:'kozo',q:'スプリンクラー設備の補助散水栓について、各部分からホース接続口までの水平距離の上限はどれか。',o:['10m以下','15m以下','25m以下','40m以下'],a:1,e:'補助散水栓は水平距離15m以下です。スプリンクラーヘッドの設置が免除される部分（トイレ・浴室など）をカバーするために設けるもので、2号消火栓と同等の性能を持ちます。'},
{i:'I120',c:'kozo',q:'スプリンクラー設備の送水口の形式として、原則正しいものはどれか。',o:['単口形','双口形','形式の指定はない','三口形'],a:1,e:'スプリンクラー設備の送水口は双口形とし、地盤面からの高さ0.5m以上1m以下の位置に設けます。消防隊が送水する際の接続口で、屋内消火栓設備には設けません。'},
{i:'I121',c:'kozo',q:'消防用配管に用いる管について、適当でないものはどれか。',o:['配管用炭素鋼鋼管（SGP）','圧力配管用炭素鋼鋼管（STPG）','ステンレス鋼鋼管','鉛管'],a:3,e:'消防用設備等の配管には、配管用炭素鋼鋼管、圧力配管用炭素鋼鋼管、ステンレス鋼鋼管、銅合金管、および所定の合成樹脂管などが使用できます。鉛管は強度・耐熱性の面から用いられません。'},
{i:'I122',c:'kozo',q:'配管の摩擦損失について、正しいものはどれか。',o:['管径が大きいほど大きくなる','流速が大きいほど大きくなる','管の長さが短いほど大きくなる','流量に関係しない'],a:1,e:'摩擦損失は流速の2乗にほぼ比例し、管の長さに比例、管径に反比例します。したがって流速を下げる（管径を大きくする）ほど損失は小さくなります。'},
{i:'I123',c:'kiso',q:'水頭1mに相当する圧力はおよそいくらか。',o:['約0.0098MPa','約0.098MPa','約0.98MPa','約9.8MPa'],a:0,e:'水1mの水頭は約0.0098MPa（≒0.01MPa）です。したがって0.17MPaは約17m、0.1MPaは約10mに相当し、加圧送水装置の全揚程計算で用いる換算水頭の根拠になります。'},
{i:'I124',c:'kiso',q:'パスカルの原理について、正しいものはどれか。',o:['密閉容器内の静止流体の一部に加えた圧力は、流体のすべての部分に同じ大きさで伝わる','流体の速度が増すと圧力が増す','流体の粘度は温度に比例する','浮力は物体の体積に反比例する'],a:0,e:'パスカルの原理は水圧機や油圧ジャッキの原理です。速度が増すと圧力が下がるのはベルヌーイの定理、浮力が押しのけた流体の重さに等しいのはアルキメデスの原理です。'},
{i:'I125',c:'kiso',q:'ポンプの吸込側で圧力が飽和蒸気圧以下になり、気泡が発生・消滅して振動や壊食を起こす現象を何というか。',o:['ウォーターハンマー','キャビテーション','サージング','スケーリング'],a:1,e:'キャビテーションは吸込揚程が大きすぎる、吸込配管の抵抗が大きい、水温が高いなどの条件で発生します。ウォーターハンマーは弁の急閉による水撃、サージングは流量と圧力が周期的に変動する現象です。'},
{i:'I126',c:'kiso',q:'ベルヌーイの定理において、一定に保たれるものの組合せとして正しいものはどれか。',o:['位置水頭＋圧力水頭＋速度水頭','圧力＋温度','流量＋粘度','密度＋体積'],a:0,e:'理想流体では位置水頭・圧力水頭・速度水頭の和（全水頭）が一定に保たれます。管が細くなって流速が増すと圧力水頭が下がるのはこのためです。'},
{i:'I127',c:'kiso',q:'金属材料に力を加えて変形させたあと、力を取り去っても元に戻らない変形を何というか。',o:['弾性変形','塑性変形','熱変形','弾性限度'],a:1,e:'力を取り去れば元に戻るのが弾性変形、戻らないのが塑性変形です。その境界となる応力を弾性限度といい、これを超えると永久ひずみが残ります。'},
{i:'I128',c:'kiso',q:'ステンレス鋼の主な合金元素として、正しいものはどれか。',o:['クロムとニッケル','銅と亜鉛','鉛とすず','アルミニウムとマグネシウム'],a:0,e:'ステンレス鋼はクロムを含む合金鋼で、クロムが表面に不動態皮膜を作ることで耐食性を発揮します。オーステナイト系（SUS304など）はニッケルも加えられています。銅と亜鉛の合金は黄銅（真ちゅう）です。'},
{i:'I129',c:'kiso',q:'管継手のうち、配管の方向を90度変えるために用いるものはどれか。',o:['ソケット','エルボ','ティー','ニップル'],a:1,e:'エルボは方向転換、ソケットとニップルは直線接続、ティーは分岐に用います。径の異なる管をつなぐにはレデューサ（径違いソケット）を使います。'},
{i:'I130',c:'kan',q:'流水検知装置の作動を確認する試験を行う場合、操作する弁として正しいものはどれか。',o:['末端試験弁','制御弁','送水口の弁','逃し弁'],a:0,e:'末端試験弁を開いて放水し、流水検知装置の作動・警報の発報・圧力計の指示を確認します。制御弁は放水区域への送水を止める弁で、点検後の閉め忘れが重大事故につながるため、点検では開放状態への復旧確認が必須です。'},
{i:'I131',c:'kan',q:'屋内消火栓設備の総合点検で行う放水試験において、ノズル先端の放水圧力を測定する器具はどれか。',o:['ピトーゲージ','マノメーター','絶縁抵抗計','スケール'],a:0,e:'ピトーゲージ（ピトー管付圧力計）をノズル先端から放水口径の2分の1程度離した位置に、放水軸に直角に当てて測定します。放水量は Q＝0.653×D²×√P の式で算出します。'},
{i:'I132',c:'kan',q:'放水量を求める式 Q＝0.653×D²×√P において、Dが表すものはどれか。',o:['ノズルの口径（mm）','配管の内径（mm）','ホースの長さ（m）','水源の深さ（m）'],a:0,e:'Dはノズル口径（mm）、Pは放水圧力（MPa）、Qは放水量（L/min）です。口径の2乗に比例するため、ノズル径の違いが放水量に大きく効きます。'},
{i:'I133',c:'kan',q:'ポンプの吸込側に設けるフート弁の役割として、正しいものはどれか。',o:['水の逆流を防ぎ、吸込管内を満水に保つ','配管内の空気を抜く','ポンプの締切運転を防止する','放水圧力を調整する'],a:0,e:'フート弁は逆止弁とストレーナを兼ねた弁で、水源の水位がポンプより低い場合に吸込管内の水が落ちるのを防ぎます。あわせて呼水装置が必要になります。'},
{i:'I134',c:'kan',q:'消防用ホースの点検において、確認すべき事項として適当でないものはどれか。',o:['ホースの著しい摩耗・損傷の有無','結合金具の変形・損傷の有無','ホースの製造年月と耐圧性能点検の実施状況','ホースの色が赤色であること'],a:3,e:'ホースの色は規定されていません。点検では摩耗・損傷・カビ・結合金具の状態を確認し、製造から10年を経過したホースは3年ごとに耐圧性能点検（水圧試験）を行います。'}
]},
};

  {p:'容器の中に小さな加圧用ガス容器（ボンベ）が入っていて、レバーを握るとカッターがその封板を破り、ガスが噴き出して薬剤を押し出します。使用前は容器内に圧力がかかっていないので、指示圧力計はありません。'},
  {p:'加圧用ガス容器は内容積100cm³以下なら高圧ガス保安法の適用を受けず、容器弁のないものが使われます。100cm³を超えると容器弁付きになり、同法の適用を受けます。'},
  {h:'反応式（化学泡）'},
  {p:'外筒のA剤と内筒のB剤を混合させ、化学反応で発生する二酸化炭素の圧力で放射します。押し出すためのガスを別に持たないのが特徴です。'},
  {tbl:[['方式','押し出す力','指示圧力計','代表例'],
        ['蓄圧式','あらかじめ充てんした窒素','あり（CO₂・ハロン除く）','粉末、強化液、機械泡'],
        ['加圧式','内蔵ボンベのガス','なし','粉末（業務用に多い）'],
        ['反応式','化学反応で発生するCO₂','なし','化学泡']]},
  {h:'分解するときの鉄則'},
  {p:'内圧が残ったままキャップを緩めると、キャップや内部部品が高圧で飛び出します。実際に死亡事故が起きています。排圧栓があるものは排圧栓を開き、ないものは容器を逆さにしてレバーを握るなどして、必ず完全に圧を抜いてから分解します。試験でも実務でも最重要事項です。'}
 ], q:['O606','O620','O621']},

{id:'L604', t:'能力単位と、必要な消火器の本数',
 b:[
  {p:'乙6で唯一の計算らしい計算です。毎回出ます。考え方は「その建物には消火能力がいくつ必要か」を面積から出し、それを満たすように本数を決める、という2段構えです。'},
  {h:'基本の式'},
  {p:'必要能力単位 ＝ 延べ面積 ÷ 算定基準面積'},
  {h:'算定基準面積は用途の危険度で3段階'},
  {tbl:[['基準面積','用途の例','考え方'],
        ['50㎡','劇場、映画館、キャバレー、地下街','不特定多数・避難困難'],
        ['100㎡','飲食店、百貨店、旅館、病院、共同住宅、工場','中間'],
        ['200㎡','学校、図書館、神社仏閣、事務所','在館者が特定・出火リスク低']]},
  {p:'危険なところほど基準面積が小さく、必要な単位数が多くなります。理屈は素直です。'},
  {h:'内装制限による2倍緩和'},
  {p:'主要構造部が耐火構造で、かつ壁と天井の室内に面する部分の仕上げが難燃材料なら、算定基準面積を2倍にできます。燃え広がりにくい建物なので消火器は半分で済む、という発想です。'},
  {h:'計算例'},
  {p:'延べ面積1,200㎡の飲食店（耐火構造・難燃内装）の場合。基準面積100㎡が2倍で200㎡になるので、1,200 ÷ 200 ＝ 6単位。ABC粉末10型がA-3程度なので、6 ÷ 3 ＝ 2本という流れで本数が決まります。'},
  {h:'付加設置（本体の算定とは別枠）'},
  {tbl:[['場所','必要なもの'],
        ['電気設備がある場所','床面積100㎡以下ごとに1個（電気火災適応のもの）'],
        ['多量の火気を使用する場所','床面積 ÷ 25 の能力単位'],
        ['少量危険物','貯蔵量 ÷ 指定数量 の能力単位'],
        ['指定可燃物','貯蔵量 ÷（危険物政令別表の数量×50）の能力単位']]},
  {p:'付加設置は本体の算定に足し算します。「合計で計算する」のではなく「別に上乗せする」点が引っかけどころです。なお電気設備の場合だけ「能力単位」ではなく「個数」で数える点にも注意してください。'},
  {h:'大型消火器の基準'},
  {p:'A火災10単位以上、またはB火災20単位以上のものが大型消火器です。「または」であって「かつ」ではありません。'},
  {tbl:[['消火器','薬剤量'],
        ['水','80L以上'],['強化液','60L以上'],['機械泡','20L以上'],['化学泡','80L以上'],
        ['二酸化炭素','50kg以上'],['ハロゲン化物','30kg以上'],['粉末','20kg以上']]},
  {p:'ハロゲン化物の30kgだけが他と揃わないので、ここが狙われます。'}
 ], q:['O603','O604','O605','O709']},

{id:'L605', t:'設置の基準',
 b:[
  {p:'本数が決まったら、次はどこに置くかです。数値が3つ出てきますが、いずれも「いざというとき手が届くか」という発想から出ています。'},
  {tbl:[['項目','基準'],
        ['歩行距離（一般の消火器）','各部分から一の消火器まで20m以下'],
        ['歩行距離（大型消火器）','各部分から一の消火器まで30m以下'],
        ['設置高さ','床面から1.5m以下'],
        ['標識','「消火器」と表示。地色は赤、文字は白、長辺24cm以上×短辺8cm以上']]},
  {svg:'hokou', cap:'歩行距離と水平距離の違い'},
  {h:'よくある取り違え'},
  {p:'第一に、水平距離ではなく歩行距離です。壁を突き抜けた直線距離ではなく、実際に歩く経路の長さで測ります。屋内消火栓が水平距離25mなのと対照的で、ここを入れ替えた選択肢が定番です。'},
  {p:'第二に、大型のほうが距離が長い（30m）ことです。大型は数を減らせるぶん、遠くまでカバーしてよいと考えれば取り違えません。'},
  {p:'第三に、高さは「1.5m以下」で、上限だけが決まっています。下限はないので床置きでも構いません。'},
  {h:'設置してはならない場所'},
  {p:'二酸化炭素消火器とハロゲン化物消火器は、地下街、準地下街、および換気について有効な開口部の面積が床面積の1/30以下で、かつ床面積20㎡以下の地階・無窓階・居室には設置できません。窒息作用で消すため、人がいる密閉空間で放射すると酸欠を起こすからです。'},
  {p:'「1/30以下」と「20㎡以下」の両方を満たす場所が対象です。なおハロン1301消火器はこの制限から除外されており、設置できます。'}
 ], q:['O601','O602','O609','O703']},

{id:'L606', t:'点検の周期と、抜取り方式',
 b:[
  {p:'現場で最も使う知識であり、試験でも数値がそのまま問われます。3つの点検を区別してください。'},
  {h:'1. 外形点検'},
  {p:'6か月ごとの機器点検で、設置されているすべての消火器について外観を目視で確認します。変形・損傷・腐食、指示圧力計の指示値、安全栓の封、標識の有無などを見ます。'},
  {h:'2. 内部及び機能の点検'},
  {p:'消火器を分解して中を確認します。開始時期が消火器の種類で分かれます。'},
  {tbl:[['種類','開始時期','抜取りで全数を確認し終える年数'],
        ['加圧式（化学泡を除く）','製造年から3年経過','5年'],
        ['蓄圧式','製造年から5年経過','10年'],
        ['化学泡','設置後1年経過ごと（全数）','—']]},
  {p:'「加圧3年・蓄圧5年・化学泡1年」を3点セットで覚えます。加圧式が早いのは、内蔵ボンベや粉末の固化など、内部で起きる不具合が多いためです。'},
  {svg:'tenken',cap:'点検の周期と対象のまとめ'},
  {h:'抜取り方式の考え方'},
  {p:'対象が多数あるとき、同一メーカー・同一種類・同一製造年でロットを組み、その中から試料を抜き取って点検します。加圧式は5年、蓄圧式は10年でロット全数の確認が終わるように試料数を決めます。'},
  {h:'確認試料と、放射試験の試料数'},
  {tbl:[['消火器の種類','点検開始','確認試料','放射試験の試料'],
        ['蓄圧式','製造年から5年','抜取り方式','抜き取り数の50％以上'],
        ['加圧式の粉末','製造年から3年','抜取り方式','抜き取り数の50％以上'],
        ['加圧式の粉末以外','製造年から3年','全数','全数の10％以上'],
        ['化学泡','設置後1年ごと','全数','全数の10％以上']]},
  {p:'抜取り方式なら50％以上、全数確認なら10％以上。この2つの数値を入れ替えた選択肢が出ます。抜き取る時点ですでに絞り込んでいるので、そのうちの半分を放射する、と理解すると取り違えません。'},
  {h:'3. 耐圧性能に関する点検（水圧検査）'},
  {p:'製造年から10年を経過した消火器について実施し、以後は3年ごとに行います。所定の水圧を5分間かけ、漏れや変形がないかを確認します。ホースも同様に、製造から10年経過後は3年ごとです。'},
  {h:'報告の周期（法令共通と重なる部分）'},
  {p:'点検そのものは機器点検6か月・総合点検1年ですが、消防機関への報告は特定防火対象物が1年に1回、非特定防火対象物が3年に1回です。「点検の周期」と「報告の周期」を混ぜた選択肢が頻出します。'}
 ], q:['O614','O615','O616','O627','O634','O633']},

{id:'L607', t:'部品の規格',
 b:[
  {p:'規格省令からの出題です。数値が細かいですが、出るところは限られています。'},
  {h:'安全栓'},
  {svg:'anzensen', cap:'安全栓の構造と引き抜き方向'},
  {p:'内径2cm以上のリング部、軸部および軸受部で構成されます。ミリではなくセンチで、指が入る大きさです。リング部の塗色は黄色、材質はステンレス鋼（SUS304）またはこれと同等以上の耐食性・耐候性を持つもの。'},
  {p:'装着は上方向で、消火器を水平面上に置いたとき垂直軸から30度以内の範囲に引き抜く向きとします。1動作で容易に引き抜け、引き抜きに支障のない封が施されていること、衝撃やレバーの強い握りでも引き抜きに支障を生じないこと、引き抜く動作以外では容易に抜けないことも要件です。ただし手動ポンプ式水消火器と転倒式化学泡消火器のように、その動作をしないと作動しないものには設けなくて構いません。'},
  {h:'ホース'},
  {p:'原則すべての消火器に必要ですが、例外が2つあります。薬剤量1kg以下の粉末消火器と、薬剤量4kg未満のハロゲン化物消火器です。二酸化炭素消火器はすべてホースが必要で、ここを入れ替えた選択肢が定番です。'},
  {h:'使用済み表示装置'},
  {p:'一度使うと元に戻らない表示で、使いかけの消火器を見分けるためのものです。指示圧力計のある蓄圧式、バルブのないもの、手動ポンプ式水消火器、化学泡消火器には不要です。蓄圧式は圧力計を見れば使用済みとわかり、化学泡は転倒させれば明らかだからです。'},
  {h:'運搬方式と保持装置'},
  {tbl:[['質量','運搬方式'],
        ['28kg以下','手さげ式・据置式・背負式'],
        ['28kg超 35kg以下','据置式・背負式・車載式'],
        ['35kg超','車載式']]},
  {p:'28kgを境に手さげ式が使えなくなり、35kgを境に車載式だけになる、という2段階です。間の帯に据置式・背負式が残るので、「28kgを超えたらすべて車載式」は誤りになります。'},
  {p:'保持装置はこれとは別の規定です。手さげ式消火器（自動車用を除く）に原則として設けますが、鉛直に置くことができるものは不要とされており、現在販売されているほとんどの消火器が該当します。'},
  {h:'塗色'},
  {tbl:[['対象','塗色'],
        ['消火器一般','外面の表面積の25％以上を赤色'],
        ['二酸化炭素消火器の容器','表面積の1/2以上を緑色（高圧ガス保安法）'],
        ['ハロン1301の容器','ねずみ色（高圧ガス保安法）']]},
  {p:'二酸化炭素消火器は、緑色1/2以上を確保したうえで、残りの部分で赤色25％以上も満たす必要があります。両方の法令がかかっているためです。'},
  {h:'指示圧力計'},
  {p:'使用圧力範囲0.7〜0.98MPaが緑色で表示されます。緑より下を指していれば薬剤やガスの漏れ、使用後の可能性。緑より上なら充てん過多や高温環境が疑われます。いずれも整備が必要です。'}
 ], q:['O610','O611','O612','O613','O617','O629','O702','O705','O706','O707','O708','O710']},

{id:'L608', t:'法令共通の骨格（甲4・甲1でもそのまま使えます）',
 b:[
  {p:'ここは全類で共通に出題される部分です。乙6のために覚えたものが、そのまま甲4・甲1でも得点になります。投資効率が最も高い単元です。'},
  {h:'免状まわり'},
  {tbl:[['手続き','いつ','どこへ'],
        ['書換え','記載事項の変更時、写真が10年経過したとき','居住地・勤務地・交付地のいずれかの知事'],
        ['再交付','亡失・滅失・汚損・破損したとき','交付または書換えをした知事'],
        ['亡失した免状を発見','発見から10日以内','再交付を受けた知事に提出']]},
  {p:'住所や勤務先は免状の記載事項ではないので、変わっても書換えは不要です。免状は全国で有効で、有効期限による失効もありません。'},
  {h:'講習'},
  {p:'免状交付を受けた日以後における最初の4月1日から2年以内に初回、その後は講習を受けた日以後における最初の4月1日から5年以内ごとに受講します。起算日が「交付日」ではなく「その後の最初の4月1日」である点が引っかけどころです。業務に従事していなくても義務があります。'},
  {h:'届出の2種類（混同注意）'},
  {tbl:[['届出','誰が','いつ','どこへ'],
        ['着工届','甲種消防設備士','着手しようとする日の10日前まで','消防長または消防署長'],
        ['設置届','関係者','工事完了後4日以内','消防長または消防署長']]},
  {p:'届出義務者が違います。着工届は消防設備士本人、設置届は所有者などの関係者です。乙種消防設備士は工事ができないので、着工届も出しません。'},
  {h:'特定防火対象物とは'},
  {p:'不特定多数が出入りする、または避難が困難な人が利用する用途です。劇場・映画館、キャバレー、飲食店、百貨店、旅館・ホテル、病院・福祉施設、地下街などが該当します。学校、共同住宅、事務所、図書館は非特定です。この区分は点検報告の周期、防火管理者の要否、既存不遡及の例外など、多くの規定の分かれ目になります。'},
  {h:'既存不遡及とその例外'},
  {p:'基準が改正されても既存の建物は従前の基準でよい、というのが原則です。ただし消火器、避難器具、簡易消火用具、自動火災報知設備（特定用途）、ガス漏れ火災警報設備、漏電火災警報器、非常警報器具・設備、誘導灯・誘導標識は常に改正後の基準に適合させる必要があります。消火器が含まれているのは乙6で重要です。また、特定防火対象物なら設備の種類を問わず遡及します。'},
  {h:'検定制度'},
  {p:'型式承認は総務大臣が行い、型式適合検定は日本消防検定協会等が行います。消火器と消火器用消火薬剤はいずれも検定対象品目です。検定合格表示のないものは販売・陳列・工事への使用ができません。'}
 ], q:['CM01','CM02','CM03','CM04','CM05','CM06','CM07','CM08','CM09','CM10','CM11','CM12','CM13','CM14','CM15','CM16','CM17','CM18']},

{id:'L609', t:'指示圧力計とブルドン管',
 b:[
  {p:'蓄圧式消火器に付いている丸い圧力計です。中身の仕組みと、文字盤に書かれている記号の意味が問われます。'},
  {h:'ブルドン管の仕組み'},
  {svg:'bourdon', cap:'ブルドン管と指示圧力計の仕組み'},
  {p:'指示圧力計はブルドン管式です。断面が偏平な金属管をうず巻き状にしたもので、開口固定端から圧力を導入すると、圧力に応じて管の曲率が変化し、管先の密閉自由端が変位します。この変位量が管の弾性により圧力に比例するため、指針で圧力を読み取れます。ブルドンは考案したフランス人の名前です。'},
  {h:'文字盤に表示されているもの'},
  {tbl:[['表示','内容'],
        ['緑色の範囲','使用圧力範囲 0.7〜0.98MPa'],
        ['「消」の記号','消火器用であることを示す'],
        ['材質記号','圧力検出部（ブルドン管）の材質'],
        ['×10⁻¹MPa','目盛の単位']]},
  {h:'材質記号と、消火器ごとの使い分け'},
  {tbl:[['消火器の種類','使用できる材質'],
        ['水（浸潤剤入り）消火器','SUS（ステンレス鋼）のみ'],
        ['強化液消火器','SUS（ステンレス鋼）のみ'],
        ['機械泡消火器','SUS（ステンレス鋼）のみ'],
        ['粉末消火器','Bs、BeCu、PB、SUS']]},
  {p:'水系の3つがSUSに限られるのは、ステンレス鋼以外の銅合金では薬剤によって腐食するおそれがあるためです。粉末にはその心配がないので、4種類すべて使えます。「強化液にBs」という組合せが誤りの選択肢として頻出します。'},
  {h:'材質記号の由来'},
  {tbl:[['記号','材質','由来'],
        ['SUS','ステンレス鋼','Steel Special Use Stainless'],
        ['Bs','黄銅（真ちゅう）','Brass'],
        ['BeCu','ベリリウム銅','ベリリウムと銅の元素記号'],
        ['PB','りん青銅','Phosphor Bronze']]},
  {p:'PBを「鉛」と取り違えさせる選択肢が出ます。りん青銅は青銅（銅と錫の合金）にりんをわずかに含ませたものです。'}
 ], q:['O635','O636','O637','O638','O639','O681']},

{id:'L610', t:'加圧用ガス容器',
 b:[
  {p:'加圧式消火器の中に入っている小さなボンベです。内容積100cm³を境にして扱いが変わる、というのがこの単元の軸になります。'},
  {h:'100cm³を境に何が変わるか'},
  {tbl:[['項目','100cm³以下','100cm³超'],
        ['高圧ガス保安法','適用を受けない','適用を受ける'],
        ['容器弁','ないものが一般的','作動封板付きと容器弁付きがある'],
        ['外面','一般に亜鉛メッキ','表面積の1/2以上を緑色またはねずみ色に塗装'],
        ['充てん量の確認','総質量を測定','内圧を測定（窒素ガスのみ）']]},
  {p:'充てん量の確認方法が分かれる理由は、液化炭酸ガスが液体で貯蔵されているためです。液体のままでは圧力を見ても量が分からないので、質量で確認します。'},
  {h:'作動封板付きと容器弁付き'},
  {p:'作動封板を有するものは、レバーを握るとカッターが封板を破って作動します。一度使うと再使用できないため、加圧用ガス容器や消火器銘板に表示されている同じ容器記号のものと取り替えます。'},
  {p:'容器弁付きのものは、使用後も容器を再使用できます。ただし高圧ガス保安法の適用を受けるため、専門業者にガスの再充てんを依頼しなければならず、自ら充てんしてはなりません。'},
  {h:'充てんガスは3種類'},
  {p:'液化炭酸ガス（二酸化炭素）、窒素ガス、両者の混合ガスの3種類です。一般に小容量のものは液化炭酸ガス、大容量のものは窒素ガスが使われる傾向にありますが、メーカーによって異なることも多くあります。「小容量に窒素、大容量に二酸化炭素」と入れ替えた選択肢が定番です。'},
  {h:'容器記号'},
  {p:'加圧用ガス容器は容器記号ごとに形状・ねじ・ガス質量が異なります。たとえばC60なら、ねじの種類が「C」で、充てんされているガス質量が60gという意味です。容器本体に刻印されているほか、消火器銘板にも表示されているものがあります。交換の際は、同じ容器記号であることを必ず確認します。'}
 ], q:['O640','O641','O642','O643','O644','O645','O676']},

{id:'L611', t:'高圧ガス保安法と容器弁',
 b:[
  {p:'消火器のうち一部のものは、消防法に加えて高圧ガス保安法の規制も受けます。どれが該当するか、そのとき何が変わるかを押さえます。'},
  {h:'高圧ガスの定義'},
  {p:'圧縮ガスの場合、温度35℃において圧力1MPa以上のものが高圧ガスです。蓄圧式の水・強化液・機械泡・粉末は使用圧力の上限が0.98MPaに設定されており、35℃ではこれよりやや低くなるため、高圧ガス保安法は適用されません。0.98MPaという中途半端な数値は、この1MPaをわずかに下回るよう決められたものです。'},
  {h:'適用を受けるもの'},
  {tbl:[['区分','該当するもの'],
        ['消火器','二酸化炭素消火器、ハロン1301消火器、ハロン1211消火器'],
        ['加圧用ガス容器','内容積が100cm³を超えるもの']]},
  {h:'塗色'},
  {tbl:[['対象','塗色（表面積の1/2以上）'],
        ['二酸化炭素消火器','緑色'],
        ['ハロン1301・1211消火器','ねずみ色'],
        ['液化炭酸ガスの加圧用ガス容器','緑色'],
        ['窒素ガス（混合ガスを含む）の加圧用ガス容器','ねずみ色']]},
  {p:'二酸化炭素消火器は、この緑色1/2以上に加えて、消防法による赤色1/4以上も満たす必要があります。2つの法令が同時にかかっているためです。'},
  {h:'刻印されている記号'},
  {tbl:[['記号','意味','単位'],
        ['W','附属品を含まない容器の質量（Weight）','kg'],
        ['V','内容積（Volume）','L'],
        ['TP','耐圧試験における圧力（Test Pressure）','MPa'],
        ['FP','最高充てん圧力（Filling Pressure）','MPa']]},
  {p:'末尾のMはメガを表します（例：TP24.5M、FP11.5M）。充てんガス量を表す記号はありません。TPとFPの取り違えが定番の引っかけです。'},
  {h:'容器弁'},
  {p:'高圧ガス保安法の適用を受ける蓄圧式の消火器および加圧用ガス容器（作動封板を設けたものを除く）には、容器弁を設けなければなりません。'},
  {tbl:[['種類','操作','使われる例'],
        ['ハンドル車式','ハンドルを回すと弁が開く','車載式二酸化炭素消火器、車載式粉末消火器の加圧用ガス容器'],
        ['ハンドル車式以外','レバーを握ると弁が開く','手さげ式の二酸化炭素消火器']]},
  {h:'安全弁の3種類'},
  {tbl:[['種類','作動条件'],
        ['封板式','一定の圧力以上で作動'],
        ['溶栓式','一定の温度以上で作動'],
        ['封板溶栓式','一定の圧力及び温度以上で作動']]},
  {svg:'anzenben',cap:'安全弁の3種類と作動条件'},
  {p:'容器弁には必ず安全弁が必要です。何らかの原因で容器内の圧力が規定値以上に達したとき、自動的にバルブを開いて圧力を外部に排出します。'}
 ], q:['O646','O647','O648','O649','O650','O651','O652','O682','O786','O787','O788']},

{id:'L612', t:'消火器別の構造① 水・強化液・泡',
 b:[
  {p:'ここからは消火器を1つずつ見ていきます。まず水系の3つです。'},
  {h:'強化液消火器'},
  {tbl:[['項目','内容'],
        ['薬剤','無色半透明または淡黄色の、高濃度の炭酸カリウム水溶液'],
        ['性質','強アルカリ性（pH約12）'],
        ['使用温度範囲','−20℃〜+40℃（寒冷地に適する）'],
        ['消火作用','冷却作用＋負触媒効果による抑制作用、再燃防止'],
        ['構造','蓄圧式。指示圧力計あり、レバー式開閉バルブ、霧状ノズル']]},
  {p:'「炭酸ナトリウム」に置き換えた選択肢が定番の引っかけです。カリウムとナトリウムを混同しないでください。'},
  {h:'本体容器の材質'},
  {p:'規格省令により各種の鋼板を使用するよう定められており、鋳鉄が使われることはありません。鋳鉄は鋼に比べて耐摩耗性に優れますが、一般に衝撃に弱いためです。「本体容器は鋳鉄製である」は誤りの選択肢として頻出します。'},
  {h:'化学泡消火器'},
  {svg:'kagakuawa', cap:'化学泡消火器（転倒式）の断面'},
  {tbl:[['項目','内容'],
        ['薬剤','外筒A剤＝炭酸水素ナトリウム（アルカリ性）／内筒B剤＝硫酸アルミニウム（酸性）'],
        ['発泡原理','2剤の化学反応で二酸化炭素を含む泡を発生'],
        ['使用温度範囲','5℃〜40℃（低温で反応が鈍化するため寒冷地に不適）'],
        ['放射方式','転倒式、破がい転倒式、開がい転倒式の3種類'],
        ['泡の膨張率','7倍以上（大型消火器以外、20℃・標準発泡ノズル）'],
        ['特有の構造','本体容器内面に液面表示、ノズル開口部にろ過網']]},
  {h:'3つの放射方式'},
  {tbl:[['方式','操作','安全栓にあたるもの'],
        ['転倒式','ひっくり返すだけで内筒のふたが落下する','なし（動作により作動するため不要）'],
        ['破がい転倒式','キャップの押し金具を押し、内筒を密封している鉛封板を破ってから転倒する','押し金具にかぶせる安全キャップ'],
        ['開がい転倒式','キャップのハンドルを回して内筒ふたを開いてから転倒する。大型消火器に多い','回転止めハンドル']]},
  {p:'実技試験の記述式では、「破蓋」「開蓋」をそれぞれ「破がい」「開がい」と書いて構いません。'},
  {p:'なお、誤ってB剤（硫酸アルミニウム）を外筒に入れると、鋼製の本体容器が腐食します。酸性の薬剤だからです。A剤とB剤を入れる場所を取り違えないこと、という注意はここから来ています。'},
  {p:'液面表示とろ過網は化学泡だけの特徴です。液面表示は外筒・内筒それぞれに規定量の薬剤水溶液を入れる必要があるため、ろ過網は薬剤のかたまりがノズルを詰まらせるのを防ぐためにあります。'},
  {h:'機械泡消火器'},
  {svg:'happou', cap:'発泡ノズルの仕組み'},
  {p:'消火剤は水成膜や界面活性剤の水溶液です。発泡ノズルの根元に空気吸入孔があり、消火剤がノズルを通るときに空気を吸い込んで泡を作ります。'},
  {tbl:[['項目','内容'],
        ['発泡原理','泡が立ちやすい水溶液を放射する際、ノズルで空気を混入して発泡'],
        ['ノズル','専用の発泡ノズル。外部の空気を取り入れる空気吸入口がある'],
        ['使用温度範囲','規格上は0℃以上40℃以下。低温用は下限−10℃または−20℃まで'],
        ['構造','蓄圧式。指示圧力計あり']]},
  {p:'化学泡が化学反応で泡を作るのに対し、機械泡は物理的に空気を混ぜて泡立てます。発生機構がまったく異なるため、薬剤を共用することはできません。'},
  {h:'泡消火器に共通する点'},
  {p:'消火作用は、泡が燃焼面に付着することによる窒息作用および冷却作用です。したがって普通火災と油火災に適応しますが、泡は電気を通し感電の危険があるため、化学泡・機械泡とも電気火災には適応しません。'},
  {h:'泡消火薬剤の種類'},
  {tbl:[['薬剤','特徴'],
        ['化学泡','2種類の溶液の化学反応で発泡'],
        ['合成界面活性剤泡','合成洗剤に類似した界面活性剤。長期安定性を有する'],
        ['水成膜泡','ふっ素系界面活性剤が主成分。表面張力が極めて小さく、油面に水成膜のフィルムを形成']]},
  {p:'水成膜泡は、過去の製品にPFOSと呼ばれる化学物質が含まれるものがあり、取扱いに注意が必要です。'}
 ], q:['O653','O654','O655','O656','O657','O658','O659','O660','O661','O662','O663','O701','O704','O790','O630','O632']},

{id:'L613', t:'消火器別の構造② 二酸化炭素・粉末',
 b:[
  {h:'二酸化炭素消火器'},
  {svg:'co2', cap:'二酸化炭素消火器の断面'},
  {p:'外見上の特徴は2つ。本体が緑色であることと、ノズルに相当する大きなホーンが付いていることです。鑑別ではこの2点で一発で判別できます。'},
  {p:'ホーンに握りが付いているのは、二酸化炭素が気化するときに周囲から熱を奪い、ホーンが著しく低温になるためです。凍傷を防ぐために、必ずホーン握りを持って操作します。'},
  {p:'開閉バルブは高圧ガス保安法の適用を受けるため「容器弁」と呼ばれ、異常昇圧時にガスを放出する安全弁が設けられています。'},
  {tbl:[['項目','内容'],
        ['適応火災','B火災・C火災（A火災には適応しない）'],
        ['消火作用','窒息作用'],
        ['構造','蓄圧式。指示圧力計はなし。容器弁に安全弁を設ける'],
        ['塗色','表面積の1/4以上を赤色、1/2以上を緑色'],
        ['使用温度範囲','−30℃〜40℃'],
        ['充てん量の確認','はかりで総質量を測定して算出']]},
  {p:'指示圧力計がないのは、充てん圧力が指示圧力計の許容最大値より高いためです。充てん量を圧力計で測れないのは、二酸化炭素が液体の状態で充てんされているからで、液体のままでは圧力に量が反映されません。'},
  {p:'なお二酸化炭素CO₂は安定した分子で、火炎に接しても熱分解しません。「熱分解して有毒な一酸化炭素が発生する」は誤りの選択肢です。危険なのは酸素濃度の低下による窒息のほうで、だからこそ地下街・準地下街・密閉した狭い地階・無窓階等では使用してはならず、消火後は速やかに換気をはかります。'},
  {p:'温度が低下すると内部圧力も比例して低下し、放射時の勢いが弱くなります。−40℃の冷凍倉庫は使用温度範囲外です。'},
  {h:'粉末消火器 ── 薬剤の4種類'},
  {tbl:[['記号','主成分','適応火災','色'],
        ['粉末（ABC）','りん酸二水素アンモニウム NH₄H₂PO₄','A・B・C','淡紅色'],
        ['粉末（Na）','炭酸水素ナトリウム NaHCO₃','B・C','白色'],
        ['粉末（K）','炭酸水素カリウム KHCO₃','B・C','紫色'],
        ['粉末（KU）','炭酸水素カリウムと尿素 CO(NH₂)₂ の反応物','B・C','ねずみ色']]},
  {p:'炭酸水素塩類を使ったものはすべてB・Cのみで、A火災にも適応するのはりん酸塩類の粉末（ABC）だけです。粉末（KU）の主成分を「水酸化カリウム」に置き換えた選択肢が出ます。炭酸水素カリウムです。'},
  {svg:'funmatsu',cap:'粉末消火薬剤の4種類と着色'},
  {h:'蓄圧式と加圧式の違い'},
  {tbl:[['項目','蓄圧式','加圧式'],
        ['放射圧力源','あらかじめ充てんした窒素ガス','内蔵する加圧用ガス容器'],
        ['使用圧力範囲','0.7〜0.98MPa','（常時は無圧）'],
        ['指示圧力計','あり','なし'],
        ['粉上り防止用封板','なし','サイホン管の先端にあり'],
        ['放射の停止','開閉バルブで可能なものがある','開閉バルブ式と開放式がある']]},
  {p:'蓄圧式に粉上り防止用封板がないのは、開閉バルブで外気と遮断されているため、サイホン管内で粉末が詰まることがないからです。蓄圧式のサイホン管の先端には何も取り付けられていません。この違いは繰り返し出題されます。'},
  {p:'放射圧力源に二酸化炭素ではなく窒素を使うのは、どちらも不燃性ですが二酸化炭素は人体に有害なためです。'},
  {h:'加圧式粉末消火器の動作'},
  {p:'レバーを握ると、カッターが加圧用ガス容器の作動封板を破り、ガスが導入管を通って本体容器内に導入されます。粉末消火剤はガスによって撹拌・加圧され、サイホン管の先にある粉上り防止用封板を破り、サイホン管およびホースを通ってノズルから放射されます。'},
  {h:'使用温度範囲のまとめ（横断）'},
  {p:'規格省令が定めるのは「化学泡5〜40℃、その他0〜40℃」の2区分だけで、10℃単位で広げられます。実際の製品はその分だけ下限が低く、消火器ごとに違います。'},
  {tbl:[['消火器','使用温度範囲（製品）'],
        ['水消火器','0℃ 〜 +40℃'],
        ['化学泡消火器','+5℃ 〜 +40℃'],
        ['強化液消火器','−20℃ 〜 +40℃'],
        ['機械泡消火器','−20℃ 〜 +40℃'],
        ['粉末消火器（ガス加圧式）','−20℃ 〜 +40℃'],
        ['粉末消火器（蓄圧式）','−30℃ 〜 +40℃'],
        ['二酸化炭素消火器','−30℃ 〜 +40℃'],
        ['ハロン1301消火器','−30℃ 〜 +40℃']]},
  {p:'同じ粉末でも、蓄圧式が−30℃、ガス加圧式が−20℃と下限が違います。ここを入れ替えた選択肢が出るので、加圧方式まで見てください。下限が0℃以上なのは水消火器と化学泡消火器の2つだけです。'},
  {h:'色のまとめ（横断）'},
  {p:'色は鑑別でも筆記でも問われます。規定があるものと、ないものを区別してください。'},
  {tbl:[['対象','色'],
        ['粉末（ABC）／（Na）／（K）／（KU）','淡紅色／白色／紫色／ねずみ色'],
        ['消火器の外面','表面積の25％以上を赤色'],
        ['二酸化炭素消火器','さらに表面積の1／2以上を緑色'],
        ['ハロン1301消火器','さらに表面積の1／2以上をねずみ色'],
        ['加圧用ガス容器（液化炭酸ガス／窒素）','緑色／ねずみ色（いずれも1／2以上）'],
        ['絵表示の地色（A／B／C火災）','白／黄／青'],
        ['安全栓のリング部','黄色'],
        ['標識（地／文字）','赤／白'],
        ['指示圧力計の使用圧力範囲','緑色（0.7〜0.98MPa）'],
        ['強化液消火薬剤','無色半透明または淡黄色']]},
  {p:'逆に、化学泡のA剤・B剤には色の規定がありません。「A剤は褐色」などとする記述を見かけたら誤りです。'},
  {p:'加圧用ガス容器は通常は本体容器の内部にありますが、大型消火器で容量の大きいものは外部に取り付けられています。加圧用ガスは主として二酸化炭素ですが、大容量のものには窒素ガスが用いられます。大型消火器では、二酸化炭素加圧のものは押し金具を押して封板を破り、窒素ガス加圧のものはガス容器のハンドルを回してバルブを開きます。'}
 ], q:['O664','O665','O666','O667','O668','O669','O670','O671','O672','O673','O674','O675','O628','O791','O792']},

{id:'L614', t:'放射の異常から原因を特定する',
 b:[
  {p:'鑑別でよく出る形式です。「こういう症状が出た、原因は何か」を問われます。構造が分かっていれば消去法で絞れるので、暗記ではなく仕組みから考えてください。'},

  {svg:'atsuryoku', cap:'指針の位置が示す3つの状態'},

 ], q:['O677','O678','O679','O680','O629']},

{id:'L615', t:'機械に関する基礎知識',
 b:[
  {p:'乙6の筆記30問のうち5問がここから出ます。数は少ないのですが、科目ごとに40％の足切りがあるため、5問中2問は取らないと他が満点でも不合格になります。逆に言えば、この単元は2問取れれば用が足ります。深入りは不要です。'},
  {h:'力'},
  {p:'力の三要素は、大きさ・方向・作用点。大きさと方向を同時に持つ量をベクトル量といい、力はその代表です。複数の力を合成したものが合力、荷重に対してつり合う力が反力。'},
  {p:'力のモーメント（トルク）は M＝F×L。Lは回転軸から力の作用線までの垂直距離です。スパナの柄が長いほど小さな力でボルトが回せるのは、Lが大きくなるからです。'},
  {h:'運動の3法則'},
  {tbl:[['法則','内容'],
        ['慣性の法則（第1法則）','外部から力が働かない限り、現在の状態を保つ'],
        ['運動の法則（第2法則）','力を加えると加速度が生じる。F＝ma'],
        ['作用・反作用の法則（第3法則）','力を加えると、それを打ち消す同じ大きさの力が生じる']]},
  {p:'仕事＝力×移動距離（単位J）、仕事率（動力）＝仕事÷時間（単位W）。JとWの取り違えが出ます。'},
  {h:'荷重と応力'},
  {tbl:[['荷重','向き'],
        ['引張荷重','引き伸ばす'],
        ['圧縮荷重','押し縮める'],
        ['せん断荷重','断面に沿ってずらす'],
        ['曲げ荷重','曲げる'],
        ['ねじり荷重','軸まわりにねじる']]},
  {p:'かかり方では、静かにかかり続けるものを静荷重、衝撃や繰り返しを伴うものを動荷重といいます。応力は単位面積あたりの力で、単位はN/mm²（＝MPa）。ひずみは変形量を元の長さで割った比なので、単位はありません。'},
  {h:'応力ひずみ線図'},
  {p:'応力を増やしていくと、比例限度 → 弾性限度 → 降伏点 → 引張強さ の順に現れます。比例限度までは応力とひずみが比例し（フックの法則）、弾性限度までなら力を取り去れば元に戻ります。これを超えると永久ひずみが残り、降伏点では応力が増えないのにひずみだけが急増します。引張強さは線図上の最大応力です。'},
  {p:'安全率＝基準強さ÷許容応力。安全率を大きくとるほど許容応力は小さくなり、設計は安全側に振れます。'},
  {h:'金属材料'},
  {tbl:[['合金','成分'],
        ['炭素鋼','鉄＋炭素（約0.02〜2％）'],
        ['鋳鉄','鉄＋炭素（約2％以上）'],
        ['ステンレス鋼・耐熱鋼','炭素鋼＋ニッケル＋クロム'],
        ['黄銅（真ちゅう）','銅＋亜鉛'],
        ['青銅','銅＋すず']]},
  {p:'黄銅と青銅の取り違えが頻出です。「黄銅は亜鉛、青銅はすず」。炭素が増えるほど硬くなり、同時にもろくなります。消火器の本体容器に鋳鉄が使われないのはこのためです。'},
  {h:'熱処理'},
  {tbl:[['処理','操作','目的'],
        ['焼入れ','高温に加熱した後で急冷却','硬度を増す'],
        ['焼戻し','再加熱後に徐々に冷却','粘りを増す'],
        ['焼なまし','一定時間加熱後に徐々に冷却','軟らかくする'],
        ['焼ならし','加熱後に自然冷却','組織を均一にならす']]},
  {p:'急冷するのは焼入れだけです。残りの3つは徐冷か自然冷却なので、まず「急冷＝焼入れ」を固定し、焼入れで硬くなりすぎてもろくなったものを焼戻しで粘らせる、という流れで覚えます。'},
  {h:'加速度'},
  {p:'速度は単位時間あたりの移動距離で v＝S/t（m/s）。加速度は単位時間あたりの速度の変化量で α＝(v₁−v₀)/t（m/s²）。単位が m/s と m/s² で違う点がそのまま問われます。'},
  {p:'加速度が一定の運動を等加速度運動、そのうち重力で落下するものを自由落下運動といい、このとき加速度は重力加速度 g≒9.8m/s² になります。運動の法則 F＝ma から α＝F/m も出せます。'},
  {h:'ねじ・はり・気体'},
  {p:'ピッチは隣り合うねじ山の間隔、リードは1回転で軸方向に進む距離。一条ねじではリード＝ピッチ、二条ねじではリード＝ピッチ×2になります。'},
  {p:'はりは、片持ばり（一端固定・他端自由）、単純ばり（両端を支点で支える）、固定ばり（両端固定）、連続ばり（3つ以上の支点）。同じ荷重なら片持ばりが最もたわみます。'},
  {p:'計算問題もよく出ます。合力、モーメント M＝F×L、応力＝荷重÷断面積、ひずみ＝変形量÷元の長さ、許容応力＝基準強さ÷安全率、仕事率＝仕事÷時間。いずれも式に当てはめるだけなので、式さえ覚えていれば取れます。'},
  {p:'ボイル・シャルルの法則は PV/T＝一定。温度一定ならPV＝一定（ボイル）、圧力一定ならV/T＝一定（シャルル）。消火器の内圧が夏と冬で変わるのも、指示圧力計が高温で緑色範囲を超えるのも、この法則で説明できます。絶対温度はセルシウス温度＋273です。'}
 ], q:['O683','O684','O685','O686','O687','O688','O689','O690','O691','O692','O693','O694','O741','O742','O743','O744','O745','O746','O747','O748','O749','O750','O767','O768','O769','O770','O622','O623','O624','O625','O626']},

{id:'L616', t:'住宅用消火器',
 b:[
  {p:'ここまでは防火対象物に設置する業務用消火器の話でした。一般の住宅に置くものは住宅用消火器と呼ばれ、別の規定が置かれています。考え方の軸は1つで、整備の知識がない人が使うことが前提になっている、という点です。'},
  {h:'規定'},
  {tbl:[['項目','内容'],
        ['加圧方式','蓄圧式のみ'],
        ['再充てん','できない構造とする（再使用不可）'],
        ['適応','普通火災・天ぷら油火災・ストーブ火災に所定の消火性能をもち、かつ電気火災に適応すること'],
        ['操作','1動作で容易かつ確実に放射を開始できること'],
        ['使えない消火剤','ハロゲン化物、液化二酸化炭素'],
        ['部品の固定','キャップ・プラグ・口金・パッキンは溶接等で完全に固定し、取り外せない構造とする'],
        ['放射量','充てんされた消火剤の容量または質量の85％以上'],
        ['能力単位','表示する必要はない']]},
  {p:'1動作の数え方には除外があり、保持装置から取り外す動作、安全栓をはずす動作、ホースをはずす動作は含めません。安全栓やレバー等の操作部分には操作方法を表示します。'},
  {h:'なぜそうなっているか'},
  {p:'再充てんできない構造にするのは、資格を持たない人が自分で薬剤を詰め直すのを防ぐためです。だからキャップ類も外せないよう溶接されています。業務用が「整備して長く使う」前提なのに対し、住宅用は「使い切ったら交換する」前提の製品です。'},
  {p:'ハロゲン化物と液化二酸化炭素が使えないのは、住宅という狭い空間で放射すると酸欠などの危険があるためです。業務用で地下街や無窓階への設置が制限されているのと同じ発想です。'},
  {h:'適応火災の呼び方が違う'},
  {p:'業務用のA火災・B火災・C火災に対し、住宅用は普通火災・天ぷら油火災・ストーブ火災・電気火災という区分になります。住宅で実際に起きる火災に合わせた表現で、絵表示もこの4つで用意されています。試験では呼び方を入れ替えた選択肢が出ます。'},
  {h:'表示事項'},
  {p:'消火器の種別（水・強化液・泡・粉末）、住宅用消火器である旨、使用方法（図示も）、使用温度範囲、適応火災の絵表示、放射時間と放射距離、製造番号・製造年・製造者名・型式番号、消火剤の容量または質量、ホースの有効長（据置式の場合）、取扱い上の注意事項。能力単位がこの中にない点が狙われます。'}
 ], q:['O695','O696','O697','O698','O699','O700']},

{id:'L617', t:'消火器具の種類と、簡易消火用具',
 b:[
  {p:'法令類別で最も手薄になりやすい範囲です。消火器以外にも「消火器具」として認められるものがあり、それぞれに能力単位が割り当てられています。'},
  {h:'消火器具＝消火器＋簡易消火用具'},
  {tbl:[['区分','内訳'],

  {h:'設置に関するその他の基準'},
  {p:'消火剤が凍結したり、変質・噴出するおそれが少ない箇所に設置すること。地震による振動等での転倒を防止する措置を講じること。ただし粉末消火器など、転倒によって消火剤が漏出するおそれのない消火器は転倒防止措置の対象外です。化学泡のように転倒すると作動してしまうものには必要、という理屈で区別できます。'},

  {h:'自動車用消火器'},
  {p:'自動車に設置できるのは、霧状の強化液消火器、機械泡消火器、ハロゲン化物消火器、二酸化炭素消火器、粉末消火器の5つです。水消火器と化学泡消火器は使えず、棒状放射の強化液消火器も設置できません。'}
 ], q:['O711','O712','O713','O714','O715','O716','O717','O718','O603','O604']},

{id:'L618', t:'規格：能力単位の測定・動作数・放射性能',
 b:[
  {p:'第7講で部品の規格をやりました。ここは消火器本体の性能に関する規格です。数値が中心で、理屈が少ないぶん、出題されたら確実に取りたい範囲になります。'},
  {h:'能力単位はどう測るか'},
  {p:'A火災の能力単位は第1消火試験で測ります。杉の角材を組んだ模型を並べて点火し、消火できた模型の数から算定します。'},
  {tbl:[['消火した模型','能力単位'],
        ['第1模型を S 個','S × 2'],
        ['第1模型を S 個 ＋ 第2模型を1個','S × 2 ＋ 1']]},
  {p:'第1模型が3個、第2模型が1個なら 3×2＋1＝7単位。計算問題として出ます。B火災は第2・第3消火試験で、鉄板製の箱に水とガソリンを入れた模型を消火して算定します。'},
  {svg:'mokei',cap:'第1消火試験による能力単位の算定'},
  {h:'操作の機構（動作数）'},
  {tbl:[['消火器の区分','動作数'],

        ['化学泡消火器、据置式、背負式','2動作以内'],
        ['車載式','3動作以内']]},
  {p:'保持装置から取りはずす動作、背負う動作、安全栓をはずす動作、ホースをはずす動作は、この動作数に含めません。住宅用消火器も1動作で、除外される動作の扱いは同じです。'},
  {h:'放射性能'},

        ['放射時間','温度20℃において10秒以上'],
        ['放射距離','消火に有効な放射距離を有すること（具体的数値の定めなし）'],

  {p:'放射量の90％と、化学泡だけ85％。住宅用消火器も85％以上なので、「85％は化学泡と住宅用」とまとめて覚えられます。放射距離だけ数値がない点も問われます。'},
  {h:'使用温度範囲（規格上の値）'},
  {tbl:[['消火器','規格上の使用温度範囲'],
        ['化学泡消火器','5℃以上 40℃以下'],
        ['その他の消火器','0℃以上 40℃以下']]},
  {p:'この範囲は10℃単位で広げることができます。実際に市販されている消火器（化学泡・水消火器を除く）の下限は−20℃または−30℃で、第12講・第13講で扱った数値はこちらです。「規格上の値」を聞かれているのか「実際の製品の値」を聞かれているのかを読み分けてください。'},
  {h:'消火薬剤の規格'},
  {p:'共通的性状として、著しい毒性・腐食性を有しないこと、著しい毒性・腐食性のあるガスを発生しないこと。水溶性・液状のものは結晶の析出や溶液の分離、浮遊物・沈殿物の発生などの異常を生じないこと。粉末状のものは塊状化や変質などの異常を生じないこと。一度使用されたものや、使用されずに収集・廃棄されたものは原料として用いないこと（再利用消火薬剤を除く）。'},
  {tbl:[['薬剤','規格'],
        ['強化液','アルカリ金属塩類の水溶液はアルカリ性反応を呈すること。凝固点は−20℃以下'],
        ['化学泡（粉末状）','水に溶けやすい乾燥状態のものであること'],
        ['機械泡','水に溶けやすく、「飲料水を使用すること」を容器に表示'],

        ['粉末','呼び寸法180マイクロメートル以下。水面に散布して1時間以内に沈降しないこと。りん酸塩類等は淡紅色系に着色'],

  {p:'粉末の180マイクロメートルを「ミリメートル」に置き換えた選択肢、沈降の有無を反転させた選択肢が定番です。'},
  {h:'消火器本体への表示（銘板）'},
  {p:'消火器には、見やすい位置に次の事項を表示しなければなりません。全部で19項目ありますが、丸暗記ではなく「何のための情報か」でまとめると落ちにくくなります。'},
  {svg:'meiban',cap:'消火器本体に表示する事項'},
  {p:'使用方法は、手さげ式と据置式では図示も必要です。ホースの有効長は据置式だけが表示対象。取扱い上の注意事項には、加圧用ガス容器・指示圧力計に関する事項、安全上支障なく使用できる標準的な期間または期限、維持管理上適切な設置場所、点検に関する事項、廃棄時の連絡先などが含まれます。'},
  {h:'薬剤の容器・包装への表示'},
  {p:'品名、消火器の区別、消火薬剤の容量または質量、充てん方法、取扱い上の注意事項、製造年月、製造者名または商標、型式番号の8つ。能力単位は含まれません（能力単位は消火器本体の銘板に表示します）。'}
 ], q:['O719','O720','O721','O722','O723','O724','O725','O726','O727','O700','O789','O793','O794','O795']},

{id:'L619', t:'整備の手順 ── 分解・充てん・耐圧試験',
 b:[
  {p:'実技で手順を問われる範囲です。すべて暗記するのではなく、「なぜその順番なのか」が分かる箇所をいくつか押さえておけば、順序を入れ替えた選択肢は見破れます。'},
  {h:'耐圧性能に関する点検（水圧検査）'},
  {p:'製造年から10年を経過した消火器について実施し、以後3年ごと。手順はこうです。'},
  {tbl:[['','手順'],
        ['1','本体容器を分解し、消火薬剤を別の容器等に移す'],
        ['2','本体容器の内外を清掃し、腐食や防錆材料の脱落がないか確認する'],
        ['3','本体容器を水道水で満たしてキャップを締める'],
        ['4','ホース接続部に耐圧試験用接続金具を接続する'],
        ['5','容器に保護枠等をかぶせ、耐圧試験機を接続する'],
        ['6','レバーにレバー固定金具を取り付けてバルブを開いた状態にし、徐々に加圧する'],
        ['7','所定の水圧を5分間かけて、変形・損傷・漏れがないことを確認する'],
        ['8','排圧栓から水圧を排除し、圧力計の指針が0になったのを確認して排水する'],
        ['9','ウエスやエアブローガンで水分を除去する'],
        ['10','水分がないことを確認し、部品の組付けと消火薬剤の充てんを行う']]},
  {p:'薬剤を残したまま加圧することはありません。保護枠をかぶせるのは、万一破裂したときに破片が飛ぶのを防ぐためです。'},
  {p:'粉末消火器では特に水分が禁物です。ウエスやエアブローガンで拭いたうえで、乾燥炉などで十分に乾燥させてから充てんします。水分が残ると粉末が固化して機能しなくなります。'},

        ['地階、無窓階、3階以上の階で床面積50㎡以上','能力単位 ≧ 床面積 ÷ 算定基準面積'],
        ['少量危険物を貯蔵・取り扱う場所','能力単位 ≧ 取扱数量 ÷ 指定数量'],
        ['指定可燃物を貯蔵・取り扱う場所','能力単位 ≧ 取扱数量 ÷（危政令別表第4の数量 × 50）'],
        ['電気設備のある場所','個数 ≧ 床面積 ÷ 100㎡'],

  {p:'50㎡という数字は、延べ面積の150㎡・300㎡とは別物です。あちらは建物全体、こちらは階ごと。混同させる選択肢が出ます。'},
  {p:'なお指定可燃物については、取扱数量が危政令別表第4に指定する数量の500倍以上になると、大型消火器の設置が必要になります。算定式の中の「50倍」と、大型消火器が要る「500倍」は別の数字です。'},
  {h:'設置個数の減少'},
  {p:'消火器具を設置する場所に他の消火設備がある場合、その設備の有効範囲内については、消火器具の能力単位の合計を減らすことができます。'},
  {tbl:[['他の消火設備','減少できる能力単位'],
        ['大型消火器','1／2'],
        ['屋内消火栓設備、スプリンクラー設備','1／3'],
        ['水噴霧消火設備、泡消火設備、不活性ガス消火設備、ハロゲン化物消火設備、粉末消火設備','1／3']]},
  {p:'大型消火器だけが1／2で、固定式の消火設備はすべて1／3です。これを逆にした選択肢が定番になります。'},
  {h:'「1／3に減少」ではありません'},
  {p:'ここが最も間違えやすい点です。表の数字は「減らせる量」であって、「減らした後の値」ではありません。'},
  {p:'たとえば本来なら能力単位6が必要な部分にスプリンクラー設備を設置した場合、減らせるのは 6×1／3＝2 です。必要な能力単位は 6−2＝4 になります。2ではありません。能力単位2の小型消火器なら2本で足ります。'},
  {p:'「1／3に減少」と読むと答えが2になってしまいます。「1／3を減少できる」＝残るのは3分の2、と覚えてください。'},

  {p:'第一に、減らせるのは**その消火設備の有効範囲内の部分**についてだけで、建物全体ではありません。'},
  {p:'第二に、設置する消火設備の火災に対する適応性が、消火器の適応性と同じでなければ減少できません。B火災にしか適応しない設備を置いても、A火災に対する能力単位は減らせない、ということです。'}
 ], q:['O778','O779','O780','O781','O782','O717','O718']}

ko4: [
{id:'L401', t:'自動火災報知設備の全体像',
 b:[
  {p:'甲4は範囲が広く見えますが、構成要素は4つしかありません。まず信号の流れを頭に入れると、個別の基準がどこに効くのかが見えるようになります。'},
  {h:'信号の流れ'},
  {p:'感知器または発信機が火災を検出 → （中継器を経由することもある）→ 受信機が受信 → 火災灯の点灯・地区表示・主音響装置の鳴動 → 地区音響装置が建物内に報知。この一本道です。'},
  {tbl:[['機器','役割'],
        ['感知器','熱・煙・炎を自動的に検出する'],
        ['発信機','人が押しボタンで手動通報する'],
        ['中継器','信号を受けて受信機や消火設備へ発信する'],
        ['受信機','信号を受け、火災の発生と場所を表示・報知する'],
        ['地区音響装置','建物内の人に音で知らせる']]},
  {h:'警戒区域という考え方'},
  {p:'受信機は「どこで火災が起きたか」を表示しますが、部屋単位では表示灯が膨大になります。そこで建物を区画に分け、その単位で表示します。この区画が警戒区域です。原則、面積600㎡以下・一辺50m以下で、2以上の階にわたらないこととされています。'},
  {p:'例外もあります。主要な出入口からその内部を見通せる場合は1000㎡以下、光電式分離型感知器を設ける場合は一辺100m以下、2の階にわたる部分の床面積の合計が500㎡以下なら階をまたいでも可。階段やエレベーター昇降路などのたて穴区画は、別に警戒区域を設定します。'},
  {p:'「600㎡は面積の上限、500㎡は階をまたぐときの合計」という数字の役割の違いを意識してください。'}
 ], q:['K401','K402','K425']},

{id:'L402', t:'感知器の種類と作動原理',
 b:[
  {p:'何を検出するかで大きく3系統に分かれます。原理がわかると、どこに設置すべきか・どこに設置してはいけないかが自然に出てきます。'},
  {h:'熱感知器'},
  {tbl:[['種類','作動条件','設置に向く場所'],
        ['差動式','周囲の温度上昇率が一定以上','事務室、居室など温度変化の少ない場所'],
        ['定温式','周囲の温度が一定の温度以上','厨房、ボイラー室など常時高温の場所'],
        ['補償式','差動式と定温式の両方の性能','温度変化が緩やかな火災も想定される場所']]},
  {p:'差動式スポット型の中身は空気室（チャンバー）とダイヤフラムです。急激に温められると空気が膨張してダイヤフラムを押し上げ、接点が閉じます。ただし暖房のような緩やかな温度上昇では誤作動してほしくないので、逃がし穴（リーク孔）が付いていて、ゆっくりした膨張分は逃げるようになっています。'},
  {p:'ここから点検の要点が導けます。リーク孔が詰まれば逃げ場を失って誤作動（非火災報）が増え、逆に広がりすぎれば火災時も空気が逃げて作動が遅れます。'},
  {p:'定温式は、正常時の熱で作動しないよう、取付場所の最高周囲温度より20℃以上高い公称作動温度のものを選びます。'},
  {h:'煙感知器'},
  {p:'イオン化式と光電式があり、現在の主流は光電式です。光電式スポット型は、暗箱の中で発光素子の光が煙の粒子に当たって散乱し、その散乱光を受光素子が捉えることで作動します。光電式分離型は送光部と受光部を離して設置し、その間の光の減光量で判定します。公称監視距離は5m以上100m以下（5m刻み）。'},
  {p:'煙感知器を設けてはならないのは、厨房・浴室のように水蒸気が多量に滞留する場所、著しく高温になる場所、排気ガスが滞留する場所です。煙と紛らわしいものがあると誤作動するためで、これも原理から導けます。'},
  {h:'炎感知器'},
  {p:'炎から放射される紫外線または赤外線を検出します。天井が高くて熱や煙が感知器まで届かない場所（アトリウム、体育館、工場など）で使われます。'}
 ], q:['K410','K419','K435','K436','K438']},

{id:'L405', t:'配線・電源と、試験の方法',
 b:[
  {h:'感知器回路は送り配線にする'},
  {p:'感知器回路は分岐させず、末端まで一本につないだ送り配線とし、終端に発信機・押しボタン・回路試験器のいずれかを設けます。理由は、受信機側から回路の導通を確認できるようにするためです。分岐配線にすると、途中で断線しても検出できなくなります。'},
  {tbl:[['項目','基準'],
        ['共通線1本あたり','7警戒区域以下'],
        ['感知器回路の電路の抵抗','50Ω以下'],
        ['他の電線との同居','原則禁止。ただし60V以下の弱電流回路は例外として可'],
        ['絶縁抵抗','対地電圧150V以下で0.1MΩ以上（直流500Vの絶縁抵抗計で測定）']]},
  {h:'電源'},
  {p:'予備電源は密閉型蓄電池とし、監視状態を60分間継続した後、2回線を10分間有効に作動させられる容量が必要です。常用電源の停電時は自動的に予備電源へ切り替わり、復旧時は自動的に戻ります。'},
  {p:'非常電源は、延べ面積1000㎡以上の特定防火対象物では蓄電池設備によらなければなりません。'},
  {h:'主な試験'},
  {tbl:[['試験','目的','操作'],
        ['火災表示試験','火災灯・地区表示・音響の作動と自己保持を確認','火災表示試験スイッチと回線選択スイッチ'],
        ['回路導通試験','感知器回路の断線の有無を確認','導通試験スイッチと回線選択スイッチ'],
        ['同時作動試験','複数回線が同時に作動しても異常がないか','5回線を同時に作動させる'],
        ['予備電源試験','予備電源への切替と容量を確認','予備電源試験スイッチ']]},
  {p:'試験の名称と目的の組合せを入れ替えた選択肢が出ます。導通試験で調べられるのは断線だけで、音響装置の故障は現れない、といった切り分けが問われます。'}
 ], q:['K414','K415','K416','K421','K422','K440']},

{id:'L406', t:'電気の基礎（2電工の記憶を戻す）',
 b:[
  {p:'甲4の電気基礎で出るのは、2電工で扱った範囲のごく一部です。配線図記号も複線図も出ません。ここに挙げたものが繰り返し出るだけなので、忘れていても短時間で戻せます。'},
  {h:'直流の基本'},
  {p:'オームの法則 V＝IR。合成抵抗は、直列なら単純な和、並列なら 1/R＝1/R₁+1/R₂+…。並列の合成抵抗は必ず最小の抵抗より小さくなるので、この性質だけで選択肢を絞れることがよくあります。'},
  {p:'電力 P＝VI＝I²R＝V²/R。3つの形を使い分けられると計算が速くなります。'},
  {h:'コンデンサ'},
  {p:'抵抗と逆で、直列が 1/C＝1/C₁+1/C₂、並列が単純な和です。ここは間違えやすいので、抵抗と対にして覚えてください。'},
  {h:'交流'},
  {p:'インピーダンス Z＝√(R²+X²)。力率 cosθ＝R/Z。R＝8、X＝6でZ＝10という3:4:5の組合せが頻出です。'},
  {h:'その他'},
  {tbl:[['項目','要点'],
        ['導体の抵抗','R＝ρL/A。長さに比例、断面積に反比例'],
        ['変圧器','電圧は巻数に比例、電流は巻数に反比例'],
        ['ブリッジ回路','対辺の抵抗の積が等しいとき平衡'],
        ['可動コイル形計器','直流専用'],
        ['可動鉄片形計器','交流用'],
        ['電流力計形・熱電形','交直両用'],
        ['三相誘導電動機','任意の2線を入れ替えると逆回転']]}
 ], q:['K426','K427','K428','K429','K430','K431','K432','K433','K434']}
],

ko1: [
{id:'L101', t:'水系消火設備の全体像',

/* ============ 状態管理 ============ */
const KEY = 'shoubou-drill-v1';
const COURSES = ['otsu6','ko4','ko1'];   // 受験する順（乙6 → 甲4 → 甲1）
let S = load();
let cur = S.lastCourse || 'otsu6';
let session = null;

function blank(){
  const o = {lastCourse:'otsu6', log:{}, flags:{}, days:[], read:{}};
  return o;
}
function load(){
  try{
    const raw = localStorage.getItem(KEY);
    if(!raw) return blank();
    const d = JSON.parse(raw);
    return Object.assign(blank(), d);
  }catch(e){ return blank(); }
}
function save(){
  try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){}
}
function today(){ const d=new Date(); return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate(); }
function markDay(){
  const t = today();
  if(S.days[S.days.length-1] !== t){ S.days.push(t); if(S.days.length>400) S.days.shift(); save(); }
}
function streak(){
  if(!S.days.length) return 0;
  const ms = 86400000, base = new Date(); base.setHours(0,0,0,0);
  const set = new Set(S.days);
  let n = 0;
  for(let i=0;i<400;i++){
    const d = new Date(base.getTime()-i*ms);
    const k = d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate();
    if(set.has(k)) n++;
    else if(i>0) break;
  }
  return n;
}

/* 全問取得（法令共通を各コースに合流） */
function pool(cid){
  const c = BANK[cid];
  return BANK.common.concat(c.q);
}
function catsOf(cid){ return BANK[cid].cats; }

/* ============ 集計 ============ */
function statOf(cid){
  const qs = pool(cid), cats = catsOf(cid);
  const out = {};
  Object.keys(cats).forEach(k => out[k] = {n:0, done:0, ok:0});
  qs.forEach(q => {
    if(!out[q.c]) return;
    out[q.c].n++;
    const r = S.log[q.i];
    if(r && r.t > 0){ out[q.c].done++; if(r.o > 0) out[q.c].ok++; }
  });
  return out;
}
function wrongList(cid){
  return pool(cid).filter(q => { const r = S.log[q.i]; return r && r.t>0 && r.o < r.t; });
}
function flagList(cid){
  return pool(cid).filter(q => S.flags[q.i]);
}

/* ============ 画面：ホーム ============ */
const $ = id => document.getElementById(id);

function renderTabs(){
  $('tabs').innerHTML = COURSES.map(id =>
    `<button class="tab" role="tab" data-c="${id}" aria-selected="${id===cur}">
       <b>${BANK[id].name}</b><span>${BANK[id].sub}</span></button>`).join('');
  $('tabs').querySelectorAll('.tab').forEach(b => b.onclick = () => {
    cur = b.dataset.c; S.lastCourse = cur; save(); renderTabs(); renderHome();
  });
}

function renderHome(){
  show('home');
  renderLessonList();
  const cats = catsOf(cur), st = statOf(cur), qs = pool(cur);
  const done = Object.values(st).reduce((a,b)=>a+b.done,0);
  const ok = Object.values(st).reduce((a,b)=>a+b.ok,0);
  const rate = done ? Math.round(ok/done*100) : 0;

  $('gSub').textContent = `${BANK[cur].name}（${BANK[cur].sub}）　収録 ${qs.length}問　／　解答済 ${done}問　総合正答率 ${done?rate+'％':'—'}`;

  $('gRows').innerHTML = Object.keys(cats).map(k => {
    const s = st[k];
    const p = s.done ? Math.round(s.ok/s.done*100) : 0;
    const cls = !s.done ? '' : p<40 ? 'low' : p<60 ? 'mid' : 'hi';
    return `<div class="grow">
      <div class="glab">${cats[k]}</div>
      <div class="gtrack"><div class="gfill ${cls}" style="width:${s.done?p:0}%"></div><i class="l40"></i><i class="l60"></i></div>
      <div class="gnum">${s.done? p+'%' : '—'}</div>
    </div>`;
  }).join('');

  const w = wrongList(cur).length, f = flagList(cur).length;
  $('wrongDesc').textContent = w ? `誤答した ${w}問` : '誤答した問題はまだありません';
  $('flagDesc').textContent = f ? `印をつけた ${f}問` : '印をつけた問題はありません';
  $('mWrong').disabled = !w;
  $('mFlag').disabled = !f;
  const mk = BANK[cur].mock;
  $('mockDesc').textContent = '本番配分 ' + Object.keys(mk).map(k=>mk[k]).reduce((a,b)=>a+b,0) + '問（不足分は収録数まで）';

  $('cats').innerHTML = Object.keys(cats).map(k => {
    const s = st[k];
    return `<div class="catrow">
      <b>${cats[k]}</b>
      <em>${s.done}／${s.n}問</em>
      <button class="mini" data-cat="${k}">解く</button>
    </div>`;
  }).join('');
  $('cats').querySelectorAll('.mini').forEach(b => b.onclick = () => startCat(b.dataset.cat));

  const total = COURSES.reduce((a,id)=>a+pool(id).length,0);
  const lsAll = COURSES.reduce((a,id)=>a+lessonsOf(id).length,0);
  const st2 = streak();
  $('foot').innerHTML = `全3コース 講義 ${lsAll}単元・収録 ${total}問。${st2?`連続学習 ${st2}日。`:''}
    解答の記録はこの端末のブラウザにのみ保存されます。
    <button id="btnReset">${BANK[cur].name}の記録を消去</button><br>
    問題は試験範囲に沿って書き下ろしたもので、実際の試験問題ではありません。
    法令や規格が改正されている可能性があるため、最終確認は必ず最新のテキストで行ってください。`;
  $('btnReset').onclick = () => {
    if(!confirm(BANK[cur].name + 'の解答記録と見直し印を消去します。よろしいですか。')) return;
    pool(cur).forEach(q => { delete S.log[q.i]; delete S.flags[q.i]; });
    lessonsOf(cur).forEach(l => delete S.read[l.id]);
    save(); renderHome();
  };
}

function show(which){
  ['home','lesson','quiz','result'].forEach(id => $(id).classList.toggle('hide', id!==which));
  window.scrollTo({top:0, behavior:'instant'});
}

/* ============ 出題 ============ */
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]];} return a; }

function begin(list, label){
  if(!list.length) return;
  session = {qs:list, i:0, res:[], label:label};
  markDay();
  renderQ();
}
function startCat(k){
  const list = shuffle(pool(cur).filter(q=>q.c===k));
  begin(list, catsOf(cur)[k]);
}
function startMode(m){
  if(m==='random') return begin(shuffle(pool(cur)).slice(0,20), 'ランダム20問');
  if(m==='wrong')  return begin(shuffle(wrongList(cur)), '間違い直し');
  if(m==='flag')   return begin(shuffle(flagList(cur)), 'チェック済み');
  if(m==='mock'){
    const mk = BANK[cur].mock, out = [];
    Object.keys(mk).forEach(k => {
      out.push(...shuffle(pool(cur).filter(q=>q.c===k)).slice(0, mk[k]));
    });
    return begin(out, '模擬試験');
  }
}

function renderQ(){
  show('quiz');
  const q = session.qs[session.i];
  const cats = catsOf(cur);
  $('qCat').textContent = cats[q.c] || '';
  $('qId').textContent = q.i;
  $('qCnt').textContent = `${session.label}　${session.i+1} / ${session.qs.length}`;
  $('qText').textContent = q.q;
  $('qExp').classList.add('hide');
  $('btnNext').classList.add('hide');
  $('btnFlag').classList.toggle('on', !!S.flags[q.i]);
  $('btnFlag').textContent = S.flags[q.i] ? '見直し印を外す' : '見直し印';

  const order = shuffle(q.o.map((_,n)=>n));
  session.order = order;
  session.ansPos = order.indexOf(q.a);
  $('qChoices').innerHTML = order.map((src,pos) =>
    `<button class="ch" data-n="${pos}"><u>${pos+1}</u><span>${q.o[src]}</span></button>`).join('');
  $('qChoices').querySelectorAll('.ch').forEach(b => b.onclick = () => answer(+b.dataset.n));
}

function answer(n){
  const q = session.qs[session.i];
  const ansPos = session.ansPos;
  const ok = (n === ansPos);
  const r = S.log[q.i] || {t:0,o:0};
  r.t++; if(ok) r.o++;
  S.log[q.i] = r; save();
  session.res.push({q:q, ok:ok, pick:n});

  $('qChoices').querySelectorAll('.ch').forEach(b => {
    const bn = +b.dataset.n;
    b.disabled = true;
    if(bn === n) b.classList.add(ok ? 'pick-ok' : 'pick-ng');
    else if(bn === ansPos) b.classList.add('reveal');
    else b.classList.add('dim');
  });
  $('qVerdict').textContent = ok ? '正解' : '不正解　正答は ' + (ansPos+1);
  $('qVerdict').className = 'verdict ' + (ok ? 'ok' : 'ng');
  $('qExpText').textContent = q.e;
  $('qExp').classList.remove('hide');
  const last = session.i === session.qs.length - 1;
  $('btnNext').textContent = last ? '結果を見る' : '次の問題';
  $('btnNext').classList.remove('hide');
  $('btnNext').focus();
}

$('btnNext').onclick = () => {
  if(session.i === session.qs.length - 1) return renderResult();
  session.i++; renderQ();
};
$('btnFlag').onclick = () => {
  const q = session.qs[session.i];
  if(S.flags[q.i]) delete S.flags[q.i]; else S.flags[q.i] = 1;
  save();
  $('btnFlag').classList.toggle('on', !!S.flags[q.i]);
  $('btnFlag').textContent = S.flags[q.i] ? '見直し印を外す' : '見直し印';
};
$('btnQuit').onclick = () => { session = null; renderHome(); };
$('btnHome').onclick = () => { session = null; renderHome(); };
$('btnLsCont').onclick = () => { session = null; openLesson(lsIdx + 1); };
$('btnRetryWrong').onclick = () => {
  const list = session.res.filter(r=>!r.ok).map(r=>r.q);
  begin(shuffle(list), '誤答の再挑戦');
};

function renderResult(){
  show('result');
  const n = session.res.length, ok = session.res.filter(r=>r.ok).length;
  const p = Math.round(ok/n*100);
  $('rScore').innerHTML = `${p}<small>％</small>`;
  $('rSub').textContent = `${session.label}　${n}問中 ${ok}問正解`;
  const pass = p >= 60;
  $('rJudge').innerHTML = `<span class="judge ${pass?'pass':'fail'}">${pass?'合格ライン到達':'合格ラインまであと'+(Math.ceil(n*0.6)-ok)+'問'}</span>`;
  $('rList').innerHTML = session.res.map((r,idx) =>
    `<div class="rrow"><span class="${r.ok?'o':'x'}">${r.ok?'○':'×'}</span><div>${idx+1}. ${r.q.q}</div></div>`).join('');
  $('btnRetryWrong').classList.toggle('hide', ok === n);
  const isLs = session.label.indexOf('第') === 0;
  $('btnLsCont').classList.toggle('hide', !isLs || lsIdx >= lessonsOf(cur).length-1);
}

/* ============ 講義 ============ */
let lsIdx = 0;

function lessonsOf(cid){ return LESSONS[cid] || []; }

function renderLessonList(){
  const ls = lessonsOf(cur);
  if(!ls.length){ $('learnPanel').classList.add('hide'); return; }
  $('learnPanel').classList.remove('hide');
  $('lessons').innerHTML = ls.map((l,n) => {
    const done = S.read[l.id];
    return `<button class="lsrow ${done?'done':''}" data-n="${n}">
      <i>${done?'✓':n+1}</i><b>${l.t}</b><em>${(l.q||[]).length}問</em></button>`;
  }).join('');
  $('lessons').querySelectorAll('.lsrow').forEach(b => b.onclick = () => openLesson(+b.dataset.n));
}

function openLesson(n){
  const ls = lessonsOf(cur);
  if(n < 0 || n >= ls.length) return renderHome();
  lsIdx = n;
  const l = ls[n];
  show('lesson');
  $('lsNo').textContent = '第' + (n+1) + '講';
  $('lsOf').textContent = BANK[cur].name + '　' + (n+1) + ' / ' + ls.length;
  $('lsTitle').textContent = l.t;
  $('lsBody').innerHTML = l.b.map(x => {
    if(x.h) return '<h3>' + esc(x.h) + '</h3>';
    if(x.p) return '<p>' + esc(x.p) + '</p>';
    if(x.svg && FIG[x.svg]) return '<figure class="fig">' + FIG[x.svg] +
      (x.cap ? '<figcaption>' + esc(x.cap) + '</figcaption>' : '') + '</figure>';
    if(x.tbl){
      const [head, ...rows] = x.tbl;
      return '<table><thead><tr>' + head.map(c=>'<th>'+esc(c)+'</th>').join('') +
             '</tr></thead><tbody>' + rows.map(r=>'<tr>'+r.map(c=>'<td>'+esc(c)+'</td>').join('')+'</tr>').join('') +
             '</tbody></table>';
    }
    return '';
  }).join('');
  const qn = (l.q||[]).length;
  $('btnLsQuiz').textContent = qn ? `この単元の問題を解く（${qn}問）` : '一覧にもどる';
  $('btnLsNext').classList.toggle('hide', n === ls.length-1);
  S.read[l.id] = 1; save();
}
function esc(t){ return String(t).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }

$('btnLsQuiz').onclick = () => {
  const l = lessonsOf(cur)[lsIdx];
  const ids = l.q || [];
  if(!ids.length) return renderHome();
  const map = {}; pool(cur).forEach(q => map[q.i] = q);
  const list = ids.map(id => map[id]).filter(Boolean);
  begin(shuffle(list), '第' + (lsIdx+1) + '講　' + l.t);
};
$('btnLsNext').onclick = () => openLesson(lsIdx + 1);
$('btnLsBack').onclick = () => renderHome();

document.querySelectorAll('.mode').forEach(b => b.onclick = () => startMode(b.dataset.mode));
renderTabs();
renderHome();
</script>
